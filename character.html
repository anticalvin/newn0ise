<style>
:root{--lab:ui-monospace,Menlo,Consolas,monospace;--disp:system-ui,-apple-system,'Segoe UI',sans-serif;--fg:#f2efe8;--bgc:rgba(18,18,20,.78);--ln:rgba(255,255,255,.16);--ac:#ff5a1f}
html[data-t=l]{--fg:#111;--bgc:rgba(255,255,255,.8);--ln:rgba(0,0,0,.16)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0c;color:var(--fg);font:600 12px var(--lab)}
html[data-t=l] body{background:#f2f0ec}
#fc{position:fixed;inset:0;display:block;touch-action:none;outline:none}
.glass{background:var(--bgc);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--ln);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.35)}
#top{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:6px;align-items:center;z-index:5}
#top h1{margin:0 auto 0 4px;font:800 16px var(--disp);letter-spacing:-.01em}
a{color:inherit}button,.btn{font:inherit;color:inherit;cursor:pointer}
.b{min-height:44px;min-width:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;letter-spacing:.05em;text-transform:uppercase;font-size:11px}
.b.go{background:var(--ac);color:#111;border-color:transparent}
#panel{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;border-radius:26px;padding:8px;display:flex;flex-direction:column;gap:6px;max-height:46dvh}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-height:44px;padding:0 12px;border:0;border-radius:14px;background:transparent;letter-spacing:.05em;text-transform:uppercase;font-size:11px;font-weight:700}
.tab[aria-selected=true]{background:var(--fg);color:var(--bgc);color:#111}html[data-t=d] .tab[aria-selected=true]{background:#f2efe8;color:#111}html[data-t=l] .tab[aria-selected=true]{background:#111;color:#f2f0ec}
#fp{overflow-y:auto;padding:2px 6px 6px;display:flex;flex-direction:column;gap:4px;min-height:0}
.row{display:flex;align-items:center;gap:12px;min-height:44px}.row>span{flex:none;width:92px;opacity:.75}
.row input[type=range]{flex:1;min-width:0;min-height:36px;accent-color:var(--ac)}
.row.sw{align-items:flex-start;flex-wrap:wrap;padding:4px 0}.swatches,.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.swatches button{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln)}.swatches button[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 2px var(--ac)}
.chip{min-height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--ln);background:transparent}.chip[aria-pressed=true]{background:var(--fg);color:#111}html[data-t=d] .chip[aria-pressed=true]{background:#f2efe8}html[data-t=l] .chip[aria-pressed=true]{background:#111;color:#f2f0ec}
#ft{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);z-index:9;padding:10px 16px;border-radius:16px;max-width:calc(100vw - 24px)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media (min-width:860px){#panel{left:auto;right:16px;top:70px;bottom:16px;width:380px;max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
