<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover,maximum-scale=1,user-scalable=no">

<link rel="manifest" href="manifest.webmanifest">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"

</script>
<link rel="stylesheet" href="ui/ui.css">
<style>
:root{--lab:ui-monospace,Menlo,Consolas,monospace;--disp:system-ui,-apple-system,'Segoe UI',sans-serif;--fg:#f2efe8;--bgc:rgba(18,18,20,.78);--ln:rgba(255,255,255,.16);--ac:#e9dfcb}
html[data-t=l]{--fg:#111;--bgc:rgba(255,255,255,.8);--ln:rgba(0,0,0,.16)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0c;color:var(--fg);font:600 12px var(--lab)}
html[data-t=l] body{background:#f2f0ec}
#fc{position:fixed;inset:0;display:block;touch-action:none;outline:none}
.glass{background:var(--bgc);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--ln);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.35)}
#top{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:6px;align-items:center;z-index:5}
#top h1{margin:0 auto 0 4px;font:800 16px var(--disp);letter-spacing:-.01em}
a{color:inherit}button,.btn{font:inherit;color:inherit;cursor:pointer}
.b{min-height:44px;min-width:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;letter-spacing:.05em;text-transform:uppercase;font-size:11px}
.b.go{background:var(--ac);color:#111;border-color:transparent}
#panel{position:fixed;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5;border-radius:26px;padding:4px 8px 8px;display:flex;flex-direction:column;gap:4px;max-height:44dvh;transition:max-height .28s cubic-bezier(.2,.9,.3,1.1)}
#panel[data-lvl="0"]{max-height:112px}#panel[data-lvl="0"] #fp,#panel[data-lvl="0"] #facts{display:none}#panel[data-lvl="2"]{max-height:82dvh}
#fhandle{border:0;background:none;min-height:44px;margin:-4px 0 -14px;display:grid;place-items:center;touch-action:none;color:inherit}#fhandle i{width:44px;height:5px;border-radius:3px;background:currentColor;opacity:.4}
#facts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:2px}#facts .b{flex:none}#facts .go{flex:1;min-width:120px}
.tiles{display:flex;gap:6px;overflow-x:auto;flex:1 1 100%;padding:2px 2px 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tile{flex:none;width:68px;min-height:88px;padding:4px;border-radius:14px;border:1px solid var(--ln);background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;color:inherit}
.tile img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:rgba(128,128,128,.15)}.tile b{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:rgba(128,128,128,.15)}
.tile small{font:600 9px var(--lab);line-height:1.1;text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.row.sw>span:first-child{flex:1 1 100%;width:auto}
h3{margin:10px 0 2px;font:800 12px var(--lab);letter-spacing:.1em;text-transform:uppercase;opacity:.6}output{width:64px;text-align:right;opacity:.7}
#fload{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;padding:16px 22px;border-radius:20px;max-width:calc(100vw - 32px);text-align:center}#fload[hidden]{display:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-height:44px;padding:0 12px;border:0;border-radius:14px;background:transparent;letter-spacing:.05em;text-transform:uppercase;font-size:11px;font-weight:700}
.tab[aria-selected=true]{background:var(--fg);color:var(--bgc);color:#111}html[data-t=d] .tab[aria-selected=true]{background:#f2efe8;color:#111}html[data-t=l] .tab[aria-selected=true]{background:#111;color:#f2f0ec}
#panel>.tabs,#panel>#facts,#panel>#fhandle{flex:none}#fp>*{flex:none}#fp{flex:1 1 auto;overflow-y:auto;padding:2px 6px 6px;display:flex;flex-direction:column;gap:4px;min-height:0}
.row{display:flex;align-items:center;gap:12px;min-height:44px}.row>span{flex:none;width:92px;opacity:.75}
.row input[type=range]{flex:1;min-width:0;min-height:36px;accent-color:var(--ac)}
.row.sw{align-items:flex-start;flex-wrap:wrap;padding:4px 0}.swatches,.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.swatches button{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln)}.swatches button[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 2px var(--ac)}
.chip{min-height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--ln);background:transparent}.chip[aria-pressed=true]{background:var(--fg);color:#111}html[data-t=d] .chip[aria-pressed=true]{background:#f2efe8}html[data-t=l] .chip[aria-pressed=true]{background:#111;color:#f2f0ec}
#ft{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);z-index:9;padding:10px 16px;border-radius:16px;max-width:calc(100vw - 24px)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media (min-width:860px){#panel{left:auto;right:16px;top:70px;bottom:16px;width:400px;max-height:none}#fhandle{display:none}#panel[data-lvl="0"] #fp,#panel[data-lvl="0"] #facts{display:flex}}
@media (max-width:520px){#top h1{display:none}#top{justify-content:space-between}}
@media (prefers-reduced-motion:reduce){:root *{transition:none}}
</style>
<script src="touch-guard.js"></script></head>
<body>
<canvas id="fc" tabindex="0" aria-label="Character preview. Drag to turn, pinch or scroll to zoom."></canvas>
<div id="top">
  <a class="b glass" href="studio.html" aria-label="Back to 3D">‹ 3D</a>
  <h1>Character</h1>
  <button class="b glass" id="fundo" type="button" aria-label="Undo">↶</button>
  <button class="b glass" id="fredo" type="button" aria-label="Redo">↷</button>
  <button class="b glass" id="fface" type="button" aria-label="Zoom to face">Face</button>
  <button class="b glass" id="ftheme" type="button" aria-label="Light or dark">◐</button>
</div>
<div id="panel" class="glass" data-lvl="1">
  <button id="fhandle" type="button" aria-label="Resize panel"><i></i></button>
  <div class="tabs" id="ftabs" role="tablist" aria-label="Character sections"></div>
  <div id="fp"></div>
  <div id="facts">
    <button class="b glass" id="fpre" type="button">Preset</button><button class="b glass" id="frand" type="button">Random</button><button class="b glass" id="freset" type="button">Reset</button>
    <button class="b glass" id="fjson" type="button" title="Download the editable character (sliders and choices) as a small file">Save look</button><button class="b glass" id="fdl" type="button" title="Download the rigged model as a .glb file">Export .glb</button><button class="b go" id="f3d" type="button" title="Send this character to the 3D editor, rigged and posed">Open in 3D</button>
  </div>
</div>
<div id="fload" class="glass" role="status">Loading the character…</div>
<div id="ft" class="glass" role="status" hidden></div>
<script type="module" src="assets/figure.js?v=29cd5e1d"></script>
</body>
</html>
