<!doctype html>
<html lang="en" data-skin="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0b0c">
<title>n0ise 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",

<link rel="stylesheet" href="tokens.css">
<style>
:root{--rad:2px;--lab:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--disp:'Syne',system-ui,sans-serif;
  --bg:#0b0b0c;--panel:#111113;--raise:#1a1a1d;--line:#2b2b2f;--ink:#e8e6e1;--mute:#85838c;--accent:#ff5a1f;--on-accent:#150a04;--stage:#050506;--hot:#ff5a1f;color-scheme:dark;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
:root[data-skin=parchment]{--bg:#e6d9bb;--panel:#f0e6cb;--raise:#e0d1ac;--line:#b8a47a;--ink:#2b1d12;--mute:#7a6648;--accent:#9b2d20;--on-accent:#f7eed8;--stage:#2b1d12;--hot:#9b2d20;color-scheme:light}
:root[data-skin=utility]{--bg:#b9b9b9;--panel:#d0d0d0;--raise:#e4e4e4;--line:#7d7d7d;--ink:#111;--mute:#454545;--accent:#1c2f6e;--on-accent:#fff;--stage:#222;--hot:#a31515;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:500 12px/1.4 var(--lab);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 6px) 10px 6px;border-bottom:1px solid var(--line);background:var(--bg);z-index:5}
.logo{font:800 17px/1 var(--disp);letter-spacing:-.02em}.logo b{color:var(--accent);font-weight:800}
.logo small{font:600 9px var(--lab);letter-spacing:.16em;color:var(--mute);margin-left:8px;text-transform:uppercase}
.grow{flex:1}
.btn{min-height:32px;padding:0 12px;border:1px solid var(--line);background:var(--raise);border-radius:var(--rad);font:700 10px var(--lab);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
.main{flex:1;min-height:0;position:relative;display:flex}
#stage{position:relative;flex:1;min-width:0;background:var(--stage);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:absolute;display:flex;gap:4px;z-index:2;pointer-events:none}
.hud>*{pointer-events:auto}
.hud.tl{left:8px;top:8px}.hud.tr{right:8px;top:8px}.hud.bl{left:8px;bottom:10px}.hud.br{right:8px;bottom:10px}
.seg{display:flex;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.seg button{border:0;background:none;padding:0 7px;min-height:30px;font:700 8.5px var(--lab);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chipb{min-height:30px;padding:0 10px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:700 9px var(--lab);letter-spacing:.1em;text-transform:uppercase;border-radius:var(--rad)}
.chipb[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.drop{position:absolute;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);border:2px dashed var(--accent);z-index:6;font:700 12px var(--lab);letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
#stage.drag .drop{display:grid}
.empty{position:absolute;left:0;right:0;top:34%;text-align:center;color:var(--mute);pointer-events:none;font:600 10px var(--lab);letter-spacing:.14em;text-transform:uppercase;z-index:1}
.empty b{display:block;font:800 22px var(--disp);letter-spacing:-.02em;color:var(--ink);text-transform:none;margin-bottom:6px}
.err{position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute);background:var(--stage)}

/* sheet (mobile) */
#sheet{position:absolute;left:0;right:0;bottom:0;height:var(--fullh,88%);display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);border-radius:var(--rad) var(--rad) 0 0;z-index:4;transform:translate3d(0,0,0);will-change:transform;contain:layout paint}
.grab{flex:none;height:22px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab::after{content:"";width:34px;height:3px;background:var(--line)}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--line);touch-action:none}
.tab{flex:1;min-height:38px;border:0;background:none;font:700 10px var(--lab);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.panes{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-b) + 40px)}
.sec{border-bottom:1px solid var(--line);padding:10px 12px}
.st{font:700 9px var(--lab);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;min-height:30px}
.row label{font:600 10px var(--lab);letter-spacing:.06em;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row output{text-align:right;font-size:11px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;margin:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:18px;background:var(--ink);border:0;margin-top:-8px;border-radius:1px}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:18px;background:var(--ink);border:0;border-radius:1px}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:30px;padding:0 10px;border:1px solid var(--line);background:var(--raise);border-radius:var(--rad);font:700 9.5px var(--lab);letter-spacing:.08em;text-transform:uppercase}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{flex:none;width:46px;height:28px;border:1px solid var(--line);border-radius:var(--rad);padding:0}
.sw[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px}
.olist{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:34px 1fr auto 34px;align-items:center;min-height:40px;border-bottom:1px solid var(--line)}
.orow[aria-selected=true]{background:var(--raise);box-shadow:inset 2px 0 0 var(--accent)}
.orow button{border:0;background:none;min-height:40px;text-align:left;padding:0 6px}
.orow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.badge{font:700 8.5px var(--lab);letter-spacing:.12em;color:var(--mute);text-transform:uppercase;padding-right:6px}
.card{border:1px solid var(--line);background:var(--raise);border-radius:var(--rad);padding:10px;margin-bottom:8px}
.card h4{margin:0 0 4px;font:800 14px var(--disp);letter-spacing:-.01em}
.card p{margin:0 0 8px;color:var(--mute);font-size:10.5px;line-height:1.5}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.note{color:var(--mute);font-size:10px;line-height:1.5;padding:4px 0}
details.acc{border-bottom:1px solid var(--line)}
details.acc>summary{list-style:none;min-height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:700 9.5px var(--lab);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";color:var(--mute)}details.acc[open]>summary::after{content:"–"}
details.acc>.in{padding:0 12px 10px}
.sub{font:700 9px var(--lab);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:8px 0 2px}
.field{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:var(--rad);padding:6px 8px}
.cutbar{position:absolute;left:50%;top:calc(var(--safe-t) + 56px);transform:translateX(-50%);width:min(320px,86%);background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:8px 10px;z-index:6;font:700 10px var(--lab);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}.cutbar .prog{margin:6px 0 0}
#wipe{position:absolute;pointer-events:none;z-index:4;overflow:hidden}#wipe img{position:absolute;inset:0;width:100%;height:100%;display:block}#wipe i{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink)}
#wipebar{position:absolute;left:50%;bottom:calc(var(--safe-b) + 14px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:5;font:700 9px var(--lab);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:6px 10px}#wipebar input{width:min(160px,28vw)}#wipe[hidden],#wipebar[hidden]{display:none}.cutbar[hidden]{display:none}
.prog{height:2px;background:var(--line);margin:6px 0}.prog i{display:block;height:100%;width:0;background:var(--accent)}

/* scan modal */
#scan{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;color:#e8e6e1}
#scan video,#scan canvas.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#scan .top{position:relative;z-index:2;display:flex;gap:6px;align-items:center;padding:calc(var(--safe-t) + 8px) 10px 8px;background:linear-gradient(#000c,transparent)}
#scan .bot{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px 12px calc(var(--safe-b) + 12px);background:linear-gradient(transparent,#000d);display:flex;flex-direction:column;gap:8px}
#scan .ring{display:flex;gap:2px;height:6px}#scan .ring i{flex:1;background:#ffffff33}#scan .ring i.on{background:var(--accent)}
#scan .shutter{width:68px;height:68px;border-radius:50%;border:3px solid #fff;background:none;position:relative}
#scan .shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
#scan .shutter[disabled]{opacity:.35}
#scan .ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px}
#scan .msg{font:600 10px var(--lab);letter-spacing:.08em;text-align:center;color:#ddd}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:var(--rad);z-index:40;font:700 10px var(--lab);letter-spacing:.08em;text-transform:uppercase;max-width:90vw;text-align:center}
.sheetwrap{position:fixed;inset:0;z-index:30;background:#000c;display:grid;place-items:center;padding:20px}
.sheetwrap>div{max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}
.sheetwrap img,.sheetwrap video{max-width:100%;max-height:60vh;border-radius:var(--rad)}

@media (min-width:900px){
  .main{flex-direction:row}
  #sheet{position:relative;transform:none!important;height:auto;width:380px;border-top:0;border-left:1px solid var(--line);border-radius:0}
  .grab{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.btn.lnk{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
#fxov{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
#fxov.bg{visibility:hidden;pointer-events:none}
#fxov .fxtop{flex:none;display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 6px) 10px 6px;border-bottom:1px solid var(--line)}
#fxov .fxtop b{font:700 11px var(--lab);letter-spacing:.12em;text-transform:uppercase}
#fxov .fxtop span{font:500 10px var(--lab);color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fxov iframe{flex:1;min-height:0;width:100%;border:0;background:var(--bg)}

/* no sideways scrolling anywhere: rows wrap */
.chips{flex-wrap:wrap;overflow:visible}
.restore{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:60;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:#0a0a0a;border:1px solid #3a3835;color:#f2efe8;font:500 12px/1.35 var(--lab,monospace);border-radius:3px}.restore span{flex:1 1 200px}

body[data-walk] #sheet,body[data-walk] header.bar,body[data-walk] .hud,body[data-walk] #empty{display:none!important}
#walkui{position:fixed;inset:0;z-index:40;pointer-events:none;display:none}
body[data-walk] #walkui{display:block}
#walkui button{pointer-events:auto;min-height:44px;min-width:44px;padding:0 14px;border:1px solid #3a3835;background:rgba(10,10,10,.8);color:#f2efe8;font:600 12px var(--lab,monospace);text-transform:uppercase;letter-spacing:.08em;border-radius:3px}
#walkX{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0px))}
#walkJump{position:absolute;right:18px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%!important}
#walkHint{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font:500 11px var(--lab,monospace);color:#f2efe8;text-shadow:0 1px 2px #000;padding:0 12px}
#walkStick{position:absolute;width:100px;height:100px;border:2px solid rgba(242,239,232,.6);border-radius:50%}
#walkStick i{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:rgba(242,239,232,.8)}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.wtile{min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line,#333);background:transparent;color:var(--ink,#eee);border-radius:3px;padding:4px 2px;font:600 10px var(--lab,monospace);text-transform:uppercase;letter-spacing:.06em}
.wtile:active{background:var(--ink,#eee);color:var(--bg,#000)}.wtile:focus-visible{outline:2px solid var(--accent,#f60);outline-offset:2px}
body[data-recording='1']::after{content:'';position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:12px;height:12px;border-radius:50%;background:#ff3b2f;z-index:70;animation:recp 1s steps(2) infinite}@keyframes recp{50%{opacity:.2}}@media (prefers-reduced-motion:reduce){body[data-recording='1']::after{animation:none}}
.fxnote{align-self:center;margin-right:8px;font:600 10.5px var(--lab,monospace);color:var(--ink,#eee);background:rgba(10,10,10,.75);padding:4px 8px;border-radius:3px;max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fxnote:empty{display:none}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="logo" href="index.html" aria-label="n0ise home" style="text-decoration:none;color:inherit">n<b>0</b>ise<small>3D</small></a>
    <div class="grow"></div>
    <a class="btn lnk" id="bLab" href="effects.html">Lab</a>
    <button class="btn" id="bImport">Import</button>
    <button class="btn pri" id="bExport">Export</button>
  </header>
  <nav class="ws" aria-label="Workspaces"><a href="effects.html?cam=1">Camera</a><a href="effects.html">Effects</a><a href="studio.html" aria-current="page">3D</a><a href="studio.html#world">World</a></nav>
  <div class="main">
    <div id="stage">
      <canvas id="gl" tabindex="0"></canvas>
      <div class="hud tl"><div class="seg" id="viewSeg"></div></div>
      <div class="hud tr"><span id="fxnote" class="fxnote" aria-live="polite"></span><button class="chipb" id="bFx" aria-pressed="true">FX</button></div>
      <div class="hud bl" id="hudBL"><button class="chipb" id="bFrame">Frame</button><button class="chipb" id="bGrid" aria-pressed="true">Grid</button><button class="chipb" id="bWalk">Walk</button><button class="chipb" id="bSpin" aria-pressed="false">Spin</button></div>
      <div class="hud br" id="hudBR"><button class="chipb" id="bHold">Hold: original</button></div>
      <div class="empty" id="empty"><b>Bring a model, a photo or a scan.</b>glb · gltf · obj · stl · ply · splat · spz · audio — or use the Scan tab</div>
      <div class="drop">Drop files to import</div>
      <div class="err" id="err" hidden></div>
    </div>
    <section id="sheet" aria-label="Controls">
      <div class="grab" id="grab" role="button" tabindex="0" aria-label="Resize panel"></div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="panes" id="panes"></div>
    </section>
  </div>
</div>
<input type="file" id="file" multiple hidden accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.glb,.gltf,.bin,.obj,.mtl,.stl,.ply,.splat,.spz,.ksplat,.sog,image/*,video/*">
<section id="scan" hidden></section>
<div id="fxov" class="bg"><div class="fxtop"><b>Effects</b><span>Pick and tune effects. They apply to the selected object only.</span><button class="btn pri" id="fxdone">Done</button></div><iframe id="fxif" title="n0ise effects" allow="autoplay"></iframe></div>
<script type="module" src="assets/studio.js?v=bf552195"></script>
</body>
</html>
