*{box-sizing:border-box}
body{margin:0;min-width:280px;min-height:100dvh;color:var(--ink);background:radial-gradient(ellipse at 50% 6%,#252320 0%,#171615 46%,#10100f 85%);accent-color:#e5ded2}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid #e9dfcb;outline-offset:3px}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.34;cursor:default}
[hidden]{display:none!important}
svg{width:20px;height:20px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.shell{max-width:970px;margin:auto;padding:0 24px 25px}
.header{height:73px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:19px}
.wordmark{justify-self:start;display:inline-block;width:max-content;font-size:23px;line-height:1;font-weight:500;letter-spacing:.015em;transform:scaleX(1.14);transform-origin:left}
.nav{display:flex;align-items:center;gap:4px;padding:3px;background:#100f0e;border:1px solid #ffffff10;border-radius:24px}
.nav button{padding:8px 15px;border-radius:22px;color:var(--quiet);white-space:nowrap;font-size:13px}
.nav [aria-selected=true]{background:#33312e;color:#f5f0e8;box-shadow:inset 0 0 0 1px #ffffff15}
.header>.round{justify-self:end}
.round{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff12;flex:none}
.round[aria-pressed=true]{background:#e9e0d32c;border-color:#e9e0d36b;color:#fff}
.glass{background:linear-gradient(155deg,#e4dcd733,#d2c6b819 65%,#d7c8b62d);backdrop-filter:blur(15px);box-shadow:inset 0 1px 1px #ffffff12}
.view{margin:auto;position:relative}
.portrait{width:min(100%,510px);height:clamp(670px,calc(100dvh - 112px),900px);overflow:hidden;isolation:isolate;background:#0c0b0b;border:1px solid #fbf1df31;border-radius:33px;box-shadow:0 20px 70px #0007,inset 0 1px 1px #fff2}
.viewbar{position:absolute;top:0;left:0;right:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:62px;padding:0 19px;background:linear-gradient(#080808cf,transparent);pointer-events:none}
.viewbar .round{justify-self:end;width:36px;height:36px;pointer-events:auto}
.viewbar .wordmark{font-size:21px;font-weight:400;letter-spacing:.035em;transform:scaleX(1.21)}
.view-title,.caps{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#d2ccc4}
.camera-art{position:absolute;inset:40px 0 0;background:var(--camera) center 40%/cover no-repeat;transform:scale(var(--zoom,1)) scaleX(var(--face,1));filter:brightness(var(--exposure,1));transition:transform .32s,filter .22s}
.camera-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,#070707 0%,transparent 16% 57%,#17151244 73%,#171512eb 100%)}
.reticle{position:absolute;display:grid;place-items:center;width:68px;height:61px;left:50%;top:56%;transform:translate(-50%,-50%);color:#fff9;pointer-events:none}
.reticle::before{position:absolute;inset:0;content:"";--corner:#ffffff50;--tick:13px;background:linear-gradient(var(--corner),var(--corner)) top left/var(--tick) 1px,linear-gradient(var(--corner),var(--corner)) top left/1px var(--tick),linear-gradient(var(--corner),var(--corner)) top right/var(--tick) 1px,linear-gradient(var(--corner),var(--corner)) top right/1px var(--tick),linear-gradient(var(--corner),var(--corner)) bottom left/var(--tick) 1px,linear-gradient(var(--corner),var(--corner)) bottom left/1px var(--tick),linear-gradient(var(--corner),var(--corner)) bottom right/var(--tick) 1px,linear-gradient(var(--corner),var(--corner)) bottom right/1px var(--tick);background-repeat:no-repeat}
.reticle svg{width:23px;height:23px;stroke-width:.8}
.reticle.focusing{color:#fff;animation:focus .28s ease-out}

  #effects .effect-art{position:relative;inset:auto;height:auto;min-height:0;background:#0a0a0a;display:grid;place-items:center}
  #effects .effect-art::after{display:none}
  #effects .effect-art>*{inset:auto;aspect-ratio:427/412;width:min(94%,calc((100dvh - 165px) * 1.0364));max-width:850px;background-size:cover;background-position:center}
  #effects .effect-base{background-position:center 27%}

  #effects .adjust{border-radius:6px;margin-top:12px;padding:9px 10px;background:#111110}
  #effects #layers{padding:4px 7px;max-height:none}

  #effects .layer-label{min-width:0;overflow-wrap:anywhere;font-size:11px}

  .desk-effect-strip>div{display:flex;align-items:center;gap:7px}
  .desk-effect-strip .desk-btn{min-height:27px}
  .desk-lab-body{--editor-width:38;grid-template-columns:minmax(0,1fr) auto}
  .desk-lab-output{display:grid;grid-template-rows:minmax(0,1fr) auto auto;background:#0b0b0b}
  #lab .lab-preview{height:100%;min-height:0;border-radius:0}
  #lab .live-label{text-align:left;padding-left:14px;bottom:11px}
  #lab .lab-preview .reticle{top:28px;left:28px}
  .desk-lab-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--desk-bar);border-top:1px solid var(--desk-line);padding:6px 10px 6px 13px}
  .desk-lab-bottom #sketch-name{font-size:13px}
  .desk-lab-bottom #run-state{display:block;color:var(--desk-muted);font-size:11px}
  #lab .lab-actions{display:flex;gap:4px}
  #lab .lab-actions button{display:flex;min-height:31px;align-items:center;gap:6px;padding:4px 7px;border-radius:5px;background:#ffffff09;border:1px solid var(--desk-line);font-size:11px}
  #lab .lab-actions [aria-expanded=true]{background:#ffffff20}
  #desk-lab-drawers{background:var(--desk-bar)}
  #lab .lab-drawer{margin:0;padding:10px 13px;border:0;border-top:1px solid var(--desk-line);border-radius:0;background:none}
  #lab #lab-params{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  #lab #lab-params .stat{font-size:11px}
  .desk-editor-dock{width:clamp(300px,calc(var(--editor-width) * 1vw),55vw);display:grid;grid-template-rows:auto minmax(0,1fr);background:#151516;position:relative;min-width:0;border-left:1px solid var(--desk-line)}
  .desk-lab-body[data-focus=true]{--editor-width:56;grid-template-columns:minmax(0,1fr) auto}
  .desk-lab-body[data-focus=true] .desk-editor-dock{width:56vw}
  .desk-resize{position:absolute;z-index:4;left:-5px;inset-block:0;width:10px;cursor:col-resize;touch-action:none}
  .desk-resize:is(:hover,:focus-visible){background:#d9c8a34d}
  .desk-editor-controls{display:flex;align-items:center;gap:5px}
  .desk-editor-controls .run{min-width:60px;min-height:28px;border-radius:5px;font-size:11px}
  .desk-editor-controls .ghost{width:27px;height:27px}
  #lab .editor{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;border:0;padding:0;margin:0}
  #lab .editor-title{padding:8px 12px;margin:0;border-bottom:1px solid var(--desk-line);font-size:11px;color:#bdb6ad}
  #lab .code-wrap{height:auto;border:0;border-radius:0;min-height:0;background:#121214;grid-template-columns:43px minmax(0,1fr)}
  #lab .code-wrap textarea,#lab .code-wrap pre{font:13px/21px ui-monospace,SFMono-Regular,Menlo,monospace;padding-top:13px}
  #lab .code-status{padding:7px 9px;background:#382b20;margin:0}
}
@media(min-width:960px) and (max-width:1090px) and (min-height:550px) and (hover:hover) and (pointer:fine){
  .desk-workbar .desk-muted{display:none}
  .desk-three>.left{width:174px}
  #lab .lab-actions button{gap:4px;padding-inline:5px}
}

@media(min-width:960px) and (min-height:550px) and (hover:hover) and (pointer:fine){
  .desktop-workspace>.sheet,.desktop-workspace>.lab-meta{display:none}
  .desk-three>.left{grid-column:1;grid-row:1}
  .desk-three>.desk-stage{grid-column:2;grid-row:1}
  .desk-three>.right{grid-column:3;grid-row:1}
  .desk-lab-body>.desk-stage{grid-column:1;grid-row:1}
  .desk-lab-body>.desk-editor-dock{grid-column:2;grid-row:1}
  #studio .scene-label,#studio .orbit-hint{pointer-events:none}
  .desk-editor-controls:has(#run) #pause{order:1}
  .desk-editor-controls #desk-lab-reset{order:2}
  .desk-editor-controls #desk-lab-focus{order:3}
}
</style>

const $ = (selector, root = document) => root.querySelector(selector);

const pressed = (button, value) => button.setAttribute("aria-pressed", String(value));
const isPressed = button => button.getAttribute("aria-pressed") === "true";
const setRange = (input, value, label = value + "%") => {
  input.value = value;
  input.style.setProperty("--value", (value - Number(input.min)) / (Number(input.max || 100) - Number(input.min)) * 100 + "%");
  const output = $('output[for="' + input.id + '"]');
  if (output) output.value = label;
};
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const nameFromHash = () => location.hash.slice(1);
const viewNames = ["camera", "effects", "studio", "lab"];
const viewLabels = ["Camera", "Effects", "3D Studio", "Lab"];
let activeView, desktopReady = false;

function bindTabs(container, key, onSelect) {
  const tabs = all('[role="tab"]', container);
  tabs.forEach((tab, index) => {
    tab.addEventListener("click", () => onSelect(tab.dataset[key]));
    tab.addEventListener("keydown", event => {
      const directions = {ArrowRight: 1, ArrowLeft: -1};
      let end = event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 : null;
      if (event.key in directions) end = (index + directions[event.key] + tabs.length) % tabs.length;
      if (end === null) return;
      event.preventDefault();
      const next = tabs[end];
      onSelect(next.dataset[key]);
      next.focus();
    });
  });
  return value => tabs.forEach(tab => {
    const active = tab.dataset[key] === value;
    tab.setAttribute("aria-selected", String(active));
    tab.tabIndex = active ? 0 : -1;
    document.getElementById(tab.getAttribute("aria-controls")).hidden = !active;
  });
}

const dialog = $("#dialog");
const dialogBody = $("#dialog-body");
function showDialog(title, entries = []) {
  $("#dialog-title").textContent = title;
  dialogBody.replaceChildren();
  for (const [label, action, selected] of entries) {
    const button = document.createElement("button");
    button.className = "pill";
    button.textContent = label;
    if (selected !== undefined) pressed(button, selected);
    button.onclick = () => {
      dialog.close();
      action();
    };
    dialogBody.append(button);
  }
  if (!dialog.open) dialog.showModal();
}
dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); });
function togglePanel(button, panel, show = panel.hidden) {
  panel.hidden = !show;
  button.setAttribute("aria-expanded", String(show));
}
function download(blobOrUrl, filename) {
  if (!blobOrUrl) return;
  const localUrl = typeof blobOrUrl !== "string";
  const link = document.createElement("a");
  link.href = localUrl ? URL.createObjectURL(blobOrUrl) : blobOrUrl;
  link.download = filename;
  document.body.append(link);
  link.click();
  link.remove();
  if (localUrl) setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

let exposure = 0, zoom = 1, flipped = false, captureMode = "Photo", latestCapture, recording;
let statusTimer;

function cameraMessage(message, linger = 1400) {
  clearTimeout(statusTimer);
  const status = $("#camera-status");
  status.textContent = message;
  status.hidden = false;
  if (linger) statusTimer = setTimeout(() => { status.hidden = true; }, linger);
}
function setMode(mode) {
  if (recording) stopRecording();
  captureMode = mode;
  all("[data-mode]").forEach(button => pressed(button, button.dataset.mode === mode));
  shutter.setAttribute("aria-label", {Photo: "Take photo", Video: "Start recording", Scan: "Capture scan"}[mode]);
}
all("[data-mode]").forEach(button => button.onclick = () => setMode(button.dataset.mode));
$("#exposure").oninput = event => {
  exposure = Number(event.target.value) / 100;
  cameraArt.style.setProperty("--exposure", 1 + exposure);
};
$("#flash").onclick = event => pressed(event.currentTarget, !isPressed(event.currentTarget));
$("#zoom").onclick = event => {
  zoom = zoom === 1 ? 1.5 : zoom === 1.5 ? 2 : 1;
  event.currentTarget.textContent = zoom + "×";
  event.currentTarget.setAttribute("aria-label", "Zoom, " + zoom + "×");
  cameraArt.style.setProperty("--zoom", zoom);
};
$("#flip").onclick = event => {
  flipped = !flipped;
  pressed(event.currentTarget, flipped);
  cameraArt.style.setProperty("--face", flipped ? -1 : 1);
};
cameraArt.addEventListener("click", event => {
  const rect = $("#camera").getBoundingClientRect();
  focus.style.left = (event.clientX - rect.left) + "px";
  focus.style.top = (event.clientY - rect.top) + "px";
  focus.classList.remove("focusing");
  requestAnimationFrame(() => focus.classList.add("focusing"));
});
function paintCapture(canvas, scanned) {
  const context = canvas.getContext("2d");
  context.save();
  context.translate(canvas.width / 2, canvas.height / 2);
  context.scale(flipped ? -zoom : zoom, zoom);
  context.filter = "brightness(" + (1 + exposure) + ")" + (scanned ? " grayscale(1) contrast(1.28)" : "");
  context.drawImage(photoAsset, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
  context.restore();
}
function renderCapture(scanned = false) {
  const canvas = document.createElement("canvas");
  canvas.width = photoAsset.naturalWidth;
  canvas.height = photoAsset.naturalHeight;
  paintCapture(canvas, scanned);

  const polygons = [];
  sceneHitAreas = [];
  for (const object of sceneObjects().filter(object => object.visible)) {
    const [x,y,z] = object.position;
    const shape = geometry[object.kind];
    const points = shape.vertices.map(([u,v,w]) => project([x + u, v - y, z + w]));
    const floor = project([x,0,z]);
    ctx.save();
    ctx.translate(floor[0], floor[1]);
    ctx.scale(1, .26);
    const shadow = ctx.createRadialGradient(0,0,0,0,0,unit * 1.55);
    shadow.addColorStop(0,"#000b");
    shadow.addColorStop(1,"#0000");
    ctx.fillStyle = shadow;
    ctx.fillRect(-unit * 1.55,-unit * 1.55,unit * 3.1,unit * 3.1);
    ctx.restore();
    const xs = points.map(point => point[0]), ys = points.map(point => point[1]);
    const depth = points.reduce((sum, point) => sum + point[2], 0) / points.length;
    sceneHitAreas.push({id:object.id, depth, box:[Math.min(...xs) / width, Math.min(...ys) / height, Math.max(...xs) / width, Math.max(...ys) / height]});
    shape.faces.forEach((indices, index) => {
      const vertices = indices.map(i => points[i]);
      const zOrder = vertices.reduce((sum, point) => sum + point[2], 0) / vertices.length;
      polygons.push({vertices, zOrder, object, index});
    });
  }
  sceneHitAreas.sort((a, b) => b.depth - a.depth);
  polygons.sort((a,b) => a.zOrder - b.zOrder);
  for (const {vertices, object, index} of polygons) {
    const {fill} = materials[object.material];
    const selected = sceneState.selected && object.id === sceneState.object.id;
    const [x,y] = vertices[0], [b,d] = vertices[2];
    const gradient = ctx.createLinearGradient(x, y, b, d);
    const shades = [.60, .95, 1.07, .43, .63, .78, .54, .83];
    const tint = factor => "rgb(" + fill.map(value => clamp(Math.round(value * shades[index] * factor),0,255)).join(",") + ")";
    gradient.addColorStop(0,tint(1.10));
    gradient.addColorStop(.46,tint(.76));
    gradient.addColorStop(1,tint(1.03));
    ctx.beginPath();
    vertices.forEach(point => ctx.lineTo(point[0], point[1]));
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = "#f5eee512";
    ctx.lineWidth = .52 * cssScale;
    const top = Math.min(...vertices.map(point => point[1]));
    const bottom = Math.max(...vertices.map(point => point[1]));
    const left = Math.min(...vertices.map(point => point[0]));
    const right = Math.max(...vertices.map(point => point[0]));
    ctx.beginPath();
    for (let stripe = top; stripe <= bottom + 14 * cssScale; stripe += 3.4 * cssScale) {
      ctx.moveTo(left, stripe);
      ctx.lineTo(right, stripe - 14 * cssScale);
    }
    ctx.stroke();
    ctx.restore();
    ctx.beginPath();
    vertices.forEach(point => ctx.lineTo(point[0], point[1]));
    ctx.closePath();
    ctx.strokeStyle = selected ? "#eddfc7c5" : "#f3eee85f";
    ctx.lineWidth = (selected ? 1.1 : .7) * cssScale;
    ctx.stroke();
  }
}
const separator = $(".desk-resize");
const labLayout = $("#desk-lab-body");
function resizeEditor(value) {
  const width = clamp(Math.round(value), 26, 55);
  separator.setAttribute("aria-valuenow", width);
  labLayout.style.setProperty("--editor-width", width);
}
function expandEditor(show) {
  labLayout.dataset.focus = String(show);
  const button = $("#desk-lab-focus");
  pressed(button, show);
  button.setAttribute("aria-label", show ? "Restore source editor size" : "Expand source editor");
  if (show) editor.focus();
}
separator.onpointerdown = event => {
  if (event.button !== 0) return;
  event.preventDefault();
  separator.focus();
  if (labLayout.dataset.focus === "true") expandEditor(false);
  separator.setPointerCapture(event.pointerId);
};
separator.onpointermove = event => {
  if (!separator.hasPointerCapture(event.pointerId)) return;
  const bounds = labLayout.getBoundingClientRect();
  resizeEditor((bounds.right - event.clientX) / bounds.width * 100);
};
separator.onkeydown = event => {
  const value = Number(separator.getAttribute("aria-valuenow"));
  const next = {ArrowLeft: value + 3, ArrowRight: value - 3, Home: 26, End: 55}[event.key];
  if (next === undefined) return;
  event.preventDefault();
  if (labLayout.dataset.focus === "true") expandEditor(false);
  resizeEditor(next);
};
$("#desk-lab-focus").onclick = () => expandEditor(labLayout.dataset.focus !== "true");
$("#desk-lab-reset").onclick = () => chooseSketch(sketchIndex);

const deskUndo = $("#desktop-undo"), deskRedo = $("#desktop-redo");
const projectStorageKey = "n0ise-reference-project-v1";
const deskHistory = Object.fromEntries(viewNames.map(name => [name, {past:[], future:[], current:null}]));
const serialize = JSON.stringify;
let savedProject = null;
try { savedProject = localStorage.getItem(projectStorageKey); } catch {}
function viewSnapshot(name) {
  if (name === "studio") return sceneState;
  if (name === "camera") return {zoom, exposure, flipped, captureMode, flash:isPressed($("#flash"))};
  if (name === "effects") return {layers, layerId, lookIndex, selectedLayer, blend, mask, mix:Number($("#mix").value), feather:Number($("#feather").value)};
  return {sketchIndex, source:editor.value, speed:Number($("#speed").value), density:Number($("#density").value)};
}
function projectSnapshot() {
  return serialize(Object.fromEntries(viewNames.map(view => [view, viewSnapshot(view)])));
}
function restoreSnapshot(name, data) {
  if (name === "studio") {
    sceneState = data;
    renderScene();
  } else if (name === "camera") {
    if (captureMode !== data.captureMode) setMode(data.captureMode);
    zoom = data.zoom;
    exposure = data.exposure;
    flipped = data.flipped;
    pressed($("#flash"), data.flash);
    pressed($("#flip"), flipped);
    $("#zoom").textContent = zoom + "×";
    $("#zoom").setAttribute("aria-label", "Zoom, " + zoom + "×");
    $("#exposure").value = exposure * 100;
    cameraArt.style.setProperty("--zoom", zoom);
    cameraArt.style.setProperty("--face", flipped ? -1 : 1);
    cameraArt.style.setProperty("--exposure", 1 + exposure);
  } else if (name === "effects") {
    ({layers, layerId, lookIndex, selectedLayer, blend, mask} = data);
    setRange($("#mix"), data.mix);
    setRange($("#feather"), data.feather);
    renderEffects();
    renderLayers();
  } else {
    chooseSketch(data.sketchIndex, false);
    editor.value = data.source;
    syncLines();
    setRange($("#speed"), data.speed, (data.speed / 100).toFixed(2) + "×");
    setRange($("#density"), data.density);
    if (activeView === "lab") runSketch(playing);
    else {
      stopWorker();
      frameWasDrawn = false;
      $("#code-status").hidden = true;
    }
  }
}
function syncDesktopChrome() {
  if (!onDesktop() || !activeView) return;
  const entry = deskHistory[activeView];
  deskUndo.disabled = activeView === "studio" ? !undoStack.length : !entry.past.length;
  deskRedo.disabled = activeView === "studio" ? !sceneRedo.length : !entry.future.length;
  $("#save-state").textContent = savedProject === projectSnapshot() ? "Saved locally" : savedProject ? "Unsaved changes" : "Unsaved";
}
let historyTimer;
function recordWorkspace(name) {
  if (!onDesktop() || !name) return;
  if (name !== "studio") {
    const entry = deskHistory[name];
    const current = serialize(viewSnapshot(name));
    if (entry.current !== current) {
      if (entry.current !== null) entry.past.push(entry.current);
      if (entry.past.length > 40) entry.past.shift();
      entry.future.length = 0;
      entry.current = current;
    }
  }
  syncDesktopChrome();
}
function initWorkspaceHistory() {
  viewNames.forEach(name => {
    deskHistory[name] = {past:[], future:[], current:serialize(viewSnapshot(name))};
  });
}
function applyHistory(forward) {
  clearTimeout(historyTimer);
  recordWorkspace(activeView);
  if (activeView === "studio") {
    const from = forward ? sceneRedo : undoStack;
    const to = forward ? undoStack : sceneRedo;
    if (!from.length) return;
    to.push(JSON.parse(serialize(sceneState)));
    sceneState = from.pop();
    $("#undo").disabled = !undoStack.length;
    renderScene();
  } else {
    const entry = deskHistory[activeView];
    const from = forward ? entry.future : entry.past;
    const to = forward ? entry.past : entry.future;
    if (!from.length) return;
    to.push(entry.current);
    entry.current = from.pop();
    restoreSnapshot(activeView, JSON.parse(entry.current));
  }
  syncDesktopChrome();
}
deskUndo.onclick = () => applyHistory(false);
deskRedo.onclick = () => applyHistory(true);
$("#desktop-save").onclick = () => {
  clearTimeout(historyTimer);
  recordWorkspace(activeView);
  const snapshot = projectSnapshot();
  try { localStorage.setItem(projectStorageKey, snapshot); }
  catch { $("#save-state").textContent = "Local storage unavailable"; return; }
  savedProject = snapshot;
  syncDesktopChrome();
};
function loadWorkspace() {
  if (!savedProject) return;
  const saved = JSON.parse(savedProject);
  viewNames.forEach(name => restoreSnapshot(name, saved[name]));
  undoStack = [];
  sceneRedo = [];
  $("#undo").disabled = true;
  initWorkspaceHistory();
  syncDesktopChrome();
}
document.addEventListener("click", () => { if (onDesktop()) recordWorkspace(activeView); });
document.addEventListener("input", event => {
  if (!onDesktop() || !event.target.closest(".view")) return;
  const name = activeView;
  clearTimeout(historyTimer);
  historyTimer = setTimeout(() => recordWorkspace(name), 220);
});
document.addEventListener("keydown", event => {
  if (!onDesktop() || dialog.open || !(event.ctrlKey || event.metaKey)) return;
  if (event.key.toLowerCase() === "s") {
    event.preventDefault();
    $("#desktop-save").click();
  } else if (!event.target.matches("input, textarea, select") && event.key.toLowerCase() === "z") {
    event.preventDefault();
    applyHistory(event.shiftKey);
  }
});
desktopReady = true;
initWorkspaceHistory();
if (onDesktop()) arrangeDesktop();
syncDesktopChrome();
</script>
</body>
