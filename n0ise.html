<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>n0ise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060a; --panel:#0d0d13; --raise:#15151d; --line:#22222d; --ink:#ecedf4; --mute:#797c90;
  --accent:#3df5ff; --on-accent:#021417; --hot:#ff3d6e; --stage:#020204;
  --display:"Syne",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9eaf0; --panel:#f6f6fa; --raise:#e6e7ee; --line:#d3d5df; --ink:#0c0d14; --mute:#6c6f84;
    --accent:#0a5cff; --on-accent:#fff; --hot:#e0194d; --stage:#0a0a0e; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e9eaf0; --panel:#f6f6fa; --raise:#e6e7ee; --line:#d3d5df; --ink:#0c0d14; --mute:#6c6f84;
  --accent:#0a5cff; --on-accent:#fff; --hot:#e0194d; --stage:#0a0a0e; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:12.5px/1.4 var(--mono);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;flex:none;gap:8px}
.mark{font:800 21px/1 var(--display);letter-spacing:-.02em}
.mark b{color:var(--accent);font-weight:800}
.acts{display:flex;gap:6px;align-items:center}
.btn{border:0;border-radius:999px;padding:7px 12px;background:var(--raise);font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.rec[aria-pressed=true]{background:var(--hot);color:#fff}
.btn:disabled{opacity:.35}
.ic{width:34px;padding:7px 0;text-align:center}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;background:var(--stage);
  margin:0 8px;border-radius:14px;overflow:hidden}
#gl{display:block;grid-area:1/1;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage.drag{outline:2px dashed var(--accent);outline-offset:-8px}
.info{position:absolute;left:10px;top:8px;color:#fff9;font-size:11px;pointer-events:none;text-shadow:0 1px 2px #000}
.float{position:absolute;display:flex;gap:6px}
.float.bl{left:8px;bottom:8px}.float.br{right:8px;bottom:8px}.float.tr{right:8px;top:8px}
.pill{border:0;border-radius:999px;padding:7px 12px;font-weight:500;font-size:12px;color:#fff;
  background:#0b0b10b3;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pill[aria-pressed=true],.pill:active{background:var(--accent);color:var(--on-accent)}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute);background:var(--stage)}

.dock{flex:none;height:min(46%,400px);display:flex;flex-direction:column;background:var(--panel);
  border-radius:18px 18px 0 0;margin-top:8px;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;overflow-x:auto;scrollbar-width:none;flex:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:8px 11px 10px;font:700 13px/1 var(--display);color:var(--mute);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 18px}
.grp{padding:10px 0 2px}
.gt{padding:0 14px 4px;color:var(--mute);font-size:11px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:0;border-radius:999px;padding:6px 11px;background:var(--raise);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chip.act{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.chip.act:active{background:var(--accent);color:var(--on-accent)}
.cl{padding:2px 14px 0;color:var(--mute);font-size:11px}
.sw{flex:none;width:50px;height:28px;border:0;border-radius:8px;padding:0;box-shadow:inset 0 0 0 1px #ffffff1f}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;padding:2px 14px 0}
.row label{font-weight:500}
.row output{color:var(--mute);min-width:3.5ch;text-align:right}
input[type=range]{grid-column:1/-1;-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);border:0;margin-top:-7.5px}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}
.field{margin:4px 14px 6px;padding:8px 10px;border:0;border-radius:10px;background:var(--raise);width:calc(100% - 28px);resize:vertical}
select.field{width:auto;margin:0}
.pal-edit{display:flex;gap:6px;align-items:center;padding:2px 14px 8px;flex-wrap:wrap}
.pal-edit input[type=color]{width:34px;height:30px;border:0;border-radius:8px;padding:0;background:none}
.mod{margin:6px 14px;padding:8px 0 4px;border-top:1px solid var(--line)}
.mod .line{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.mod .row{padding:0}
.sheet{position:fixed;inset:0;z-index:20;background:#05050acc;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet>div{max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.sheet img{max-width:100%;max-height:62vh;border-radius:6px;-webkit-touch-callout:default;user-select:auto}
.xrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.xrow .btn{text-decoration:none;display:inline-flex;align-items:center;min-height:44px;padding:0 18px}
.xp{background:var(--panel);border-radius:18px;padding:18px 0 16px;gap:6px!important;max-width:360px!important;align-items:stretch!important}
.xp h3{margin:0 14px 6px;font:800 20px var(--display)}
.xp .btn.big{margin:6px 14px 0;min-height:48px;font-size:14px}
.xp #xc{margin:6px 14px 0}.xp.busy,.sheet.busy .xp{opacity:.85}.sheet.busy .btn,.sheet.busy .chip{pointer-events:none;opacity:.5}
.sheet p{margin:0;color:var(--mute);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;z-index:30;font-weight:500;max-width:90vw}

@media (min-width:900px){
  main{flex-direction:row;padding:0 8px 8px;gap:8px}
  .stage{margin:0}
  .dock{width:400px;height:auto;margin:0;border-radius:14px}
}

/* touch + small screens */
@media (pointer:coarse){
  .btn{min-height:40px}.ic{width:44px}
  .tab{padding:13px 12px 13px}
  .chip{min-height:40px;padding:8px 14px}
  .pill{min-height:40px}
  input[type=range]{height:40px}
  input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-11.5px}
  .sw{height:40px}
  .field,select.field{min-height:40px;font-size:16px}
  .pal-edit input[type=color]{height:40px;width:44px}
}
@media (max-width:640px){
  header{padding:6px 10px;flex-wrap:wrap}
  .acts{gap:4px;flex:1;justify-content:flex-end}
  .btn{padding:7px 10px}
  .stage{margin:0 6px}
  .dock{height:min(52%,440px);margin-top:6px}
  .info{display:none}
  .float.bl{flex-wrap:wrap;max-width:62%}
  .float.br{right:6px}
  .pill{padding:7px 10px;font-size:11.5px}
  .pane{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-height:500px) and (orientation:landscape){
  main{flex-direction:row;padding:0 6px 6px;gap:6px}
  .stage{margin:0}
  .dock{width:42%;height:auto;margin:0;border-radius:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">n<b>0</b>ise</div>
    <div class="acts">
      <button class="btn ic" id="undo" title="Undo" aria-label="Undo">↶</button>
      <button class="btn" id="open">Open</button>
      <button class="btn" id="cam">Camera</button>
      <button class="btn rec" id="rec" aria-pressed="false">Rec</button>
      <button class="btn primary" id="save">Save</button>
    </div>
  </header>
  <main>
    <div class="stage" id="stage">
      <canvas id="gl"></canvas>
      <div class="info" id="info"></div>
      <div class="float tr"><button class="pill" id="reset">Reset</button><button class="pill" id="textoff" hidden>Remove text</button><button class="pill" id="power" aria-pressed="true">Power</button></div>
      <div class="float bl"><button class="pill" id="shuffle">Shuffle</button><button class="pill" id="paint" aria-pressed="false">Beam paint</button></div>
      <div class="float br"><button class="pill" id="hold">Hold for original</button></div>
      <div class="err" id="err" hidden></div>
    </div>
    <section class="dock">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="pane" id="pane"></div>
    </section>
  </main>
</div>
<input type="file" id="file" accept="image/*,video/*" hidden>
<script>
/* =====================================================================
   n0ise — shaders.  Pipeline: tone → quantize → glitch → signal A/B →
   CRT beam & phosphor → persistence → bloom → glass.
   ===================================================================== */
const VS=`#version 300 es
out vec2 vUv;
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;

const HEAD=`#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
const float PI=3.14159265;
float h11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec2 h22(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
vec3 rgb2yiq(vec3 c){return vec3(dot(c,vec3(.299,.587,.114)),dot(c,vec3(.5959,-.2746,-.3213)),dot(c,vec3(.2115,-.5227,.3112)));}
vec3 yiq2rgb(vec3 y){return vec3(y.x+.956*y.y+.621*y.z,y.x-.272*y.y-.647*y.z,y.x-1.106*y.y+1.703*y.z);}
vec3 hueRot(vec3 c,float a){vec3 y=rgb2yiq(c);float cs=cos(a),sn=sin(a);y.yz=vec2(y.y*cs-y.z*sn,y.y*sn+y.z*cs);return yiq2rgb(y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float vn3(vec3 p){float z=floor(p.z),fz=fract(p.z);fz=fz*fz*(3.-2.*fz);return mix(vnoise(p.xy+z*17.13),vnoise(p.xy+(z+1.)*17.13),fz);}
`;

/* ---------- 1. tone: crop, downsample, adjust ---------- */
const F_TONE=HEAD+`
uniform sampler2D uSrc;
uniform float uSrcAsp,uScrAsp,uSpread,uBlur,uSharp,uEdge,uBright,uContrast,uMid,uHigh,uSat,uHue,uInv;
uniform vec2 uTexel;
vec2 cover(vec2 uv){float r=uScrAsp/uSrcAsp;vec2 s=r>1.?vec2(1.,1./r):vec2(r,1.);return (uv-.5)*s+.5;}
void main(){
  vec2 uv=cover(vUv);
  float sp=max(uSpread,.5);
  vec3 c=vec3(0.);float w=0.;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){
    float ww=(i==0&&j==0)?2.:1.;
    c+=ww*texture(uSrc,uv+vec2(float(i),float(j))*sp*uTexel).rgb;w+=ww;
  }
  c/=w;
  float rr=sp*(2.+uBlur*1.5);
  vec3 ring=vec3(0.);
  for(int k=0;k<8;k++){float a=float(k)*.785398;ring+=texture(uSrc,uv+vec2(cos(a),sin(a))*rr*uTexel).rgb;}
  ring/=8.;
  c=mix(c,ring,clamp(uBlur*.2,0.,1.));
  c+=uSharp*.35*(c-ring);
  if(uEdge>.001){
    vec2 d=sp*uTexel;
    float e=abs(lum(texture(uSrc,uv+vec2(d.x,0.)).rgb)-lum(texture(uSrc,uv-vec2(d.x,0.)).rgb))
           +abs(lum(texture(uSrc,uv+vec2(0.,d.y)).rgb)-lum(texture(uSrc,uv-vec2(0.,d.y)).rgb));
    c=mix(c,vec3(clamp(e*3.,0.,1.)),uEdge);
  }
  c=hueRot(c,uHue);
  float l0=lum(c);c=vec3(l0)+(c-l0)*uSat;
  c+=uBright;c=(c-.5)*uContrast+.5;c=clamp(c,0.,1.);
  c=pow(c,vec3(uMid));
  c+=uHigh*smoothstep(.4,1.,c);c=clamp(c,0.,1.);
  if(uInv>.5)c=1.-c;
  o=vec4(c,1.);
}`;

/* ---------- 2. quantize (ordered / noise / halftone) ---------- */
const F_QUANT=HEAD+`
uniform sampler2D uTone,uBay4,uBay8,uBlue;
uniform int uMethod,uPalN,uPalMode;
uniform float uLv[16];
uniform float uLo,uSpan,uDepth,uStr,uBias,uCell;
uniform vec2 uOff,uGrid;
float thrM(vec2 q){
  vec2 p=q+uOff;
  if(uMethod==1)return .5;
  if(uMethod==2)return texelFetch(uBay4,ivec2(mod(p,4.)),0).r;
  if(uMethod==3)return texelFetch(uBay8,ivec2(mod(p,8.)),0).r;
  if(uMethod==4)return texelFetch(uBlue,ivec2(mod(p,64.)),0).r;
  if(uMethod==5)return h21(p);
  vec2 r=mat2(.70711,-.70711,.70711,.70711)*q/uCell;
  vec2 f=fract(r)-.5;
  return clamp(length(f)*1.41421,0.,1.);
}
void main(){
  vec3 c=texture(uTone,vUv).rgb;
  vec2 p=floor(vUv*uGrid);
  if(uMethod==0){
    if(uPalMode==1)o=vec4(0.,0.,0.,clamp(lum(c),0.,1.));else o=vec4(c,1.);
    return;
  }
  float adj=(.5-thrM(p))*uStr+uBias;
  if(uPalMode==1){
    float sp=uSpan/max(float(uPalN-1),1.);
    float x=uLo+lum(c)*uSpan+adj*sp;
    int b=0;float bd=1e9;
    for(int i=0;i<16;i++){
      if(i>=uPalN)break;
      float d=abs(x-uLv[i]);
      if(d<bd){bd=d;b=i;}
    }
    o=vec4(0.,0.,0.,float(b)/255.);
  }else{
    float k=uDepth-1.;
    vec3 v=floor((c+adj/k)*k+.5)/k;
    o=vec4(clamp(v,0.,1.),1.);
  }
}`;

/* ---------- 3. glitch / waves / feedback / text ---------- */
const F_GLITCH=HEAD+`
uniform sampler2D uQ,uPrev,uText;
uniform vec2 uGrid;
uniform vec3 uPal[16];
uniform int uPalN,uPalMode,uInterp,uWAx,uWSh,uTextOn;
uniform float uCyc,uLines,uTime,uGT,uSeed,uAct,uAsp;
uniform float uRgb,uTear,uSline,uBlock,uDrag,uBand,uInvc,uBurst,uCrush;
uniform float uWA,uWF,uWS,uWFM,uWFMR,uWAM,uWAMR,uWPH,uW2,uW2F,uScope;
uniform float uFbg,uFbz,uFbr,uFbx,uFby,uFbh;
vec3 palAt(float pos){
  float n=float(uPalN);
  pos=mod(pos,n);
  int i0=int(floor(pos));int i1=i0+1;if(i1>=uPalN)i1=0;
  return mix(uPal[i0],uPal[i1],fract(pos));
}
vec3 samp(vec2 uv){
  uv=clamp(uv,vec2(.0005),vec2(.9995));
  vec4 t=texture(uQ,uv);
  if(uPalMode==1){
    float n=float(uPalN);
    if(uInterp==1)return palAt(t.a*(n-1.)+uCyc);
    return palAt(floor(t.a*255.+.5)+floor(uCyc));
  }
  return t.rgb;
}
float wv(float x,int sh){
  float f=fract(x);
  if(sh==0)return sin(x*6.2831853);
  if(sh==1)return 1.-4.*abs(f-.5);
  if(sh==2)return f<.5?1.:-1.;
  return 2.*f-1.;
}
float waveN(float c,float t){
  float ph=c*uWF+t*uWS;
  ph+=uWPH*sin(c*3.1+t*.7)*2.;
  ph+=uWFM*sin(c*uWFMR+t*1.3)*3.;
  float am=1.+uWAM*(sin(c*uWAMR+t*.9)-1.)*.5;
  return (wv(ph,uWSh)+uW2*wv(c*uW2F+t*uWS*1.3,0))*am/(1.+uW2);
}
void main(){
  vec2 uv=vUv;float t=uTime;
  float ev=floor(uGT*(2.+uAct*10.));
  float sd=uSeed*1.37;
  if(uWA>.0001){
    if(uWAx==0||uWAx==2)uv.x+=waveN(uv.y,t)*uWA;
    if(uWAx==1||uWAx==2)uv.y+=waveN(uv.x,t+1.7)*uWA;
  }
  if(uTear>.001){
    float nb=mix(6.,18.,h11(ev+sd));float b=floor(uv.y*nb);
    if(h21(vec2(b,ev+sd))<uAct*.5*uTear+.02*uTear)uv.x+=(h21(vec2(b+3.1,ev+sd))-.5)*.5*uTear;
  }
  if(uSline>.001){
    float row=floor(uv.y*uLines);
    if(h21(vec2(row,floor(uGT*14.)+sd))<uAct*.35*uSline)uv.x+=(h21(vec2(row,ev+9.))-.5)*.25*uSline;
  }
  if(uBlock>.001){
    vec2 cell=floor(uv*vec2(14.,9.));
    if(h21(cell+vec2(ev,sd))<uAct*.2*uBlock+.01*uBlock)uv+=(h22(cell+ev)-.5)*.35*uBlock;
  }
  vec3 c;
  if(uDrag>.001){
    float row=floor(uv.y*uGrid.y/4.);
    float gate=step(h21(vec2(row,ev+sd)),uAct*.6+.1);
    float len=uDrag*.35*gate;
    c=samp(uv);float best=lum(c);
    for(int i=1;i<=14;i++){
      vec3 s=samp(uv-vec2(float(i)/14.*len,0.));
      float l=lum(s);
      if(l>best){best=l;c=s;}
    }
  }else c=samp(uv);
  if(uRgb>.001){
    float a=h11(ev*1.7+sd)*6.2832;
    vec2 d=vec2(cos(a),sin(a))*uRgb*.03*(.3+.7*h11(ev+sd+4.));
    c.r=samp(uv+d).r;c.b=samp(uv-d).b;
  }
  if(uBand>.001){
    float b=floor(uv.y*mix(8.,40.,h11(ev+sd+1.)));
    if(h21(vec2(b,ev+sd+2.))<uAct*.4*uBand+.03*uBand){
      c=hueRot(c,(h21(vec2(b,ev))*2.-1.)*PI);
      if(h21(vec2(b,3.))>.5)c=c.gbr;
    }
  }
  if(uInvc>.001){
    float b=floor(uv.y*mix(5.,20.,h11(ev+sd+8.)));

/* deterministic hardware fingerprint */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hardware(seed){
  const r=mulberry(seed*7919+13);
  return{conv:[r()*2-1,r()*2-1,r()*2-1],gain:[1+(r()-.5)*.1,1+(r()-.5)*.1,1+(r()-.5)*.1],geo:[r()*2-1,r()*2-1]};
}

function mkProg(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const o={p,loc:{}};
  o.l=n=>{let l=o.loc[n];if(l===undefined){l=gl.getUniformLocation(p,n);o.loc[n]=l;}return l;};
  o.f=(n,v)=>{const l=o.l(n);if(l!==null)gl.uniform1f(l,v);};
  o.i=(n,v)=>{const l=o.l(n);if(l!==null)gl.uniform1i(l,v);};
  o.v2=(n,a,b)=>{const l=o.l(n);if(l!==null)gl.uniform2f(l,a,b);};
  o.v3=(n,a,b,c)=>{const l=o.l(n);if(l!==null)gl.uniform3f(l,a,b,c);};
  o.fv=(n,arr)=>{const l=o.l(n);if(l!==null)gl.uniform1fv(l,arr);};
  o.v3v=(n,arr)=>{const l=o.l(n);if(l!==null)gl.uniform3fv(l,arr);};
  o.use=()=>gl.useProgram(p);

}

function computeE(t,dt){

  for(const m of MODS){

    switch(m.shape){
      case'sine':w=Math.sin(ph*6.2832);break;
      case'tri':w=1-4*Math.abs(ph%1-.5);break;
      case'square':w=(ph%1)<.5?1:-1;break;
      case'saw':w=2*(ph%1)-1;break;

  const se=SRC.el;
  if(se instanceof HTMLVideoElement){
    if(se.paused&&!se.srcObject&&!document.hidden)se.play().catch(()=>{});
    if(se.readyState>=2&&(se.currentTime!==SRC.lastT||SRC.lastVer!==SRC.ver)){SRC.lastT=se.currentTime;SRC.lastVer=SRC.ver;uploadSrc();}
  }else if(SRC.gif)stepGif();
  const pal=curPal();
  const palKey=pal.mode?palCache.key:'src';
  const prevP=pIdx?T.pB:T.pA,newP=pIdx?T.pA:T.pB;

  /* ---- compare: original ---- */
  if(ST.hold){
    bindRT(null);PR.orig.use();samp(PR.orig,'uSrc',0,TEX.src);
    PR.orig.f('uSrcAsp',srcAsp);PR.orig.f('uScrAsp',asp);draw();return;
  }

  /* ---- 1. tone + quantize (cached when static) ---- */
  const method=E.lay_bit?E.method:'off';
  const gpuM=METHOD_ID[method]!==undefined;
  const bkey=[SRC.ver,SRC.live?frameNo:0,gw,gh,asp,method,E.pal,palKey,E.depth,E.dstr,E.tbias,
    E.anim&&gpuM?frameNo:0,E.bright,E.contrast,E.mid,E.high,E.sat,E.hue,E.blur,E.sharp,E.edge,E.invert].join('|');
  if(bkey!==lastBKey){
    lastBKey=bkey;
    const r=asp/srcAsp,visW=SRC.w*(r>1?1:r);
    const tp=PR.tone;bindRT(T.tone);tp.use();samp(tp,'uSrc',0,TEX.src);
    tp.f('uSrcAsp',srcAsp);tp.f('uScrAsp',asp);tp.v2('uTexel',1/SRC.w,1/SRC.h);
    tp.f('uSpread',Math.max(.5,visW/gw*.5));tp.f('uBlur',E.blur);tp.f('uSharp',E.sharp);tp.f('uEdge',E.edge/100);
    tp.f('uBright',E.bright/200);tp.f('uContrast',Math.tan((Math.min(E.contrast,98)/100+1)*Math.PI/4));
    tp.f('uMid',Math.pow(2,-E.mid/50));tp.f('uHigh',E.high/100*.3);tp.f('uSat',1+E.sat/100);
    tp.f('uHue',E.hue*Math.PI/180);tp.f('uInv',E.invert?1:0);
    draw();
    if(gpuM){
      const qp=PR.quant;bindRT(T.quant);qp.use();
      samp(qp,'uTone',0,T.tone.tex);samp(qp,'uBay4',1,TEX.bay4);samp(qp,'uBay8',2,TEX.bay8);samp(qp,'uBlue',3,TEX.blue);
      qp.i('uMethod',METHOD_ID[method]);qp.i('uPalN',pal.n||1);qp.i('uPalMode',pal.mode);
      if(pal.mode){qp.fv('uLv',pal.lv);qp.f('uLo',pal.lo);qp.f('uSpan',pal.span);}
      qp.f('uDepth',E.depth);qp.f('uStr',E.dstr/100);qp.f('uBias',E.tbias/100);qp.f('uCell',5);
      const fo=E.anim?frameNo:0;qp.v2('uOff',(fo*7)%64,(fo*13)%64);qp.v2('uGrid',gw,gh);
      draw();
    }else{
      cpuDither(T.tone,pal,method,E.dstr/100,E.tbias/100,E.depth,T.quant.tex);
    }
  }

  /* ---- 2. glitch / waves / feedback / text ---- */
  const gp=PR.glitch;bindRT(T.sigIn);gp.use();
  samp(gp,'uQ',0,T.quant.tex);samp(gp,'uPrev',1,prevP.tex);samp(gp,'uText',2,TEX.text);
  gp.v2('uGrid',gw,gh);
  if(pal.mode)gp.v3v('uPal',pal.flat);
  gp.i('uPalN',pal.n||1);gp.i('uPalMode',pal.mode);gp.i('uInterp',(method==='off'&&pal.mode)?1:0);
  gp.f('uCyc',E.cycle*t);gp.f('uLines',lines);gp.f('uTime',t);gp.f('uGT',E.glitchT);gp.f('uSeed',E.seed);
  gp.f('uAct',.05+.95*E.grate/100);gp.f('uAsp',asp);
  const gOn=E.lay_g?E.gamt/100:0;
  gp.f('uRgb',E.rgbs/100*gOn);gp.f('uTear',E.tear/100*gOn);gp.f('uSline',E.sline/100*gOn);gp.f('uBlock',E.gblock/100*gOn);
  gp.f('uDrag',E.drag/100*gOn);gp.f('uBand',E.band/100*gOn);gp.f('uInvc',E.ginv/100*gOn);gp.f('uBurst',E.burst/100*gOn);gp.f('uCrush',E.crush/100*gOn);
  const wOn=E.lay_g?1:0;
  gp.f('uWA',E.wamp/100*.06*wOn);gp.f('uWF',E.wfreq);gp.f('uWS',E.wspd/100*6);gp.f('uWFM',E.wfm/100);gp.f('uWFMR',E.wfmr);
  gp.f('uWAM',E.wam/100);gp.f('uWAMR',E.wamr);gp.f('uWPH',E.wph/100);gp.f('uW2',E.w2/100);gp.f('uW2F',E.w2f);
  gp.i('uWSh',+E.wshape);gp.i('uWAx',+E.waxis);gp.f('uScope',E.scope/100*wOn);
  gp.f('uFbg',E.fbg/100*.9*wOn);gp.f('uFbz',E.fbz/100);gp.f('uFbr',E.fbr*Math.PI/180);
  gp.f('uFbx',E.fbx/1000);gp.f('uFby',E.fby/1000);gp.f('uFbh',E.fbh*Math.PI/180);
  updateText(DW,lines,DH,pal,t);
  gp.i('uTextOn',E.ton?1:0);
  draw();

  /* ---- 3. signal laboratory ---- */
  if(E.lay_s){
    const gen=E.gen/100;
    const sA=PR.sigA;bindRT(T.yiq);sA.use();samp(sA,'uSrc',0,T.sigIn.tex);
    sA.v2('uRes',DW,lines);sA.i('uFrame',frameNo);sA.i('uStd',+E.std);sA.f('uTime',t);sA.f('uSeed',E.seed);
    sA.f('uPer',Math.max(2.2,E.cper*k));
    sA.f('uSL',Math.max(.35,(.3+E.lbw/100*3.2+gen*1.5)*k));
    sA.f('uSC',Math.max(.6,(1.2+E.cbw/100*3.5)*k));
    sA.f('uYC',E.ycs/100);sA.f('uSnr',E.snr/100*(1+gen*.8));sA.f('uCoh',E.coh/100);sA.f('uSnow',E.snow/100);
    sA.f('uGhost',E.ghost/100);sA.f('uGD',E.gdel*k);sA.f('uJit',E.jit/100*12*k);sA.f('uDrift',E.drift/100*10*k);
    sA.f('uTrk',E.trk/100);sA.f('uHsw',E.hsw/100);sA.f('uDrop',E.drop/100);sA.f('uClip',E.clip/100);
    sA.f('uCsat',E.csat/100*(1-gen*.35));sA.f('uPhase',E.phs*Math.PI/180);
    draw();
    const sB=PR.sigB;bindRT(T.sig);sB.use();samp(sB,'uY',0,T.yiq.tex);
    sB.v2('uRes',DW,lines);sB.f('uTau',E.cbw/100*5+.01);sB.f('uStep',(1+E.cbw/100*2.5)*k);
    sB.f('uRing',E.ring/100*.8);sB.f('uGenBlur',gen*.5);
    draw();
  }else{
    bindRT(T.sig);PR.copy.use();samp(PR.copy,'uT',0,T.sigIn.tex);draw();
  }

  /* ---- 4. CRT beam & phosphor ---- */
  const hw=hardware(E.seed),pw=powerShape(t);
  const cp=PR.crt;bindRT(T.crt);cp.use();samp(cp,'uSig',0,T.sig.tex);
  cp.v2('uRes',DW,DH);cp.v2('uHwGeo',hw.geo[0],hw.geo[1]);
  const tmp=E.temp/100,wp=tmp>0?[1,1-.1*tmp,1-.35*tmp]:[1+.3*tmp,1+.05*tmp,1];
  cp.v3('uWhite',wp[0],wp[1],wp[2]);
  const ag=E.aging/100;
  cp.v3('uGain',E.gr/100*lerp(1,hw.gain[0],ag*2),E.gg/100*lerp(1,hw.gain[1],ag*2),E.gb/100*lerp(1,hw.gain[2],ag*2));
  cp.v3('uHwConv',hw.conv[0],hw.conv[1],hw.conv[2]);
  cp.i('uMask',E.lay_m?+E.mask:0);cp.i('uPhos',+E.phos);
  cp.f('uLines',lines);cp.f('uTime',t);cp.f('uSeed',E.seed);cp.f('uField',frameNo%2);
  cp.f('uInter',+E.iface);cp.f('uIflk',E.iflk/100);
  cp.f('uCurv',E.curv/100);cp.f('uCorner',E.corner/100);cp.f('uOver',E.over/100);
  const lb=E.lay_b?1:0;
  cp.f('uConvS',E.convs/100*lb);cp.f('uConvE',E.conve/100*lb);cp.f('uCdrift',E.cdrift/100);cp.f('uAging',ag);
  cp.f('uSX',pw.sx);cp.f('uSY',pw.sy);cp.f('uGainP',pw.gain);
  cp.f('uDegT',Math.min(99,t-ST.degT0));cp.f('uRoll',E.roll);cp.f('uRollAmt',E.rollAmt);
  cp.f('uScan',E.scan/100*lb);cp.f('uBeamMin',.1+.35*E.beam/100);cp.f('uBeamGrow',.28*E.bloomb/100*lb);
  cp.f('uSpot',E.spot/100*lb);cp.f('uEfoc',E.efoc/100*lb);
  cp.f('uMStr',E.mstr/100);cp.f('uMPitch',Math.max(3,E.mpitch*DW/900));cp.f('uMSoft',E.msoft/100);cp.f('uMGap',E.mgap/100);
  cp.f('uBlk',E.blkl/400);cp.f('uGam',E.gam/100);cp.f('uCon',E.ccon/100);cp.f('uBri',E.cbri/200);cp.f('uSati',E.sati/100);
  draw();

  /* ---- 5. persistence & burn-in (display memory) ---- */
  const pp=PR.persist;bindRT(newP);pp.use();samp(pp,'uCrt',0,T.crt.tex);samp(pp,'uPrev',1,prevP.tex);
  const tauMin=ST.paint?700:0;
  const dec=ms=>{const m=Math.max(ms,tauMin);return m>0?Math.exp(-dt*1000/m):0;};
  pp.v3('uDecay',dec(E.dr),dec(E.dg),dec(E.db));
  pp.f('uAfter',ST.paint?1:E.after/100);pp.f('uBlend',E.fblend/100);pp.f('uEps',T.pA.hdr?.0005:.006);
  pp.f('uBurnRate',dt*.15*E.burn/100);
  draw();
  if(PAINTQ.length){
    gl.bindVertexArray(vaoPaint);
    const arr=new Float32Array(PAINTQ.length*3);
    PAINTQ.forEach((p,i)=>{arr[i*3]=p[0];arr[i*3+1]=p[1];arr[i*3+2]=p[2]*DW/1000;});
    gl.bindBuffer(gl.ARRAY_BUFFER,paintBuf);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.DYNAMIC_DRAW);
    PR.paint.use();
    const pc=PHOS_COL[+E.phos];PR.paint.v3('uCol',pc[0]*1.3,pc[1]*1.3,pc[2]*1.3);
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.colorMask(true,true,true,false);
    gl.drawArrays(gl.POINTS,0,PAINTQ.length);
    gl.colorMask(true,true,true,true);gl.disable(gl.BLEND);
    gl.bindVertexArray(vaoEmpty);PAINTQ.length=0;
  }

  /* ---- 6. bloom chain ---- */
  if(E.lay_l){
    const blur=(src,tmpRT,dst)=>{
      const b=PR.blur;b.use();
      bindRT(tmpRT);samp(b,'uT',0,src.tex);b.v2('uDir',1/src.w,0);draw();
      bindRT(dst);samp(b,'uT',0,tmpRT.tex);b.v2('uDir',0,1/tmpRT.h);draw();
    };
    bindRT(T.bA1);PR.bright.use();samp(PR.bright,'uT',0,newP.tex);draw();
    blur(T.bA1,T.bA2,T.bA1);
    bindRT(T.bB1);PR.copy.use();samp(PR.copy,'uT',0,T.bA1.tex);draw();
    blur(T.bB1,T.bB2,T.bB1);
    bindRT(T.bC1);PR.copy.use();samp(PR.copy,'uT',0,T.bB1.tex);draw();
    blur(T.bC1,T.bC2,T.bC1);
  }

  /* ---- 7. glass & cabinet ---- */
  const fp=PR.final;bindRT(null);fp.use();
  samp(fp,'uP',0,newP.tex);samp(fp,'uBA',1,T.bA1.tex);samp(fp,'uBB',2,T.bB1.tex);samp(fp,'uBC',3,T.bC1.tex);
  fp.v2('uRes',DW,DH);fp.v2('uPointer',POINTER.x,POINTER.y);fp.f('uSeed',E.seed);fp.f('uTime',t);
  fp.f('uBloom',E.bloom/100);fp.f('uBrad',E.brad/100);fp.f('uHal',E.hal/100);fp.f('uDiff',E.diff/100);
  fp.f('uRefl',E.refl/100);fp.f('uAR',E.ar/100);fp.f('uGlare',E.glare/100);fp.f('uTint',E.tint/100);
  fp.f('uDust',E.dust/100);fp.f('uScr',E.scr/100);fp.f('uSmud',E.smud/100);fp.f('uMicro',E.micro/100);
  fp.f('uVig',E.vig/100);fp.f('uBez',E.bez/100);fp.f('uBsh',E.bsh/100);fp.f('uRoom',E.room/100);fp.f('uPara',E.para/100);
  fp.f('uBurnAmt',E.burn/100);fp.f('uLayL',E.lay_l?1:0);fp.f('uLayG',E.lay_gl?1:0);
  draw();
  pIdx^=1;

  infoStr=`${(PROFILES.find(p=>p[0]===P.profile)||[0,'Custom'])[1]}, ${gw} × ${gh}, ${lines} lines, ${Math.round(fps)} fps${HDR?'':', 8-bit'}`;
}

let lastT=0,errShown=false;
function adaptQ(){
  if(fps<45&&ST.autoQ>.45){ST.autoQ=Math.max(.45,ST.autoQ*.85);ST.okN=0;}
  else if(fps>=56&&ST.autoQ<1&&++ST.okN>=6){ST.autoQ=Math.min(1,ST.autoQ*1.08);ST.okN=0;}
}
function loop(now){
  requestAnimationFrame(loop);
  if(document.hidden||!GLOK)return;
  const t=now/1000,dt=clamp(t-lastT,.001,.1);lastT=t;
  fpsAcc+=1/dt;fpsN++;if(fpsN>=20){fps=fpsAcc/fpsN;fpsAcc=0;fpsN=0;adaptQ();$('#info').textContent=infoStr;}
  try{if(audio.on)audioTick();renderFrame(t,dt);frameNo++;}
  catch(e){
    console.error(e);
    if(!errShown){errShown=true;noGL('Rendering failed: '+(e.message||e).toString().slice(0,300));}
  }
}

   n0ise — interface
   ===================================================================== */
const now=()=>performance.now()/1000;
let toastT=0;
function toast(msg){
  let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2600);
}
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};

/* ---------- history ---------- */
const HIST=[];let lastSnap='';
function snap(){
  const s=JSON.stringify(P);
  if(s!==lastSnap){if(lastSnap)HIST.push(lastSnap);if(HIST.length>60)HIST.shift();lastSnap=s;}
}
function undo(){
  const s=HIST.pop();if(!s){toast('Nothing to undo');return;}
  Object.assign(P,JSON.parse(s));lastSnap=s;refreshUI();
}

/* ---------- saved looks ---------- */
const loadLooks=()=>{try{return JSON.parse(localStorage.getItem('n0ise.looks')||'[]');}catch(e){return[];}};
function saveLook(){
  const looks=loadLooks();
  looks.push({id:'look'+Date.now(),name:'Look '+(looks.length+1),p:JSON.parse(JSON.stringify(P))});
  try{localStorage.setItem('n0ise.looks',JSON.stringify(looks.slice(-12)));}catch(e){toast('This browser won’t store looks');return;}
  buildProfiles();toast('Look saved');
}

/* ---------- control builders ---------- */
const UI={rows:{},chips:{},tabs:{},panes:{}};
const VISIBLE={
  depth:()=>P.pal==='src',
  dstr:()=>P.method!=='off',tbias:()=>P.method!=='off',
  anim:()=>['thr','b4','b8','blue','white','half'].includes(P.method),
  mpitch:()=>P.mask!=='0',msoft:()=>P.mask!=='0',mgap:()=>P.mask!=='0',mstr:()=>P.mask!=='0'&&P.phos==='0',
  iflk:()=>P.iface==='1',
  tsz:()=>P.ton,ty:()=>P.ton,tcur:()=>P.ton
};
function fmt(c,v){return c.step<1?(+v).toFixed(1):String(v);}
function buildRange(c,parent){
  const row=el('div','row');
  row.innerHTML=`<label for="s_${c.k}">${c.l}</label><output></output><input id="s_${c.k}" type="range" min="${c.min}" max="${c.max}" step="${c.step}">`;
  const inp=$('input',row);
  inp.addEventListener('input',()=>{P[c.k]=+inp.value;paintRow(c);});
  inp.addEventListener('change',()=>{P.profile=P.profile;snap();});
  parent.appendChild(row);UI.rows[c.k]=row;
}
function paintRow(c){
  const row=UI.rows[c.k];if(!row)return;
  const inp=$('input',row);inp.value=P[c.k];
  inp.style.setProperty('--p',((P[c.k]-c.min)/(c.max-c.min)*100)+'%');
  $('output',row).textContent=fmt(c,P[c.k]);
}
function buildChips(c,parent){
  const wrap=el('div');
  wrap.appendChild(el('div','cl',c.l));
  const chips=el('div','chips');
  c.opts.forEach(([v,l])=>{
    const b=el('button','chip',l);b.dataset.v=v;
    b.addEventListener('click',()=>{P[c.k]=v;snap();refreshUI();});
    chips.appendChild(b);
  });
  wrap.appendChild(chips);parent.appendChild(wrap);UI.chips[c.k]={wrap,chips,c};
}
function buildToggle(c,parent){
  const wrap=el('div','chips');
  const b=el('button','chip',c.l);
  b.addEventListener('click',()=>{P[c.k]=!P[c.k];snap();refreshUI();});
  wrap.appendChild(b);parent.appendChild(wrap);UI.chips[c.k]={wrap,btn:b,c,toggle:true};
}
function refreshUI(){
  for(const k in UI.rows){const c=CTL[k];paintRow(c);UI.rows[k].hidden=VISIBLE[k]?!VISIBLE[k]():false;}
  for(const k in UI.chips){
    const u=UI.chips[k];
    if(u.toggle){u.btn.setAttribute('aria-pressed',!!P[k]);u.wrap.hidden=VISIBLE[k]?!VISIBLE[k]():false;}
    else{u.chips.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===String(P[k])));u.wrap.hidden=VISIBLE[k]?!VISIBLE[k]():false;}
  }
  document.querySelectorAll('#pals .sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===P.pal));
  document.querySelectorAll('#profiles .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===P.profile));
  document.querySelectorAll('#sources .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===SRC.name));
  const pe=$('#palEdit');if(pe){pe.hidden=P.pal!=='custom';if(!pe.hidden)buildPalEdit();}
  const pn=$('#palName');if(pn){const d=PALS.find(p=>p.id===P.pal);pn.textContent=d?d.name:'';}
  const ta=$('#txtArea');if(ta&&document.activeElement!==ta)ta.value=P.txt;
  $('#power').setAttribute('aria-pressed',ST.pwr===1);
  $('#textoff').hidden=!P.ton;
  $('#paint').setAttribute('aria-pressed',ST.paint);
  $('#cam').textContent=SRC.name==='Camera'?'Flip':'Camera';
  refreshMods();
}

/* ---------- tabs & panes ---------- */
function buildTabs(){
  const tabs=$('#tabs'),pane=$('#pane');
  TABS.forEach(([id,name],i)=>{
    const b=el('button','tab',name);b.setAttribute('role','tab');b.dataset.id=id;
    b.addEventListener('click',()=>selectTab(id));
    tabs.appendChild(b);UI.tabs[id]=b;
    const p=el('div');p.hidden=true;pane.appendChild(p);UI.panes[id]=p;
  });
  selectTab('display');
}
function selectTab(id){
  for(const k in UI.tabs){UI.tabs[k].setAttribute('aria-selected',k===id);UI.panes[k].hidden=k!==id;}
  $('#pane').scrollTop=0;
}
function group(tab,title){
  const g=el('div','grp');if(title)g.appendChild(el('div','gt',title));
  UI.panes[tab].appendChild(g);return g;
}
function chipRow(parent,items,idPrefix,onClick,cls){
  const row=el('div','chips'+(idPrefix==='profiles'?' wrap':''));if(idPrefix)row.id=idPrefix;
  items.forEach(([v,l])=>{
    const b=el('button','chip'+(cls?' '+cls:''),l);b.dataset.v=v;
    b.addEventListener('click',()=>onClick(v,b));row.appendChild(b);
  });
  parent.appendChild(row);return row;
}

/* ---------- display tab custom blocks ---------- */
function buildProfiles(){
  const host=$('#profilesHost');if(!host)return;host.innerHTML='';
  const items=PROFILES.map(p=>[p[0],p[1]]).concat(loadLooks().map(l=>[l.id,'★ '+l.name]));
  const row=chipRow(host,items,'profiles',(id)=>{
    const look=loadLooks().find(l=>l.id===id);
    if(look){Object.assign(P,JSON.parse(JSON.stringify(look.p)));P.profile=id;}
    else applyProfile(id);
    snap();refreshUI();
  });
  refreshUI();
}
function buildDisplayExtras(){
  const gs=group('display','Source');
  chipRow(gs,[['Demo','Demo planet'],['Test','Test card']],'sources',(v)=>{
    $('#cam').textContent='Camera';
    setSource(v==='Demo'?demoCanvas():testCanvas(),v);refreshUI();
  });
  const gh=group('display','Hardware profile');
  const host=el('div');host.id='profilesHost';gh.appendChild(host);
  const ga=group('display','Actions');
  chipRow(ga,[['pwr','Power'],['deg','Degauss'],['chan','Change channel'],['burst','Static burst'],['mut','Mutate hardware'],['save','Save look'],['rst','Reset all']],'',(v)=>{
    const t=now();
    if(v==='pwr')togglePower();
    else if(v==='deg'){ST.degT0=t;}
    else if(v==='chan'){ST.chanT0=t;setTimeout(()=>{if(SRC.name==='Demo'||SRC.name==='Test'){const n=SRC.name==='Demo'?'Test':'Demo';setSource(n==='Demo'?demoCanvas():testCanvas(),n);refreshUI();}},350);}
    else if(v==='burst')ST.chanT0=t;
    else if(v==='mut')mutate();
    else if(v==='save')saveLook();
    else if(v==='rst')resetAll();
  },'act');
}
function togglePower(){ST.pwr=ST.pwr===1?0:1;ST.pwrT0=now();refreshUI();}
function mutate(){
  const others=PROFILES.filter(p=>p[0]!==P.profile&&p[0]!=='studio'&&p[0]!=='none');
  const o=others[Math.random()*others.length|0],w=.3+Math.random()*.4;
  for(const k in o[2]){

function extractPalette(k){
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d',{willReadFrequently:true});
  try{g.drawImage(SRC.el,0,0,64,64);}catch(e){return P.custom;}
  const d=g.getImageData(0,0,64,64).data,pts=[];
  for(let i=0;i<d.length;i+=4)pts.push([d[i],d[i+1],d[i+2]]);
  const sorted=pts.slice().sort((a,b)=>lum255(a)-lum255(b));
  let cs=Array.from({length:k},(_,i)=>sorted[Math.floor((i+.5)/k*sorted.length)].slice());
  for(let it=0;it<8;it++){
    const sum=cs.map(()=>[0,0,0,0]);
    for(const p of pts){
      let b=0,bd=1e9;
      for(let j=0;j<k;j++){const dd=(p[0]-cs[j][0])**2+(p[1]-cs[j][1])**2+(p[2]-cs[j][2])**2;if(dd<bd){bd=dd;b=j;}}
      sum[b][0]+=p[0];sum[b][1]+=p[1];sum[b][2]+=p[2];sum[b][3]++;
    }
    cs=cs.map((c0,j)=>sum[j][3]?[sum[j][0]/sum[j][3],sum[j][1]/sum[j][3],sum[j][2]/sum[j][3]]:c0);
  }
  P.pal='custom';
  return cs.sort((a,b)=>lum255(a)-lum255(b)).map(rgbHex);
}

/* ---------- GIF decode (animated playback) ---------- */
function lzwDec(min,data,n){
  const out=new Uint8Array(n),clear=1<<min,eoi=clear+1,prefix=new Uint16Array(4096),suffix=new Uint8Array(4096),stack=new Uint8Array(4097);
  let size=min+1,next=eoi+1,mask=(1<<size)-1,bits=0,acc=0,ip=0,prev=-1,first=0,op=0;
  for(let i=0;i<clear;i++)suffix[i]=i;
  while(op<n){
    while(bits<size){if(ip>=data.length)return out;acc|=data[ip++]<<bits;bits+=8;}
    const code=acc&mask;acc>>=size;bits-=size;
    if(code===clear){size=min+1;next=eoi+1;mask=(1<<size)-1;prev=-1;continue;}
    if(code===eoi)break;
    if(prev===-1){out[op++]=suffix[code];prev=code;first=code;continue;}
    let c=code,sp=0;
    if(code>=next){stack[sp++]=first;c=prev;}
    while(c>=clear){stack[sp++]=suffix[c];c=prefix[c];}
    first=suffix[c];stack[sp++]=first;
    if(next<4096){prefix[next]=prev;suffix[next]=first;next++;if(next===(1<<size)&&size<12){size++;mask=(1<<size)-1;}}
    prev=code;
    while(sp>0&&op<n)out[op++]=stack[--sp];
  }
  return out;
}
function parseGIF(b){

  let p=6;const W=b[p]|b[p+1]<<8,H=b[p+2]|b[p+3]<<8,fl=b[p+4];p+=7;
  let gct=null;if(fl&128){const n=3<<((fl&7)+1);gct=b.subarray(p,p+n);p+=n;}
  const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
  const comp=mk(W,H),cg=comp.getContext('2d',{willReadFrequently:true});
  const frames=[];let gce=null;
  while(p<b.length){
    const t=b[p++];
    if(t===0x3B)break;
    if(t===0x21){
      const l=b[p++];
      if(l===0xF9)gce={disp:(b[p+1]>>2)&7,tr:(b[p+1]&1)?b[p+4]:-1,delay:((b[p+2]|b[p+3]<<8)*10)||100};
      while(p<b.length&&b[p])p+=b[p]+1;p++;
    }else if(t===0x2C){
      const x=b[p]|b[p+1]<<8,y=b[p+2]|b[p+3]<<8,w=b[p+4]|b[p+5]<<8,h=b[p+6]|b[p+7]<<8,f=b[p+8];p+=9;
      let ct=gct;if(f&128){const n=3<<((f&7)+1);ct=b.subarray(p,p+n);p+=n;}
      const min=b[p++],parts=[];let len=0;
      while(p<b.length&&b[p]){parts.push(b.subarray(p+1,p+1+b[p]));len+=b[p];p+=b[p]+1;}p++;
      const data=new Uint8Array(len);let o=0;for(const q of parts){data.set(q,o);o+=q.length;}
      const px=lzwDec(min,data,w*h),img=new ImageData(w,h),d=img.data,tr=gce?gce.tr:-1;
      const rows=[];
      if(f&64){for(const [s,st] of [[0,8],[4,8],[2,4],[1,2]])for(let r=s;r<h;r+=st)rows.push(r);}else for(let r=0;r<h;r++)rows.push(r);
      for(let i=0;i<h;i++){const row=rows[i];for(let c=0;c<w;c++){
        const v=px[i*w+c],q=(row*w+c)*4;
        if(v===tr||!ct){d[q+3]=0;continue;}
        d[q]=ct[v*3];d[q+1]=ct[v*3+1];d[q+2]=ct[v*3+2];d[q+3]=255;}}
      const patch=mk(w,h);patch.getContext('2d').putImageData(img,0,0);
      const disp=gce?gce.disp:0,saved=disp===3?cg.getImageData(0,0,W,H):null;
      cg.drawImage(patch,x,y);
      const snap=mk(W,H);snap.getContext('2d').drawImage(comp,0,0);
      frames.push({c:snap,d:Math.max(20,gce?gce.delay:100)});
      if(disp===2)cg.clearRect(x,y,w,h);else if(saved)cg.putImageData(saved,0,0);
      gce=null;
      if(frames.length>=400)break;
    }else break;
  }
  return frames.length?{w:W,h:H,frames,total:frames.reduce((a,f)=>a+f.d,0),last:-1,t0:performance.now()}:null;
}
function stepGif(){
  const g=SRC.gif;if(!g||!(SRC.el instanceof HTMLCanvasElement))return;
  let t=(performance.now()-g.t0)%g.total,i=0;
  while(i<g.frames.length-1&&t>=g.frames[i].d){t-=g.frames[i].d;i++;}
  if(i===g.last)return;g.last=i;
  const cx=SRC.el.getContext('2d');cx.clearRect(0,0,g.w,g.h);cx.drawImage(g.frames[i].c,0,0);uploadSrc();
}

/* ---------- GIF encode (export) ---------- */
function lzwEnc(idx){
  const CLEAR=256,EOI=257,HS=8209,hk=new Int32Array(HS).fill(-1),hv=new Uint16Array(HS),bytes=[];
  let size=9,next=258,acc=0,nb=0;
  const put=c=>{acc|=c<<nb;nb+=size;while(nb>=8){bytes.push(acc&255);acc>>=8;nb-=8;}};
  put(CLEAR);let cur=idx[0];
  for(let i=1;i<idx.length;i++){
    const c=idx[i],key=(cur<<8)|c;let h=((c<<4)^cur)%HS;
    while(hk[h]!==-1&&hk[h]!==key)h=(h+1)%HS;
    if(hk[h]===key){cur=hv[h];continue;}
    put(cur);
    if(next<4096){hk[h]=key;hv[h]=next++;if(next>(1<<size)&&size<12)size++;}
    else{put(CLEAR);hk.fill(-1);next=258;size=9;}
    cur=c;
  }
  put(cur);put(EOI);if(nb>0)bytes.push(acc&255);
  return bytes;
}
function encodeGIF(frames,w,h,delayMs){
  const out=[71,73,70,56,57,97,w&255,w>>8,h&255,h>>8,0xF7,0,0];
  for(let i=0;i<256;i++)out.push(Math.round((i>>5)*255/7),Math.round(((i>>2)&7)*255/7),Math.round((i&3)*255/3));
  out.push(0x21,0xFF,11,...'NETSCAPE2.0'.split('').map(c=>c.charCodeAt(0)),3,1,0,0,0);
  const cs=Math.max(2,Math.round(delayMs/10)),B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  for(const fr of frames){
    const idx=new Uint8Array(w*h);
    for(let y=0,i=0;y<h;y++)for(let x=0;x<w;x++,i++){
      const j=i*4,t=(B[(y&3)*4+(x&3)]-7.5)*3;
      const r=Math.min(255,Math.max(0,fr[j]+t)),g=Math.min(255,Math.max(0,fr[j+1]+t)),b=Math.min(255,Math.max(0,fr[j+2]+t*1.5));
      idx[i]=(r>>5)<<5|(g>>5)<<2|(b>>6);
    }
    out.push(0x21,0xF9,4,0,cs&255,cs>>8,0,0,0x2C,0,0,0,0,w&255,w>>8,h&255,h>>8,0,8);
    const d=lzwEnc(idx);
    for(let i=0;i<d.length;i+=255){const n=Math.min(255,d.length-i);out.push(n);for(let k=0;k<n;k++)out.push(d[i+k]);}
    out.push(0);
  }
  out.push(0x3B);return new Blob([new Uint8Array(out)],{type:'image/gif'});
}
async function exportGIF(sec,width,setMsg){
  const fps=12,n=sec*fps,w=width,h=Math.round(width*canvas.height/canvas.width);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d',{willReadFrequently:true});
  const frames=[];ST.clean=true;
  for(let i=0;i<n;i++){
    const t0=performance.now();
    await new Promise(r=>requestAnimationFrame(r));
    cx.drawImage(canvas,0,0,w,h);frames.push(cx.getImageData(0,0,w,h).data);
    setMsg(`Capturing ${i+1}/${n}`);
    const wait=1000/fps-(performance.now()-t0);if(wait>0)await new Promise(r=>setTimeout(r,wait));
  }
  ST.clean=false;setMsg('Encoding GIF…');await new Promise(r=>setTimeout(r,30));
  return encodeGIF(frames,w,h,1000/fps);
}

  const msg=t=>{$('#xm',sh).textContent=t;};
  const run=async f=>{if(busy)return;busy=true;sh.classList.add('busy');try{await f();}catch(e){console.error(e);toast('Export failed, try a smaller size');}busy=false;sh.classList.remove('busy');msg('');};
  const close=()=>{if(!busy)sh.remove();};
  $('#xc',sh).addEventListener('click',close);sh.addEventListener('pointerdown',e=>{if(e.target===sh)close();});
  $('#xp',sh).addEventListener('click',()=>run(async()=>{await savePNG();sh.remove();}));
  $('#xg',sh).addEventListener('click',()=>run(async()=>{const b=await exportGIF(o.len,o.w,msg);sh.remove();deliver(b,stamp()+'.gif',false);}));
  $('#xv',sh).addEventListener('click',()=>run(async()=>{
    toggleRec(o.len);const t0=performance.now();
    await new Promise(r=>{const i=setInterval(()=>{msg(`Recording ${Math.min(o.len,(performance.now()-t0)/1000).toFixed(0)}/${o.len}s`);if(!rec){clearInterval(i);r();}},250);});
    sh.remove();}));
}
function resetAll(){
  Object.assign(P,JSON.parse(JSON.stringify(BASE)));applyProfile('studio');
  MODS.forEach(m=>{m.target='';m.shape='sine';m.rate=.4;m.depth=40;});
  snap();refreshUI();toast('Reset');
}

/* ---------- wiring ---------- */
function wire(){
  $('#undo').addEventListener('click',undo);
  $('#open').addEventListener('click',()=>$('#file').click());
  $('#file').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value='';});
  $('#cam').addEventListener('click',()=>startCam(SRC.name==='Camera'));
  $('#rec').addEventListener('click',()=>toggleRec());
  $('#save').addEventListener('click',openExport);$('#reset').addEventListener('click',resetAll);
  $('#textoff').addEventListener('click',()=>{P.ton=false;snap();refreshUI();});
  $('#shuffle').addEventListener('click',shuffle);
  $('#power').addEventListener('click',togglePower);
  $('#paint').addEventListener('click',()=>{ST.paint=!ST.paint;refreshUI();toast(ST.paint?'Paint with the beam: drag on the screen':'Beam paint off');});
  const hold=$('#hold'),setH=on=>{ST.hold=on;hold.setAttribute('aria-pressed',on);};
  hold.addEventListener('pointerdown',e=>{e.preventDefault();setH(true);});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>hold.addEventListener(t,()=>setH(false)));
  hold.addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('keydown',e=>{
    if(e.target!==document.body)return;
    if(e.code==='Space'){e.preventDefault();setH(true);}
    else if(e.key==='z'&&(e.metaKey||e.ctrlKey||!e.shiftKey)){undo();}
  });
  addEventListener('keyup',e=>{if(e.code==='Space')setH(false);});
  canvas.addEventListener('pointermove',e=>{
    const r=canvas.getBoundingClientRect();
    const ux=(e.clientX-r.left)/r.width,uy=(e.clientY-r.top)/r.height;
    POINTER.x=ux*2-1;POINTER.y=1-uy*2;
    if(ST.paint&&e.buttons){const k=1+2*E.bez/100;PAINTQ.push([(ux*2-1)*k,(1-uy*2)*k,34]);}
  });
  canvas.addEventListener('pointerdown',e=>{
    if(!ST.paint)return;
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect(),ux=(e.clientX-r.left)/r.width,uy=(e.clientY-r.top)/r.height,k=1+2*E.bez/100;
    PAINTQ.push([(ux*2-1)*k,(1-uy*2)*k,34]);
  });
  stage.addEventListener('dragover',e=>{e.preventDefault();stage.classList.add('drag');});
  stage.addEventListener('dragleave',()=>stage.classList.remove('drag'));
  stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('drag');loadFile(e.dataTransfer.files[0]);});
  addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>e.preventDefault());
  addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/')||f.type.startsWith('video/'));if(f)loadFile(f);});
}

/* ---------- boot ---------- */
(function boot(){
  applyProfile('studio');
  ST.pwrT0=now();
  buildUI();reorderBitmap();wire();
  if(GLOK){
    try{
      initGL();initLUT();
      setSource(demoCanvas(),'Demo');
    }catch(e){console.error(e);noGL('Setup failed: '+String(e.message||e).slice(0,500));}
  }
  lastSnap=JSON.stringify(P);
  refreshUI();
  requestAnimationFrame(loop);
})();
</script>
