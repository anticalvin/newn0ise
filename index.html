<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>n0ise</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--ink:#f2efe8;--mute:#8d8a82;--acc:#ff5a1f;--d:"Syne",system-ui,sans-serif;--m:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--m);overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0)}
header{flex:none;display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 10px;border-bottom:1px solid #2a2927;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.mark{font:800 clamp(22px,6vw,30px)/1 var(--d);letter-spacing:-.02em;text-transform:none}
.mark b{color:var(--acc)}
header span{color:var(--mute)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.door{position:relative;flex:1 1 0;min-height:0;display:block;color:inherit;text-decoration:none;overflow:hidden;border-bottom:1px solid #2a2927;transition:flex-grow .45s cubic-bezier(.2,.8,.2,1),background .12s,color .12s;outline:0}
.door:last-child{border-bottom:0}
.door canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.55;transition:opacity .2s}
.door .t{position:absolute;left:16px;right:16px;bottom:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}
.door h2{font:800 100px/.82 var(--d);letter-spacing:-.045em;text-transform:uppercase;white-space:nowrap;mix-blend-mode:difference;color:#fff}
.door .n{position:absolute;top:10px;left:16px;font-size:11px;letter-spacing:.16em;color:var(--mute);mix-blend-mode:difference}
.door .d{position:absolute;top:8px;right:12px;max-width:52%;text-align:right;font-size:11px;line-height:1.35;letter-spacing:.03em;color:var(--ink);background:var(--bg);padding:4px 6px}
.door .go{flex:none;align-self:flex-end;width:44px;height:44px;border:1px solid currentColor;display:grid;place-items:center;font-size:20px;mix-blend-mode:difference;color:#fff;transition:transform .2s}
.door:hover canvas,.door:focus-visible canvas{opacity:1}
.door:hover .go,.door:focus-visible .go{transform:translateX(4px)}
.door:focus-visible{box-shadow:inset 0 0 0 3px var(--acc)}
.door:active{background:var(--acc)}
.tick{position:absolute;right:16px;bottom:62px;width:10px;height:10px;background:var(--acc);display:none}
.door.rec .tick{display:block;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
footer{flex:none;display:flex;justify-content:space-between;gap:12px;padding:9px 16px calc(9px + env(safe-area-inset-bottom,0));font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border-top:1px solid #2a2927}
@media (min-width:820px){
  main{flex-direction:row}
  .door{border-bottom:0;border-right:1px solid #2a2927}.door:last-child{border-right:0}
  .door h2{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
  .door .t{left:16px;right:16px;bottom:16px}
  main:hover .door{flex-grow:.7}main .door:hover,main .door:focus-visible{flex-grow:2.2}
}
@media (prefers-reduced-motion:reduce){.door,.door .go{transition:none}.door.rec .tick{animation:none}}
</style>
</head>
<body>
<header><div class="mark">n<b>0</b>ise</div><span>choose a tool</span></header>
<main>
  <a class="door rec" href="effects.html?cam=1" id="d1"><canvas></canvas><span class="n">01</span><span class="d">Pick a camera body. Shoot photo or video through it.</span><i class="tick"></i><div class="t"><h2>Camera</h2><span class="go">→</span></div></a>
  <a class="door" href="effects.html" id="d2"><canvas></canvas><span class="n">02</span><span class="d">Layer CRT, dither, glitch and print looks on any picture.</span><div class="t"><h2>Effects</h2><span class="go">→</span></div></a>
  <a class="door" href="studio.html" id="d3"><canvas></canvas><span class="n">03</span><span class="d">Turn a photo into a model. Light it, move it, export it.</span><div class="t"><h2>3D</h2><span class="go">→</span></div></a>
</main>
<footer><span>Runs in your browser</span><span>Nothing is uploaded</span></footer>
<script>
/* fit every word to its door: widest size that stays inside, so nothing is clipped at any screen size */
const fit=()=>document.querySelectorAll('.door').forEach(d=>{
  const h=d.querySelector('h2'),r=d.getBoundingClientRect(),vert=getComputedStyle(h).writingMode.startsWith('vertical');
  h.style.fontSize='100px';const b=h.getBoundingClientRect();
  const aw=r.width-32-(vert?44+14:60),ah=vert?r.height-84:r.height*.66;
  const k=Math.min(aw/b.width,ah/b.height);h.style.fontSize=Math.max(24,Math.floor(100*k))+'px';
});
addEventListener('resize',fit);document.fonts&&document.fonts.ready.then(fit);fit();
document.querySelector('main').addEventListener('transitionend',fit,true);
/* three tiny pixel animations, one per door. Low resolution, ink on black, pointer-reactive. */
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const INK=[242,239,232],ACC=[255,90,31];
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function setup(door,draw){
  const c=door.querySelector('canvas'),g=c.getContext('2d');let W=0,H=0,img,px=.5,py=.5,hot=0;
  const fit=()=>{const r=door.getBoundingClientRect(),s=Math.max(2,Math.round(Math.max(r.width,r.height)/180));W=Math.max(8,Math.round(r.width/s));H=Math.max(8,Math.round(r.height/s));c.width=W;c.height=H;img=g.createImageData(W,H);};
  fit();new ResizeObserver(fit).observe(door);
  door.addEventListener('pointermove',e=>{const r=door.getBoundingClientRect();px=(e.clientX-r.left)/r.width;py=(e.clientY-r.top)/r.height;});
  door.addEventListener('pointerenter',()=>hot=1);door.addEventListener('pointerleave',()=>hot=0);
  let vis=true;new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(door);
  const put=(x,y,k,col)=>{if(x<0||y<0||x>=W||y>=H)return;const i=(y*W+x)*4;img.data[i]=col[0];img.data[i+1]=col[1];img.data[i+2]=col[2];img.data[i+3]=k;};
  let t=0;const tick=()=>{if(vis){t+=reduce?0:.016;img.data.fill(0);draw({W,H,t,px,py,hot,put,col:hot?ACC:INK});g.putImageData(img,0,0);}requestAnimationFrame(tick);};tick();
}
/* camera: a dithered lens that breathes, with viewfinder corners */
setup(d1,({W,H,t,px,py,put,col})=>{
  const cx=W*(.5+(px-.5)*.25),cy=H*(.45+(py-.5)*.25),R=Math.min(W,H)*(.3+Math.sin(t*1.4)*.025);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=Math.hypot(x-cx,(y-cy)),k=d<R?1-d/R:0,ring=Math.abs(d-R*1.25)<.7?.8:0,v=Math.max(k*k,ring);if(v*16>B4[(y&3)*4+(x&3)]+.5)put(x,y,255,col);}
  const L=Math.max(3,Math.round(Math.min(W,H)*.1));
  for(let i=0;i<L;i++)for(const [x,y] of [[3+i,3],[3,3+i],[W-4-i,3],[W-4,3+i],[3+i,H-4],[3,H-4-i],[W-4-i,H-4],[W-4,H-4-i]])put(x,y,255,col);
});
/* effects: scanlines and tearing slices */
setup(d2,({W,H,t,py,hot,put,col})=>{
  for(let y=0;y<H;y++){
    const band=Math.floor(y/Math.max(2,H/18)),r=Math.sin(band*12.9898+Math.floor(t*3)*78.233)*43758.5453,sh=Math.round(((r-Math.floor(r))-.5)*W*(.12+hot*.3));
    if(y%2)continue;
    for(let x=0;x<W;x++){const u=((x+sh)%W+W)%W,v=Math.sin(u*.21+y*.05+t*2)*.5+.5;if(v*16>B4[(y&3)*4+(x&3)]+3)put(x,y,200,col);}
  }
  const sy=Math.floor((py+.0)*H);for(let x=0;x<W;x++)put(x,sy,255,ACC);
});
/* 3d: a turning wire cube made of dots */
setup(d3,({W,H,t,px,py,put,col})=>{
  const a=t*.7+(px-.5)*2,b=.5+(py-.5),s=Math.min(W,H)*.2,cx=W*.5,cy=H*.45,V=[];
  for(const x of[-1,1])for(const y of[-1,1])for(const z of[-1,1]){let X=x*Math.cos(a)-z*Math.sin(a),Z=x*Math.sin(a)+z*Math.cos(a),Y=y*Math.cos(b)-Z*Math.sin(b);Z=y*Math.sin(b)+Z*Math.cos(b);const f=2.6/(2.6+Z*.5);V.push([cx+X*s*f,cy+Y*s*f,x,y,z]);}
  for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){const p=V[i],q=V[j],d=(p[2]!==q[2])+(p[3]!==q[3])+(V[i][4]!==V[j][4]);if(d!==1)continue;
    const n=Math.round(Math.hypot(p[0]-q[0],p[1]-q[1]));for(let k=0;k<=n;k++){const u=k/n;put(Math.round(p[0]+(q[0]-p[0])*u),Math.round(p[1]+(q[1]-p[1])*u),255,col);}}
});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
