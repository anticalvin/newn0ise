<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>n0ise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060a; --panel:#0d0d13; --raise:#15151d; --line:#22222d; --ink:#ecedf4; --mute:#797c90;
  --accent:#3df5ff; --on-accent:#021417; --hot:#ff3d6e; --stage:#020204;
  --display:"Syne",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9eaf0; --panel:#f6f6fa; --raise:#e6e7ee; --line:#d3d5df; --ink:#0c0d14; --mute:#6c6f84;
    --accent:#0a5cff; --on-accent:#fff; --hot:#e0194d; --stage:#0a0a0e; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e9eaf0; --panel:#f6f6fa; --raise:#e6e7ee; --line:#d3d5df; --ink:#0c0d14; --mute:#6c6f84;
  --accent:#0a5cff; --on-accent:#fff; --hot:#e0194d; --stage:#0a0a0e; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:12.5px/1.4 var(--mono);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;flex:none;gap:8px}
.mark{font:800 21px/1 var(--display);letter-spacing:-.02em}
.mark b{color:var(--accent);font-weight:800}
.acts{display:flex;gap:6px;align-items:center}
.btn{border:0;border-radius:999px;padding:7px 12px;background:var(--raise);font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.rec[aria-pressed=true]{background:var(--hot);color:#fff}
.btn:disabled{opacity:.35}
.ic{width:34px;padding:7px 0;text-align:center}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;background:var(--stage);
  margin:0 8px;border-radius:14px;overflow:hidden}
#gl{display:block;grid-area:1/1;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage.drag{outline:2px dashed var(--accent);outline-offset:-8px}
.info{position:absolute;left:10px;top:8px;color:#fff9;font-size:11px;pointer-events:none;text-shadow:0 1px 2px #000}
.float{position:absolute;display:flex;gap:6px}
.float.bl{left:8px;bottom:8px}.float.br{right:8px;bottom:8px}.float.tr{right:8px;top:8px}
.pill{border:0;border-radius:999px;padding:7px 12px;font-weight:500;font-size:12px;color:#fff;
  background:#0b0b10b3;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pill[aria-pressed=true],.pill:active{background:var(--accent);color:var(--on-accent)}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute);background:var(--stage)}

.dock{flex:none;height:min(46%,400px);display:flex;flex-direction:column;background:var(--panel);
  border-radius:18px 18px 0 0;margin-top:8px;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;overflow-x:auto;scrollbar-width:none;flex:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:8px 11px 10px;font:700 13px/1 var(--display);color:var(--mute);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 18px}
.grp{padding:10px 0 2px}
.gt{padding:0 14px 4px;color:var(--mute);font-size:11px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:0;border-radius:999px;padding:6px 11px;background:var(--raise);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chip.act{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.chip.act:active{background:var(--accent);color:var(--on-accent)}
.cl{padding:2px 14px 0;color:var(--mute);font-size:11px}
.sw{flex:none;width:50px;height:28px;border:0;border-radius:8px;padding:0;box-shadow:inset 0 0 0 1px #ffffff1f}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;padding:2px 14px 0}
.row label{font-weight:500}
.row output{color:var(--mute);min-width:3.5ch;text-align:right}
input[type=range]{grid-column:1/-1;-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);border:0;margin-top:-7.5px}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}
.field{margin:4px 14px 6px;padding:8px 10px;border:0;border-radius:10px;background:var(--raise);width:calc(100% - 28px);resize:vertical}
select.field{width:auto;margin:0}
.pal-edit{display:flex;gap:6px;align-items:center;padding:2px 14px 8px;flex-wrap:wrap}
.pal-edit input[type=color]{width:34px;height:30px;border:0;border-radius:8px;padding:0;background:none}
.mod{margin:6px 14px;padding:8px 0 4px;border-top:1px solid var(--line)}
.mod .line{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.mod .row{padding:0}
.sheet{position:fixed;inset:0;z-index:20;background:#05050acc;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet>div{max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.sheet img{max-width:100%;max-height:62vh;border-radius:6px;-webkit-touch-callout:default;user-select:auto}
.xrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.xrow .btn{text-decoration:none;display:inline-flex;align-items:center;min-height:44px;padding:0 18px}
.xp{background:var(--panel);border-radius:18px;padding:18px 0 16px;gap:6px!important;max-width:360px!important;align-items:stretch!important}
.xp h3{margin:0 14px 6px;font:800 20px var(--display)}
.xp .btn.big{margin:6px 14px 0;min-height:48px;font-size:14px}
.xp #xc{margin:6px 14px 0}.xp.busy,.sheet.busy .xp{opacity:.85}.sheet.busy .btn,.sheet.busy .chip{pointer-events:none;opacity:.5}
.sheet p{margin:0;color:var(--mute);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;z-index:30;font-weight:500;max-width:90vw}

@media (min-width:900px){
  main{flex-direction:row;padding:0 8px 8px;gap:8px}
  .stage{margin:0}
  .dock{width:400px;height:auto;margin:0;border-radius:14px}
}

/* touch + small screens */
@media (pointer:coarse){
  .btn{min-height:40px}.ic{width:44px}
  .tab{padding:13px 12px 13px}
  .chip{min-height:40px;padding:8px 14px}
  .pill{min-height:40px}
  input[type=range]{height:40px}
  input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-11.5px}
  .sw{height:40px}
  .field,select.field{min-height:40px;font-size:16px}
  .pal-edit input[type=color]{height:40px;width:44px}
}
@media (max-width:640px){
  header{padding:6px 10px;flex-wrap:wrap}
  .acts{gap:4px;flex:1;justify-content:flex-end}
  .btn{padding:7px 10px}
  .stage{margin:0 6px}
  .dock{height:min(52%,440px);margin-top:6px}
  .info{display:none}
  .float.bl{flex-wrap:wrap;max-width:62%}
  .float.br{right:6px}
  .pill{padding:7px 10px;font-size:11.5px}
  .pane{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-height:500px) and (orientation:landscape){
  main{flex-direction:row;padding:0 6px 6px;gap:6px}
  .stage{margin:0}
  .dock{width:42%;height:auto;margin:0;border-radius:14px}
}

/* ===== Inspector, skins (replaces the chip/tab look) ===== */
:root{--rad:2px;--lab:'JetBrains Mono',ui-monospace,monospace}
:root[data-skin=lab]{--bg:#0b0b0c;--panel:#111113;--raise:#1a1a1d;--line:#2b2b2f;--ink:#e8e6e1;--mute:#85838c;--accent:#ff5a1f;--on-accent:#150a04;--stage:#050506;--hot:#ff5a1f;color-scheme:dark}
:root[data-skin=parchment]{--bg:#e6d9bb;--panel:#f0e6cb;--raise:#e0d1ac;--line:#b8a47a;--ink:#2b1d12;--mute:#7a6648;--accent:#9b2d20;--on-accent:#f7eed8;--stage:#2b1d12;--hot:#9b2d20;color-scheme:light}
:root[data-skin=utility]{--bg:#b9b9b9;--panel:#d0d0d0;--raise:#e4e4e4;--line:#7d7d7d;--ink:#111;--mute:#454545;--accent:#1c2f6e;--on-accent:#fff;--stage:#222;--hot:#a31515;color-scheme:light}
.btn,.pill,.chip,.tab,.field,.sw,.stage,.dock,.sheet>div,.xp,.toast{border-radius:var(--rad)!important}
.btn,.chip{border:1px solid var(--line)}.btn.primary{border-color:var(--accent)}
.pill{border:1px solid #fff3}
.mark b{color:var(--accent)}
.chip{background:var(--raise);min-height:30px}.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--ink) var(--p,50%),var(--line) var(--p,50%));height:1px}
input[type=range]::-webkit-slider-thumb{border-radius:0;width:9px;height:15px;margin-top:-7px;background:var(--ink)}
.dock{background:var(--panel);display:flex;flex-direction:column;min-height:0;position:relative}
.grab{display:none;height:20px;flex:none;touch-action:none;cursor:grab}
.grab::after{content:"";display:block;width:36px;height:3px;background:var(--line);margin:9px auto 0}
.strip{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;flex:none;border-bottom:1px solid var(--line);scrollbar-width:none;align-items:stretch}
.strip::-webkit-scrollbar{display:none}
.ly{flex:none;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:6px;width:112px;border:1px solid var(--line);padding:3px;background:var(--raise);cursor:pointer;color:var(--ink);text-align:left;min-height:48px}
.ly b{font:700 11px var(--lab);grid-row:1/3;align-self:start;color:var(--mute)}
.ly canvas{width:100%;height:30px;display:block;grid-column:2;background:#000;object-fit:cover}
.ly span{grid-column:2;font:600 10px/1.2 var(--lab);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ly[aria-current=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ly.off{opacity:.45}
.add{flex:none;width:48px;border:1px dashed var(--line);background:none;font:700 20px var(--lab);color:var(--ink)}
.insp{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.ban{display:flex;align-items:stretch;margin:10px 10px 6px;color:#111;min-height:56px}
.ban .no{font:800 30px/1 var(--display);padding:8px 10px;background:#0006;color:#fff;display:flex;align-items:center}
.ban .nm{flex:1;font:800 24px/1.05 var(--display);padding:8px 10px;display:flex;align-items:center;letter-spacing:-.01em}
.hd{display:flex;gap:6px;padding:0 10px 6px;flex-wrap:wrap}
.hd .btn{padding:6px 10px;font-size:11px;min-height:32px;text-transform:uppercase;letter-spacing:.06em}
.acc{border-top:1px solid var(--line)}
.acc>summary{list-style:none;cursor:pointer;padding:12px 12px;min-height:44px;display:flex;align-items:center;justify-content:space-between;font:600 10.5px var(--lab);text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"+";font-size:14px}.acc[open]>summary::after{content:"−"}
.acc[open]>summary{color:var(--ink)}
.acc .bd{padding:0 0 10px}
.ir{display:grid;grid-template-columns:104px 1fr 54px;align-items:center;column-gap:8px;padding:0 12px;min-height:34px}
.ir .l{font:500 11.5px var(--lab);cursor:ew-resize;user-select:none;-webkit-user-select:none;touch-action:none;padding:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir input[type=range]{grid-column:2;height:30px}
.ir .v{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:right;font:500 11.5px var(--lab);color:var(--ink);padding:4px 0;border-radius:0}
.ir .v:focus{outline:none;border-bottom-color:var(--accent)}
.ir select,.ir .hx{grid-column:2/4;background:var(--raise);border:1px solid var(--line);color:var(--ink);font:500 11.5px var(--lab);padding:6px;min-height:34px}
.ir input[type=color]{width:38px;height:30px;border:1px solid var(--line);padding:0;background:none;grid-column:2}
.ir .hx{grid-column:3;width:100%;min-height:30px;padding:4px}
.ir .cb{grid-column:2;width:22px;height:22px;accent-color:var(--accent)}
.pe{padding:2px 12px 6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ir.r2{grid-template-columns:104px 1fr 54px}.dual{position:relative;height:30px;grid-column:2}.dual::before{content:'';position:absolute;left:0;right:0;top:14px;height:1px;background:var(--line)}.dual::after{content:'';position:absolute;top:13px;height:3px;left:var(--a);right:calc(100% - var(--b));background:var(--ink)}
.dual input{position:absolute;left:0;top:0;width:100%;height:30px;margin:0;pointer-events:none;background:none;-webkit-appearance:none;appearance:none;z-index:1}.dual input::-webkit-slider-runnable-track{background:none;height:1px}.dual input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:11px;height:20px;background:var(--ink);border-radius:0;margin-top:-10px;border:0}
.pe .sl{display:flex;align-items:center;gap:2px;border:1px solid var(--line);padding:2px;background:var(--raise)}
.pe input[type=color]{width:30px;height:30px;border:0;padding:0;background:none}
.pe .hx{width:64px;font:500 10.5px var(--lab);background:none;border:0;color:var(--ink)}
.pe button{min-height:34px;min-width:34px;border:1px solid var(--line);background:none;color:var(--ink);font:600 11px var(--lab)}
.gal{padding:8px 10px}
.gal .cats{display:flex;gap:12px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:10px;scrollbar-width:none}
.gal .cats button{border:0;background:none;padding:10px 0;font:600 10.5px var(--lab);text-transform:uppercase;letter-spacing:.12em;color:var(--mute);border-bottom:2px solid transparent;flex:none;min-height:44px}
.gal .cats button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accent)}
.gal .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.gal .tile{border:1px solid var(--line);background:var(--raise);padding:0;text-align:left;color:var(--ink);cursor:pointer;overflow:hidden}
.gal .tile canvas{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#000}
.gal .tile span{display:block;padding:6px 7px;font:600 10.5px var(--lab)}
.gal .tile i{display:block;height:3px}
.legacy-body{padding-top:2px}
:root[data-skin=parchment] .acc>summary::first-letter{font:400 1.9em/1 'UnifrakturCook',serif;color:var(--accent);letter-spacing:0}
:root[data-skin=parchment] .btn.primary,:root[data-skin=parchment] .chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
:root[data-skin=parchment] .ban{box-shadow:3px 3px 0 var(--ink)}
:root[data-skin=utility] .acc>summary{background:var(--raise);border:1px solid #fff;border-right-color:#555;border-bottom-color:#555;margin:3px 6px;color:var(--ink);letter-spacing:.04em;text-transform:none;font-weight:700}
:root[data-skin=utility] .acc{border-top:0}
:root[data-skin=utility] .ban{border:1px solid #555}
@media (pointer:coarse),(max-width:640px){.ir{min-height:44px}.ir .l{padding:12px 0}.ir input[type=range]{height:44px}.ir .v,.ir select,.ir .cb{min-height:40px}.pe button,.pe .sl{min-height:44px}.hd .btn,.ly{min-height:44px}.btn{min-height:44px}}
.peek,.chipb,.srcmenu{display:none}
body[data-sheet] .peek,body[data-side] .peek{display:block;flex:none;padding:0 0 4px;border-bottom:1px solid var(--line)}
body[data-sheet] .chipb,body[data-side] .chipb{display:block;position:absolute;top:8px;left:8px;z-index:5;min-height:44px;font:600 11px var(--lab);text-transform:uppercase;letter-spacing:.08em;background:#000a;color:#fff}
body[data-sheet] #srcchip,body[data-side] #srcchip{left:96px}
body[data-sheet] .srcmenu:not([hidden]),body[data-side] .srcmenu:not([hidden]){display:flex;flex-direction:column;position:absolute;top:60px;left:96px;z-index:6;background:var(--panel);border:1px solid var(--line)}
.srcmenu button{min-height:44px;min-width:140px;text-align:left;padding:0 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:600 11px var(--lab);text-transform:uppercase;letter-spacing:.08em}
body[data-sheet] #open,body[data-sheet] #cam,body[data-sheet] #rec,body[data-side] #open,body[data-side] #cam,body[data-side] #rec{display:none}
body[data-sheet] main{position:relative;padding-bottom:var(--stagepad,196px)}
body[data-sheet] .stage{margin-bottom:0}
body[data-sheet] .dock{position:fixed;left:0;right:0;bottom:var(--kb,0px);height:var(--sheet,86vh);margin:0!important;border-radius:var(--rad) var(--rad) 0 0!important;z-index:15;
  transform:translateY(var(--ty,0px));will-change:transform;box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
body[data-sheet] .grab{display:block}
body[data-sheet] .insp{padding-bottom:calc(var(--ty,0px) + 32px + env(safe-area-inset-bottom,0px))}
.scrub{display:flex;align-items:center;gap:10px;padding:0 14px;height:42px}
.scrub .sl{flex:none;width:92px;font:600 9.5px var(--lab);letter-spacing:.14em;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrub .sv{flex:none;width:38px;font:600 11px var(--lab);text-align:right}
.scrub input[type=range]{flex:1;min-width:0;width:auto;height:42px;margin:0;background:none;-webkit-appearance:none;appearance:none;touch-action:none}
.scrub input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
.scrub input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:30px;margin-top:-15px;background:var(--ink);border:0;border-radius:0}
.scrub input[type=range]::-moz-range-track{height:1px;background:var(--line)}.scrub input[type=range]::-moz-range-thumb{width:3px;height:30px;background:var(--ink);border:0;border-radius:0}
.moderow{display:flex;justify-content:center;padding:2px 0 8px}
.btn.mode{min-width:168px;min-height:44px;font:700 12px var(--lab);letter-spacing:.14em;text-transform:uppercase;background:var(--raise)}
.railwrap{position:relative}

<script>
/* =====================================================================
   n0ise — shaders.  Pipeline: tone → quantize → glitch → signal A/B →
   CRT beam & phosphor → persistence → bloom → glass.
   ===================================================================== */
const VS=`#version 300 es
out vec2 vUv;
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;

const HEAD=`#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
const float PI=3.14159265;
float h11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec2 h22(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
vec3 rgb2yiq(vec3 c){return vec3(dot(c,vec3(.299,.587,.114)),dot(c,vec3(.5959,-.2746,-.3213)),dot(c,vec3(.2115,-.5227,.3112)));}
vec3 yiq2rgb(vec3 y){return vec3(y.x+.956*y.y+.621*y.z,y.x-.272*y.y-.647*y.z,y.x-1.106*y.y+1.703*y.z);}
vec3 hueRot(vec3 c,float a){vec3 y=rgb2yiq(c);float cs=cos(a),sn=sin(a);y.yz=vec2(y.y*cs-y.z*sn,y.y*sn+y.z*cs);return yiq2rgb(y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float vn3(vec3 p){float z=floor(p.z),fz=fract(p.z);fz=fz*fz*(3.-2.*fz);return mix(vnoise(p.xy+z*17.13),vnoise(p.xy+(z+1.)*17.13),fz);}
`;

/* ---------- 1. tone: crop, downsample, adjust ---------- */
const F_TONE=HEAD+`
uniform sampler2D uSrc;
uniform float uSrcAsp,uScrAsp,uSpread,uBlur,uSharp,uEdge,uBright,uContrast,uMid,uHigh,uSat,uHue,uInv;
uniform vec2 uTexel;
vec2 cover(vec2 uv){float r=uScrAsp/uSrcAsp;vec2 s=r>1.?vec2(1.,1./r):vec2(r,1.);return (uv-.5)*s+.5;}
void main(){
  vec2 uv=cover(vUv);
  float sp=max(uSpread,.5);
  vec3 c=vec3(0.);float w=0.;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){
    float ww=(i==0&&j==0)?2.:1.;
    c+=ww*texture(uSrc,uv+vec2(float(i),float(j))*sp*uTexel).rgb;w+=ww;
  }
  c/=w;
  float rr=sp*(2.+uBlur*1.5);
  vec3 ring=vec3(0.);
  for(int k=0;k<8;k++){float a=float(k)*.785398;ring+=texture(uSrc,uv+vec2(cos(a),sin(a))*rr*uTexel).rgb;}
  ring/=8.;
  c=mix(c,ring,clamp(uBlur*.2,0.,1.));
  c+=uSharp*.35*(c-ring);
  if(uEdge>.001){
    vec2 d=sp*uTexel;
    float e=abs(lum(texture(uSrc,uv+vec2(d.x,0.)).rgb)-lum(texture(uSrc,uv-vec2(d.x,0.)).rgb))
           +abs(lum(texture(uSrc,uv+vec2(0.,d.y)).rgb)-lum(texture(uSrc,uv-vec2(0.,d.y)).rgb));
    c=mix(c,vec3(clamp(e*3.,0.,1.)),uEdge);
  }
  c=hueRot(c,uHue);
  float l0=lum(c);c=vec3(l0)+(c-l0)*uSat;
  c+=uBright;c=(c-.5)*uContrast+.5;c=clamp(c,0.,1.);
  c=pow(c,vec3(uMid));
  c+=uHigh*smoothstep(.4,1.,c);c=clamp(c,0.,1.);
  if(uInv>.5)c=1.-c;
  o=vec4(c,1.);
}`;

/* ---------- 2. quantize (ordered / noise / halftone) ---------- */
const F_QUANT=HEAD+`
uniform sampler2D uTone,uBay4,uBay8,uBlue;
uniform int uMethod,uPalN,uPalMode;
uniform float uLv[16];
uniform float uLo,uSpan,uDepth,uStr,uBias,uCell;
uniform vec2 uOff,uGrid;
float thrM(vec2 q){
  vec2 p=q+uOff;
  if(uMethod==1)return .5;
  if(uMethod==2)return texelFetch(uBay4,ivec2(mod(p,4.)),0).r;
  if(uMethod==3)return texelFetch(uBay8,ivec2(mod(p,8.)),0).r;
  if(uMethod==4)return texelFetch(uBlue,ivec2(mod(p,64.)),0).r;
  if(uMethod==5)return h21(p);
  vec2 r=mat2(.70711,-.70711,.70711,.70711)*q/uCell;
  vec2 f=fract(r)-.5;
  return clamp(length(f)*1.41421,0.,1.);
}
void main(){
  vec3 c=texture(uTone,vUv).rgb;
  vec2 p=floor(vUv*uGrid);
  if(uMethod==0){
    if(uPalMode==1)o=vec4(0.,0.,0.,clamp(lum(c),0.,1.));else o=vec4(c,1.);
    return;
  }
  float adj=(.5-thrM(p))*uStr+uBias;
  if(uPalMode==1){
    float sp=uSpan/max(float(uPalN-1),1.);
    float x=uLo+lum(c)*uSpan+adj*sp;
    int b=0;float bd=1e9;
    for(int i=0;i<16;i++){
      if(i>=uPalN)break;
      float d=abs(x-uLv[i]);
      if(d<bd){bd=d;b=i;}
    }
    o=vec4(0.,0.,0.,float(b)/255.);
  }else{
    float k=uDepth-1.;
    vec3 v=floor((c+adj/k)*k+.5)/k;
    o=vec4(clamp(v,0.,1.),1.);
  }
}`;

/* ---------- 3. glitch / waves / feedback / text ---------- */
const F_GLITCH=HEAD+`
uniform sampler2D uQ,uPrev,uText;
uniform vec2 uGrid;
uniform vec3 uPal[16];
uniform int uPalN,uPalMode,uInterp,uWAx,uWSh,uTextOn;
uniform float uCyc,uLines,uTime,uGT,uSeed,uAct,uAsp;
uniform float uRgb,uTear,uSline,uBlock,uDrag,uBand,uInvc,uBurst,uCrush;
uniform float uWA,uWF,uWS,uWFM,uWFMR,uWAM,uWAMR,uWPH,uW2,uW2F,uScope;
uniform float uFbg,uFbz,uFbr,uFbx,uFby,uFbh;
vec3 palAt(float pos){
  float n=float(uPalN);
  pos=mod(pos,n);
  int i0=int(floor(pos));int i1=i0+1;if(i1>=uPalN)i1=0;
  return mix(uPal[i0],uPal[i1],fract(pos));
}
vec3 samp(vec2 uv){
  uv=clamp(uv,vec2(.0005),vec2(.9995));
  vec4 t=texture(uQ,uv);
  if(uPalMode==1){
    float n=float(uPalN);
    if(uInterp==1)return palAt(t.a*(n-1.)+uCyc);
    return palAt(floor(t.a*255.+.5)+floor(uCyc));
  }
  return t.rgb;
}
float wv(float x,int sh){
  float f=fract(x);
  if(sh==0)return sin(x*6.2831853);
  if(sh==1)return 1.-4.*abs(f-.5);
  if(sh==2)return f<.5?1.:-1.;
  return 2.*f-1.;
}
float waveN(float c,float t){
  float ph=c*uWF+t*uWS;
  ph+=uWPH*sin(c*3.1+t*.7)*2.;
  ph+=uWFM*sin(c*uWFMR+t*1.3)*3.;
  float am=1.+uWAM*(sin(c*uWAMR+t*.9)-1.)*.5;
  return (wv(ph,uWSh)+uW2*wv(c*uW2F+t*uWS*1.3,0))*am/(1.+uW2);
}
void main(){
  vec2 uv=vUv;float t=uTime;
  float ev=floor(uGT*(2.+uAct*10.));
  float sd=uSeed*1.37;
  if(uWA>.0001){
    if(uWAx==0||uWAx==2)uv.x+=waveN(uv.y,t)*uWA;
    if(uWAx==1||uWAx==2)uv.y+=waveN(uv.x,t+1.7)*uWA;
  }
  if(uTear>.001){
    float nb=mix(6.,18.,h11(ev+sd));float b=floor(uv.y*nb);
    if(h21(vec2(b,ev+sd))<uAct*.5*uTear+.02*uTear)uv.x+=(h21(vec2(b+3.1,ev+sd))-.5)*.5*uTear;
  }
  if(uSline>.001){
    float row=floor(uv.y*uLines);
    if(h21(vec2(row,floor(uGT*14.)+sd))<uAct*.35*uSline)uv.x+=(h21(vec2(row,ev+9.))-.5)*.25*uSline;
  }
  if(uBlock>.001){
    vec2 cell=floor(uv*vec2(14.,9.));
    if(h21(cell+vec2(ev,sd))<uAct*.2*uBlock+.01*uBlock)uv+=(h22(cell+ev)-.5)*.35*uBlock;
  }
  vec3 c;
  if(uDrag>.001){
    float row=floor(uv.y*uGrid.y/4.);
    float gate=step(h21(vec2(row,ev+sd)),uAct*.6+.1);
    float len=uDrag*.35*gate;
    c=samp(uv);float best=lum(c);
    for(int i=1;i<=14;i++){
      vec3 s=samp(uv-vec2(float(i)/14.*len,0.));
      float l=lum(s);
      if(l>best){best=l;c=s;}
    }
  }else c=samp(uv);
  if(uRgb>.001){
    float a=h11(ev*1.7+sd)*6.2832;
    vec2 d=vec2(cos(a),sin(a))*uRgb*.03*(.3+.7*h11(ev+sd+4.));
    c.r=samp(uv+d).r;c.b=samp(uv-d).b;
  }
  if(uBand>.001){
    float b=floor(uv.y*mix(8.,40.,h11(ev+sd+1.)));
    if(h21(vec2(b,ev+sd+2.))<uAct*.4*uBand+.03*uBand){
      c=hueRot(c,(h21(vec2(b,ev))*2.-1.)*PI);
      if(h21(vec2(b,3.))>.5)c=c.gbr;
    }
  }
  if(uInvc>.001){
    float b=floor(uv.y*mix(5.,20.,h11(ev+sd+8.)));
    if(h21(vec2(b,ev+sd+5.))<uAct*.25*uInvc)c=1.-c;
  }
  if(uBurst>.001){
    vec2 cell=floor(vUv*vec2(30.,18.));
    if(h21(cell+vec2(ev*3.,sd))<uAct*.12*uBurst){
      vec2 q=vUv*uGrid+ev;
      c=mix(c,vec3(h21(q),h21(q+3.),h21(q+7.)),.9);
    }
  }
  if(uCrush>.001){
    vec2 bp=floor(uv*uGrid/8.);
    vec3 bc=samp((bp*8.+4.)/uGrid);
    float q=mix(32.,3.,uCrush);
    c=mix(c,bc,uCrush*.55);c=floor(c*q+.5)/q;c+=(h21(bp+ev)-.5)*.08*uCrush;
  }
  if(uFbg>.001){
    vec2 p=vUv-.5;p.x*=uAsp;
    float cs=cos(uFbr),sn=sin(uFbr);
    p=vec2(p.x*cs-p.y*sn,p.x*sn+p.y*cs);
    p/=(1.+uFbz);p.x/=uAsp;p+=vec2(uFbx,uFby);
    vec3 pr=hueRot(texture(uPrev,p+.5).rgb,uFbh);
    c+=pr*uFbg;
  }
  c=min(c,vec3(2.));
  if(uTextOn==1){vec4 tx=texture(uText,vUv);c=mix(c,tx.rgb,tx.a);}
  if(uScope>.001){
    float y=.5+.28*waveN(vUv.x,t+1.7);
    c+=vec3(.55,1.,.7)*smoothstep(.006,.0,abs(vUv.y-y))*uScope;
  }
  o=vec4(c,1.);
}`;

/* ---------- 4a. composite signal encode → decode ---------- */
const F_SIGA=HEAD+`
uniform sampler2D uSrc;
uniform vec2 uRes;
uniform int uFrame,uStd;
uniform float uTime,uSeed,uPer,uSL,uSC,uYC,uSnr,uCoh,uSnow,uGhost,uGD,uJit,uDrift,uTrk,uHsw,uDrop,uClip,uCsat,uPhase,uRG,uGS,uGDec,uTJ;
void main(){
  float W=uRes.x,L=uRes.y;

/* deterministic hardware fingerprint */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let _hw={s:-1,v:null};
function hardware(seed){
  if(_hw.s===seed)return _hw.v;
  const r=mulberry(seed*7919+13);
  _hw.s=seed;return _hw.v={conv:[r()*2-1,r()*2-1,r()*2-1],gain:[1+(r()-.5)*.1,1+(r()-.5)*.1,1+(r()-.5)*.1],geo:[r()*2-1,r()*2-1]};
}

function compile(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw new Error(gl.getShaderInfoLog(s)+'\n'+src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n').slice(0,4000));}

function mkProg(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  return wrapProg(p);
}
/* background compile (KHR_parallel_shader_compile): returns {poll()->null|'ok'|'err', prog, err}. Falls back to a sync compile. */
function mkProgAsync(vs,fs){
  const ext=gl.getExtension('KHR_parallel_shader_compile'),h={prog:null,err:null};
  if(!ext){try{h.prog=mkProg(vs,fs);}catch(e){h.err=String(e.message).split('\n')[0];}h.poll=h.force=()=>h.err?'err':'ok';return h;}
  const p=gl.createProgram(),sh=[[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]].map(([ty,s])=>{const x=gl.createShader(ty);gl.shaderSource(x,s);gl.compileShader(x);gl.attachShader(p,x);return x;});
  gl.linkProgram(p);
  h.force=()=>{if(!h.prog&&!h.err){gl.getProgramParameter(p,gl.LINK_STATUS);}return h.poll();};
  h.poll=()=>{
    if(h.prog)return 'ok';if(h.err)return 'err';
    if(!gl.getProgramParameter(p,ext.COMPLETION_STATUS_KHR))return null;
    if(gl.getProgramParameter(p,gl.LINK_STATUS)){h.prog=wrapProg(p);return 'ok';}
    h.err=(sh.map(x=>gl.getShaderInfoLog(x)).join(' ')||gl.getProgramInfoLog(p)||'compile failed').split('\n').filter(Boolean).slice(0,2).join(' | ');return 'err';};
  return h;
}
function wrapProg(p){
  const o={p,loc:{}};
  o.l=n=>{let l=o.loc[n];if(l===undefined){l=gl.getUniformLocation(p,n);o.loc[n]=l;}return l;};
  o.f=(n,v)=>{const l=o.l(n);if(l!==null)gl.uniform1f(l,v);};
  o.i=(n,v)=>{const l=o.l(n);if(l!==null)gl.uniform1i(l,v);};
  o.v2=(n,a,b)=>{const l=o.l(n);if(l!==null)gl.uniform2f(l,a,b);};
  o.v3=(n,a,b,c)=>{const l=o.l(n);if(l!==null)gl.uniform3f(l,a,b,c);};
  o.v4=(n,a,b,c,d)=>{const l=o.l(n);if(l!==null)gl.uniform4f(l,a,b,c,d);};
  o.v2v=(n,arr)=>{const l=o.l(n);if(l!==null)gl.uniform2fv(l,arr);};
  o.fv=(n,arr)=>{const l=o.l(n);if(l!==null)gl.uniform1fv(l,arr);};
  o.v3v=(n,arr)=>{const l=o.l(n);if(l!==null)gl.uniform3fv(l,arr);};
  o.use=()=>gl.useProgram(p);
  return o;
}

const EVT=[['tear',60],['rgbs',70],['drop',80],['snr',35],['trk',70],['hsw',70],['gblock',50],['sline',50]];
function lifeStep(t,dt,add){
  const cu=v=>Math.pow(clamp(v/100,0,1),1.5);
  const wr=cu(P.mWear),ag=cu(P.mAge),bd=cu(P.mBand),ins=cu(P.mInst);
  if(wr){add('dust',60*wr);add('scr',45*wr);add('smud',50*wr);add('burn',40*wr);add('micro',25*wr);add('aging',50*wr);}
  if(bd){add('lbw',60*bd);add('cbw',70*bd);add('efoc',40*bd);add('spot',30*bd);E.lines=Math.max(60,E.lines*(1-.6*bd));}
  if(ins){add('jit',50*ins);add('drift',40*ins);add('trk',30*ins);add('hsw',30*ins);add('vhold',8*ins);}
  if(ag){
    const warm=Math.exp(-t/60);
    add('aging',60*ag+Math.min(30,t/8)*ag);add('sati',50*ag);add('convs',40*ag+25*warm*ag);add('conve',45*ag);add('cdrift',60*ag);add('gen',25*ag);
    add('temp',18*ag*Math.sin(t/70+P.seed)+10*warm*ag);add('cbri',-10*warm*ag);

  if(ST.rngSeed!==P.seed){ST.rngSeed=P.seed;ST.rng=mulberry(P.seed*7919+13);ST.ev=[];ST.hx=0;ST.wS=0;ST.wDwell=0;ST.wl=0;ST.ws=0;}

  const rate=P.grate/100*(.02+ins*.9);
  ST.hx*=Math.exp(-dt/2);
  if(rate>0){
    const lam=rate+ST.hx;
    if(rnd()<1-Math.exp(-lam*dt)&&ST.ev.length<6){
      const e=EVT[rnd()*EVT.length|0];
      ST.ev.push({k:e[0],a:e[1]*(.4+.6*rnd()),t0:t,dur:.15+rnd()*1.1});
      ST.hx+=.5+ins;
    }

  ST.ev=ST.ev.filter(v=>t-v.t0<v.dur+.25);

    const x=t-v.t0;let env;

  ST.wDwell+=dt;
  const minDwell=[4,8,6][ST.wS];

    const r=rnd(),pr=dt;

    else if(ST.wS===1){if(r<.10*pr)n=2;else if(r<.22*pr)n=0;}
    else if(ST.wS===2&&r<.25*pr)n=1;

function computeE(t,dt){

      case'square':w=(ph%1)<.5?1:-1;break;
      case'saw':w=2*(ph%1)-1;break;

async function faceTick(){

  if(!FACE.human){ensureHuman();return;}
  const isVid=SRC.el instanceof HTMLVideoElement;if(!isVid&&FACE.ver===SRC.ver)return;
  FACE.last=now;FACE.busy=true;

      const[cx,cy,s]=faceToUV(f.box[0]+f.box[2]/2,f.box[1]+f.box[3]/2,vw,vh),a=.5;
      const tgt=[cx,cy,Math.abs(f.box[2]/2/vw/s[0])*.95,Math.abs(f.box[3]/2/vh/s[1])*1.05];
      FACE.face=FACE.ok?FACE.face.map((v,i)=>v+(tgt[i]-v)*a):tgt;
      const E=(i,j)=>{const p=f.mesh[i],q=f.mesh[j];return faceToUV((p[0]+q[0])/2,(p[1]+q[1])/2,vw,vh);};
      const el=E(33,133),er=E(362,263);FACE.eL=[el[0],el[1]];FACE.eR=[er[0],er[1]];
      for(let i=0;i<42;i++){const p=f.mesh[Math.min(467,i*11)],u=faceToUV(p[0],p[1],vw,vh);FACE.pts[i*2]=u[0];FACE.pts[i*2+1]=u[1];}
      FACE.ok=true;FACE.miss=0;
    }else if(++FACE.miss>5)FACE.ok=false;
  }catch(e){FACE.miss++;}

}

function audioTick(){
  if(!audio.on||!audio.an)return;
  audio.an.getByteFrequencyData(audio.data);
  let s=0;for(let i=0;i<audio.data.length;i++)s+=audio.data[i];
  audio.level=lerp(audio.level,clamp(s/audio.data.length/110,0,1),.35);

/* ---------- sources & export ---------- */
async function loadFile(f){
  if(!f)return;
  if(f.type.startsWith('audio/')||/\.(mp3|wav|m4a|ogg|oga|flac|aac|opus)$/i.test(f.name)){await startAudio(f);return;}
  if(f.type.startsWith('video/')){
    const v=document.createElement('video');v.playsInline=true;v.muted=true;v.loop=true;v.src=URL.createObjectURL(f);
    try{await v.play();setSource(v,'File',true);refreshUI();}catch(e){toast('That video couldn’t be played');}
    return;
  }
  if(f.type==='image/gif'||/\.gif$/i.test(f.name)){
    const g=parseGIF(new Uint8Array(await f.arrayBuffer()));
    if(g&&g.frames.length>1){
      const c=document.createElement('canvas');c.width=g.w;c.height=g.h;
      setSource(c,'File',true);SRC.gif=g;g.t0=performance.now();stepGif();refreshUI();return;
    }
  }
  if(!f.type.startsWith('image/')){toast('Choose an image or video file');return;}
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{setSource(fitCanvas(im,im.naturalWidth,im.naturalHeight),'File');URL.revokeObjectURL(u);refreshUI();};
  im.onerror=()=>toast('That file couldn’t be read as an image');
  im.src=u;
}
let camFacing='environment';
async function startCam(flip){
  if(flip)camFacing=camFacing==='environment'?'user':'environment';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:camFacing,width:{ideal:1280},height:{ideal:960}},audio:false});
    const v=document.createElement('video');v.playsInline=true;v.muted=true;v.srcObject=stream;await v.play();
    setSource(v,'Camera',true);refreshUI();
  }catch(e){toast('Camera isn’t available here');}
}

    if(code===eoi)break;

function lzwEnc(idx){

function bFeat(cv){
  const t=document.createElement('canvas');t.width=t.height=64;const g=t.getContext('2d',{willReadFrequently:true});g.drawImage(cv,0,0,64,64);
  const d=g.getImageData(0,0,64,64).data,L=new Float32Array(4096),hist=new Float32Array(64);
  for(let i=0;i<4096;i++){const r=d[i*4],gg=d[i*4+1],b=d[i*4+2];L[i]=(.299*r+.587*gg+.114*b)/255;hist[(r>>6)<<4|(gg>>6)<<2|(b>>6)]++;}
  for(let i=0;i<64;i++)hist[i]/=4096;
  let e=0;for(let y=0;y<63;y++)for(let x=0;x<63;x++){const i=y*64+x;if(Math.abs(L[i+1]-L[i])+Math.abs(L[i+64]-L[i])>.1)e++;}
  /* radial spectrum via naive separable DFT on 32x32 */
  const N=32,re=new Float32Array(N*N),im=new Float32Array(N*N),cs=[],sn=[];
  for(let k=0;k<N;k++){cs.push([]);sn.push([]);for(let n=0;n<N;n++){const a=2*Math.PI*k*n/N;cs[k].push(Math.cos(a));sn[k].push(-Math.sin(a));}}
  const m=new Float32Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++)m[y*N+x]=L[(y*2)*64+x*2];
  const tr=new Float32Array(N*N),ti=new Float32Array(N*N);
  for(let y=0;y<N;y++)for(let k=0;k<N;k++){let a=0,b=0;for(let n=0;n<N;n++){a+=m[y*N+n]*cs[k][n];b+=m[y*N+n]*sn[k][n];}tr[y*N+k]=a;ti[y*N+k]=b;}
  for(let x=0;x<N;x++)for(let k=0;k<N;k++){let a=0,b=0;for(let n=0;n<N;n++){const c=cs[k][n],s=sn[k][n],xr=tr[n*N+x],xi=ti[n*N+x];a+=xr*c-xi*s;b+=xr*s+xi*c;}re[k*N+x]=a;im[k*N+x]=b;}
  const rb=new Float32Array(6),rc=new Float32Array(6);
  for(let ky=0;ky<N;ky++)for(let kx=0;kx<N;kx++){const fy=ky>N/2?N-ky:ky,fx=kx>N/2?N-kx:kx,r=Math.hypot(fx,fy);if(r<1)continue;const b=Math.min(5,Math.floor(Math.log2(r)*1.2));rb[b]+=re[ky*N+kx]**2+im[ky*N+kx]**2;rc[b]++;}
  const spec=Array.from(rb,(v,i)=>Math.log10(1+v/Math.max(1,rc[i]))/4);
  return {hist,spec,edge:e/3969};
}
function bDist(a,b){

  let s=0;for(let i=0;i<6;i++)s+=Math.abs(a.spec[i]-b.spec[i]);s/=6;
  return .5*h+.3*s*2+.2*Math.abs(a.edge-b.edge)*3;

function cyanFrac(cv){

  const cv=document.createElement('canvas');cv.width=cv.height=48;const g=cv.getContext('2d',{willReadFrequently:true});
  try{g.drawImage(SRC.el,0,0,48,48);}catch(e){return null;}
  const d=g.getImageData(0,0,48,48).data,px=[];for(let i=0;i<d.length;i+=4)px.push([d[i],d[i+1],d[i+2]]);
  let cs=Array.from({length:k},(_,i)=>px[Math.floor((i+.5)*px.length/k)].slice());
  for(let it=0;it<8;it++){const sum=cs.map(()=>[0,0,0,0]);
    px.forEach(c=>{let b=0,bd=1e9;cs.forEach((m,i)=>{const e=(c[0]-m[0])**2+(c[1]-m[1])**2+(c[2]-m[2])**2;if(e<bd){bd=e;b=i;}});sum[b][0]+=c[0];sum[b][1]+=c[1];sum[b][2]+=c[2];sum[b][3]++;});
    cs=cs.map((m,i)=>sum[i][3]?[sum[i][0]/sum[i][3],sum[i][1]/sum[i][3],sum[i][2]/sum[i][3]]:m);}
  return cs.sort((a,b)=>(.299*a[0]+.587*a[1]+.114*a[2])-(.299*b[0]+.587*b[1]+.114*b[2])).map(rgbHex);
}

    inp.addEventListener('input',()=>{h.V[h.p.k]=+inp.value;val.textContent=fmtv(h.p,+inp.value);inp.style.setProperty('--p',((+inp.value-h.p.min)/(h.p.max-h.p.min)*100)+'%');});
    inp.addEventListener('change',()=>{if(l.module==='crtlab')snap();});}
  else inp.disabled=true;
  sc.append(lab,inp,val);host.insertBefore(sc,host.querySelector('.railwrap'));
  /* MODE */
  const row=el('div','moderow'),mb=el('button','btn mode','MODE 1');
  const label=()=>{const p=l.module==='crtlab'?null:m.params.find(x=>x.t==='c');mb.textContent='MODE '+(p?(+l.params[p.k]+1):(l.module==='crtlab'?(PROFILES.filter(q=>q[0]!=='none').findIndex(q=>q[0]===P.profile)+1||1):(l.seed+1)));};
  label();mb.addEventListener('click',()=>{const n=cycleMode(l);label();toast(n);if(navigator.vibrate)try{navigator.vibrate(6);}catch(e){}});
  row.appendChild(mb);host.insertBefore(row,host.querySelector('.railwrap'));
  /* rail: kept between renders. A selection only moves the highlight; the list is rebuilt only when its contents change. */
  const curId=effectId(l),sig=[SRC.ver,Object.keys(MODULES).length,CAMFX.length,JSON.stringify(lsGet('n0ise.fav',[])),JSON.stringify(lsGet('n0ise.recent',[])),loadRecipes().map(r=>r.id).join()].join('|');
  const oldW=host.querySelector('.railwrap');
  const press=(rl)=>{const ts=[...rl.querySelectorAll('.rtile')];ts.forEach(t=>t.setAttribute('aria-pressed',t._fx?camOn(l,t._fx):t._rec?false:t._id===l.module));
    if(ts.some(t=>t._fx&&t.getAttribute('aria-pressed')==='true'))ts.forEach(t=>{if(!t._fx&&t._id==='fuse')t.setAttribute('aria-pressed',false);});
    if(RAIL.cur!==curId){RAIL.cur=curId;const s=rl.querySelector('[aria-pressed=true]');if(s){const rr=rl.getBoundingClientRect(),sr=s.getBoundingClientRect();
      if(sr.left<rr.left||sr.right>rr.right-48)rl.scrollTo({left:Math.max(0,rl.scrollLeft+sr.left-rr.left-12),behavior:'smooth'});}}};
  if(oldW&&oldW._sig===sig){press(oldW.firstChild);return;}
  const prevScroll=oldW?oldW.firstChild.scrollLeft:null;if(oldW)oldW.remove();
  const wrap=el('div','railwrap'),rail=el('div','rail');wrap._sig=sig;
  const groups={};Object.values(MODULES).filter(x=>!x.hidden).forEach(x=>{(groups[RAIL_FAMILY[x.id]||x.family]=groups[RAIL_FAMILY[x.id]||x.family]||[]).push(x);});
  Object.entries(FX_CATS).forEach(([c,n])=>{groups['Cam · '+n]=CAMFX.filter(f=>f.cat===c).map(f=>({id:'fuse:'+f.id,name:f.label,fx:f}));});
  {const all=effectList(),by=Object.fromEntries(all.map(e=>[e.id,e])),mk=id=>{const e=by[id];if(!e)return null;const f=e.cam&&FXBY[e.cam];return f?{id:e.id,name:e.name,fx:f}:MODULES[e.id];};
   const fav=lsGet('n0ise.fav',[]).map(mk).filter(Boolean),rcn=lsGet('n0ise.recent',[]).map(mk).filter(Boolean);
   const recs=loadRecipes();if(recs.length)groups['Mine']=recs.map(r=>({id:'recipe:'+r.id,name:r.name,rec:r}));
   if(fav.length)groups['★ Favorites']=fav;if(rcn.length)groups['Recent']=rcn;}
  const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;io.unobserve(t);requestAnimationFrame(()=>{if(!t._id)return;const c=cachedThumb(t._id);c.className='rt';t.replaceChild(c,t.firstChild);});}}),{root:rail,rootMargin:'0px 200px'}):null;
  RAIL_ORDER.filter(f=>groups[f]).concat(Object.keys(groups).filter(f=>!RAIL_ORDER.includes(f))).forEach(f=>{
    const g=el('div','rg');g.dataset.f=f;g.appendChild(el('div','rgl',f));const row=el('div','rgt');

  if(prevScroll!=null)rail.scrollLeft=prevScroll;else{const sel=rail.querySelector('[aria-pressed=true]');if(sel){const rr=rail.getBoundingClientRect(),sr=sel.getBoundingClientRect();rail.scrollLeft=Math.max(0,rail.scrollLeft+sr.left-rr.left-12);}}

}
const RAIL={cur:''};
const SHEET={s:1,vis:()=>[26,222,Math.round(innerHeight*.46),Math.round(innerHeight*.86)]};
function wireSheet(){
  const dock=$i('dock'),grab=$i('grab'),app=document.querySelector('.app');
  const mqS=matchMedia('(max-width:640px),(pointer:coarse) and (max-width:900px)'),mqL=matchMedia('(orientation:landscape) and (max-height:520px)');
  const full=()=>Math.round(innerHeight*.88);
  const apply=(s,anim=true)=>{SHEET.s=s;const v=SHEET.vis()[s];dock.style.setProperty('--sheet',full()+'px');dock.style.transition=anim?'transform .26s cubic-bezier(.2,.8,.2,1)':'none';
    dock.style.setProperty('--ty',(full()-v)+'px');app.style.setProperty('--stagepad',v+'px');dock.dataset.state=['hidden','peek','half','full'][s];if(s>=2)renderInspector();};
  SHEET.apply=apply;
  let y0=0,t0=0,ty0=0,drag=false,moved=false;
  grab.addEventListener('pointerdown',e=>{drag=true;moved=false;y0=e.clientY;t0=performance.now();ty0=parseFloat(dock.style.getPropertyValue('--ty'))||0;grab.setPointerCapture(e.pointerId);dock.style.transition='none';});
  grab.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientY-y0)>4)moved=true;dock.style.setProperty('--ty',Math.max(0,Math.min(full()-SHEET.vis()[0],ty0+e.clientY-y0))+'px');});
  grab.addEventListener('pointerup',e=>{if(!drag)return;drag=false;
    if(!moved){apply(SHEET.s===1?2:1);return;}
    const ty=parseFloat(dock.style.getPropertyValue('--ty')),v=(e.clientY-y0)/Math.max(1,performance.now()-t0),shown=full()-ty-v*220;
    let best=0,bd=1e9;SHEET.vis().forEach((f,i)=>{const d=Math.abs(f-shown);if(d<bd){bd=d;best=i;}});apply(best);});
  grab.addEventListener('keydown',e=>{if(e.key==='ArrowUp')apply(Math.min(3,SHEET.s+1));if(e.key==='ArrowDown')apply(Math.max(0,SHEET.s-1));});
  grab.tabIndex=0;grab.setAttribute('role','button');
  /* keyboard: lift the sheet above the virtual keyboard */
  const vv=window.visualViewport;
  const kb=()=>{if(!vv||!mqS.matches)return;const k=Math.max(0,innerHeight-vv.height-vv.offsetTop);dock.style.setProperty('--kb',(k>80?k:0)+'px');};
  if(vv){vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb);}
  dock.addEventListener('focusin',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&SHEET.s<2)apply(2);setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'});}catch(_){}},250);});
  const upd=()=>{if(mqS.matches&&mqL.matches)document.body.dataset.side='1';else delete document.body.dataset.side;
    if(mqS.matches&&!mqL.matches){document.body.dataset.sheet='1';apply(SHEET.s,false);}
    else{delete document.body.dataset.sheet;dock.style.removeProperty('--ty');dock.style.removeProperty('--sheet');app.style.removeProperty('--stagepad');}};
  mqS.addEventListener('change',upd);mqL.addEventListener('change',upd);addEventListener('resize',upd);upd();
  /* art-only toggle and source menu */
  const close=$i('artonly');if(close)close.addEventListener('click',()=>apply(SHEET.s===0?1:0));
  const sm=$i('srcchip'),menu=$i('srcmenu');
  if(sm){sm.addEventListener('click',()=>{menu.hidden=!menu.hidden;});
    menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;menu.hidden=true;const a=b.dataset.a;
      if(a==='open')$i('open').click();else if(a==='audio'){let fi=$('#audfile');if(!fi){fi=document.createElement('input');fi.type='file';fi.id='audfile';fi.accept='audio/*,.mp3,.wav,.m4a,.ogg,.flac,.aac';fi.hidden=true;fi.addEventListener('change',()=>{const f=fi.files[0];fi.value='';if(f)startAudio(f);});document.body.appendChild(fi);}fi.click();}else if(a==='cam')openCamera();else if(a==='rec')$i('rec').click();
      else if(a==='demo'){setSource(demoCanvas(),'Demo');refreshUI();}else if(a==='test'){setSource(testCanvas(),'Test');refreshUI();}});}
}
