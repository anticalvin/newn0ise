<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>n0ise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060a; --panel:#0d0d13; --raise:#15151d; --line:#22222d; --ink:#ecedf4; --mute:#797c90;
  --accent:#3df5ff; --on-accent:#021417; --hot:#ff3d6e; --stage:#020204;
  --display:"Syne",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9eaf0; --panel:#f6f6fa; --raise:#e6e7ee; --line:#d3d5df; --ink:#0c0d14; --mute:#6c6f84;
    --accent:#0a5cff; --on-accent:#fff; --hot:#e0194d; --stage:#0a0a0e; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e9eaf0; --panel:#f6f6fa; --raise:#e6e7ee; --line:#d3d5df; --ink:#0c0d14; --mute:#6c6f84;
  --accent:#0a5cff; --on-accent:#fff; --hot:#e0194d; --stage:#0a0a0e; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:12.5px/1.4 var(--mono);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;flex:none;gap:8px}
.mark{font:800 21px/1 var(--display);letter-spacing:-.02em}
.mark b{color:var(--accent);font-weight:800}
.acts{display:flex;gap:6px;align-items:center}
.btn{border:0;border-radius:999px;padding:7px 12px;background:var(--raise);font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.rec[aria-pressed=true]{background:var(--hot);color:#fff}
.btn:disabled{opacity:.35}
.ic{width:34px;padding:7px 0;text-align:center}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;background:var(--stage);
  margin:0 8px;border-radius:14px;overflow:hidden}
#gl{display:block;grid-area:1/1;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage.drag{outline:2px dashed var(--accent);outline-offset:-8px}
.info{position:absolute;left:10px;top:8px;color:#fff9;font-size:11px;pointer-events:none;text-shadow:0 1px 2px #000}
.float{position:absolute;display:flex;gap:6px}
.float.bl{left:8px;bottom:8px}.float.br{right:8px;bottom:8px}.float.tr{right:8px;top:8px}
.pill{border:0;border-radius:999px;padding:7px 12px;font-weight:500;font-size:12px;color:#fff;
  background:#0b0b10b3;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pill[aria-pressed=true],.pill:active{background:var(--accent);color:var(--on-accent)}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute);background:var(--stage)}

.dock{flex:none;height:min(46%,400px);display:flex;flex-direction:column;background:var(--panel);
  border-radius:18px 18px 0 0;margin-top:8px;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;overflow-x:auto;scrollbar-width:none;flex:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:8px 11px 10px;font:700 13px/1 var(--display);color:var(--mute);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 18px}
.grp{padding:10px 0 2px}
.gt{padding:0 14px 4px;color:var(--mute);font-size:11px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:0;border-radius:999px;padding:6px 11px;background:var(--raise);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chip.act{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.chip.act:active{background:var(--accent);color:var(--on-accent)}
.cl{padding:2px 14px 0;color:var(--mute);font-size:11px}
.sw{flex:none;width:50px;height:28px;border:0;border-radius:8px;padding:0;box-shadow:inset 0 0 0 1px #ffffff1f}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;padding:2px 14px 0}
.row label{font-weight:500}
.row output{color:var(--mute);min-width:3.5ch;text-align:right}
input[type=range]{grid-column:1/-1;-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);border:0;margin-top:-7.5px}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}
.field{margin:4px 14px 6px;padding:8px 10px;border:0;border-radius:10px;background:var(--raise);width:calc(100% - 28px);resize:vertical}
select.field{width:auto;margin:0}
.pal-edit{display:flex;gap:6px;align-items:center;padding:2px 14px 8px;flex-wrap:wrap}
.pal-edit input[type=color]{width:34px;height:30px;border:0;border-radius:8px;padding:0;background:none}
.mod{margin:6px 14px;padding:8px 0 4px;border-top:1px solid var(--line)}
.mod .line{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.mod .row{padding:0}
.sheet{position:fixed;inset:0;z-index:20;background:#05050acc;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet>div{max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.sheet img{max-width:100%;max-height:62vh;border-radius:6px;-webkit-touch-callout:default;user-select:auto}
.xrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.xrow .btn{text-decoration:none;display:inline-flex;align-items:center;min-height:44px;padding:0 18px}
.xp{background:var(--panel);border-radius:18px;padding:18px 0 16px;gap:6px!important;max-width:360px!important;align-items:stretch!important}
.xp h3{margin:0 14px 6px;font:800 20px var(--display)}
.xp .btn.big{margin:6px 14px 0;min-height:48px;font-size:14px}
.xp #xc{margin:6px 14px 0}.xp.busy,.sheet.busy .xp{opacity:.85}.sheet.busy .btn,.sheet.busy .chip{pointer-events:none;opacity:.5}
.sheet p{margin:0;color:var(--mute);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;z-index:30;font-weight:500;max-width:90vw}

@media (min-width:900px){
  main{flex-direction:row;padding:0 8px 8px;gap:8px}
  .stage{margin:0}
  .dock{width:400px;height:auto;margin:0;border-radius:14px}
}

/* touch + small screens */
@media (pointer:coarse){
  .btn{min-height:40px}.ic{width:44px}
  .tab{padding:13px 12px 13px}
  .chip{min-height:40px;padding:8px 14px}
  .pill{min-height:40px}
  input[type=range]{height:40px}
  input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-11.5px}
  .sw{height:40px}
  .field,select.field{min-height:40px;font-size:16px}
  .pal-edit input[type=color]{height:40px;width:44px}
}
@media (max-width:640px){
  header{padding:6px 10px;flex-wrap:wrap}
  .acts{gap:4px;flex:1;justify-content:flex-end}
  .btn{padding:7px 10px}
  .stage{margin:0 6px}
  .dock{height:min(52%,440px);margin-top:6px}
  .info{display:none}
  .float.bl{flex-wrap:wrap;max-width:62%}
  .float.br{right:6px}
  .pill{padding:7px 10px;font-size:11.5px}
  .pane{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-height:500px) and (orientation:landscape){
  main{flex-direction:row;padding:0 6px 6px;gap:6px}
  .stage{margin:0}
  .dock{width:42%;height:auto;margin:0;border-radius:14px}
}

/* ===== Inspector, skins (replaces the chip/tab look) ===== */
:root{--rad:2px;--lab:'JetBrains Mono',ui-monospace,monospace}
:root[data-skin=lab]{--bg:#0b0b0c;--panel:#111113;--raise:#1a1a1d;--line:#2b2b2f;--ink:#e8e6e1;--mute:#85838c;--accent:#ff5a1f;--on-accent:#150a04;--stage:#050506;--hot:#ff5a1f;color-scheme:dark}
:root[data-skin=parchment]{--bg:#e6d9bb;--panel:#f0e6cb;--raise:#e0d1ac;--line:#b8a47a;--ink:#2b1d12;--mute:#7a6648;--accent:#9b2d20;--on-accent:#f7eed8;--stage:#2b1d12;--hot:#9b2d20;color-scheme:light}
:root[data-skin=utility]{--bg:#b9b9b9;--panel:#d0d0d0;--raise:#e4e4e4;--line:#7d7d7d;--ink:#111;--mute:#454545;--accent:#1c2f6e;--on-accent:#fff;--stage:#222;--hot:#a31515;color-scheme:light}
.btn,.pill,.chip,.tab,.field,.sw,.stage,.dock,.sheet>div,.xp,.toast{border-radius:var(--rad)!important}
.btn,.chip{border:1px solid var(--line)}.btn.primary{border-color:var(--accent)}
.pill{border:1px solid #fff3}
.mark b{color:var(--accent)}
.chip{background:var(--raise);min-height:30px}.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--ink) var(--p,50%),var(--line) var(--p,50%));height:1px}
input[type=range]::-webkit-slider-thumb{border-radius:0;width:9px;height:15px;margin-top:-7px;background:var(--ink)}
.dock{background:var(--panel);display:flex;flex-direction:column;min-height:0;position:relative}
.grab{display:none;height:20px;flex:none;touch-action:none;cursor:grab}
.grab::after{content:"";display:block;width:36px;height:3px;background:var(--line);margin:9px auto 0}
.strip{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;flex:none;border-bottom:1px solid var(--line);scrollbar-width:none;align-items:stretch}
.strip::-webkit-scrollbar{display:none}
.ly{flex:none;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:6px;width:112px;border:1px solid var(--line);padding:3px;background:var(--raise);cursor:pointer;color:var(--ink);text-align:left;min-height:48px}
.ly b{font:700 11px var(--lab);grid-row:1/3;align-self:start;color:var(--mute)}
.ly canvas{width:100%;height:30px;display:block;grid-column:2;background:#000;object-fit:cover}
.ly span{grid-column:2;font:600 10px/1.2 var(--lab);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ly[aria-current=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ly.off{opacity:.45}
.add{flex:none;width:48px;border:1px dashed var(--line);background:none;font:700 20px var(--lab);color:var(--ink)}
.insp{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.ban{display:flex;align-items:stretch;margin:10px 10px 6px;color:#111;min-height:56px}
.ban .no{font:800 30px/1 var(--display);padding:8px 10px;background:#0006;color:#fff;display:flex;align-items:center}
.ban .nm{flex:1;font:800 24px/1.05 var(--display);padding:8px 10px;display:flex;align-items:center;letter-spacing:-.01em}
.hd{display:flex;gap:6px;padding:0 10px 6px;flex-wrap:wrap}
.hd .btn{padding:6px 10px;font-size:11px;min-height:32px;text-transform:uppercase;letter-spacing:.06em}
.acc{border-top:1px solid var(--line)}
.acc>summary{list-style:none;cursor:pointer;padding:12px 12px;min-height:44px;display:flex;align-items:center;justify-content:space-between;font:600 10.5px var(--lab);text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"+";font-size:14px}.acc[open]>summary::after{content:"−"}
.acc[open]>summary{color:var(--ink)}
.acc .bd{padding:0 0 10px}
.ir{display:grid;grid-template-columns:104px 1fr 54px;align-items:center;column-gap:8px;padding:0 12px;min-height:34px}
.ir .l{font:500 11.5px var(--lab);cursor:ew-resize;user-select:none;-webkit-user-select:none;touch-action:none;padding:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir input[type=range]{grid-column:2;height:30px}
.ir .v{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:right;font:500 11.5px var(--lab);color:var(--ink);padding:4px 0;border-radius:0}
.ir .v:focus{outline:none;border-bottom-color:var(--accent)}
.ir select,.ir .hx{grid-column:2/4;background:var(--raise);border:1px solid var(--line);color:var(--ink);font:500 11.5px var(--lab);padding:6px;min-height:34px}
.ir input[type=color]{width:38px;height:30px;border:1px solid var(--line);padding:0;background:none;grid-column:2}
.ir .hx{grid-column:3;width:100%;min-height:30px;padding:4px}
.ir .cb{grid-column:2;width:22px;height:22px;accent-color:var(--accent)}
.pe{padding:2px 12px 6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pe .sl{display:flex;align-items:center;gap:2px;border:1px solid var(--line);padding:2px;background:var(--raise)}
.pe input[type=color]{width:30px;height:30px;border:0;padding:0;background:none}
.pe .hx{width:64px;font:500 10.5px var(--lab);background:none;border:0;color:var(--ink)}
.pe button{min-height:34px;min-width:34px;border:1px solid var(--line);background:none;color:var(--ink);font:600 11px var(--lab)}
.gal{padding:8px 10px}
.gal .cats{display:flex;gap:12px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:10px;scrollbar-width:none}
.gal .cats button{border:0;background:none;padding:10px 0;font:600 10.5px var(--lab);text-transform:uppercase;letter-spacing:.12em;color:var(--mute);border-bottom:2px solid transparent;flex:none;min-height:44px}
.gal .cats button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accent)}
.gal .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.gal .tile{border:1px solid var(--line);background:var(--raise);padding:0;text-align:left;color:var(--ink);cursor:pointer;overflow:hidden}
.gal .tile canvas{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#000}
.gal .tile span{display:block;padding:6px 7px;font:600 10.5px var(--lab)}
.gal .tile i{display:block;height:3px}
.legacy-body{padding-top:2px}
:root[data-skin=parchment] .acc>summary::first-letter{font:400 1.9em/1 'UnifrakturCook',serif;color:var(--accent);letter-spacing:0}
:root[data-skin=parchment] .btn.primary,:root[data-skin=parchment] .chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
:root[data-skin=parchment] .ban{box-shadow:3px 3px 0 var(--ink)}
:root[data-skin=utility] .acc>summary{background:var(--raise);border:1px solid #fff;border-right-color:#555;border-bottom-color:#555;margin:3px 6px;color:var(--ink);letter-spacing:.04em;text-transform:none;font-weight:700}
:root[data-skin=utility] .acc{border-top:0}
:root[data-skin=utility] .ban{border:1px solid #555}
@media (pointer:coarse),(max-width:640px){.ir{min-height:44px}.ir .l{padding:12px 0}.ir input[type=range]{height:44px}.ir .v,.ir select,.ir .cb{min-height:40px}.pe button,.pe .sl{min-height:44px}.hd .btn,.ly{min-height:44px}.btn{min-height:44px}}
@media (max-width:640px),(pointer:coarse) and (max-width:900px){
  main{position:relative}
  .dock{position:fixed;left:0;right:0;bottom:0;height:var(--sheet,72vh);margin:0!important;border-radius:var(--rad) var(--rad) 0 0!important;z-index:15;
    transform:translateY(var(--ty,0px));will-change:transform;box-shadow:0 -1px 0 var(--line)}
  .grab{display:block}
  .app main{padding-bottom:var(--stagepad,56px)}
  .stage{margin-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">n<b>0</b>ise</div>
    <div class="acts">
      <button class="btn ic" id="undo" title="Undo" aria-label="Undo">↶</button>
      <button class="btn" id="open">Open</button>
      <button class="btn" id="cam">Camera</button>
      <button class="btn rec" id="rec" aria-pressed="false">Rec</button>
      <button class="btn primary" id="save">Save</button>
    </div>
  </header>
  <main>
    <div class="stage" id="stage">
      <canvas id="gl"></canvas>
      <div class="info" id="info"></div>
      <div class="float tr"><button class="pill" id="reset">Reset</button><button class="pill" id="textoff" hidden>Remove text</button><button class="pill" id="power" aria-pressed="true">Power</button></div>
      <div class="float bl"><button class="pill" id="shuffle">Shuffle</button><button class="pill" id="paint" aria-pressed="false">Beam paint</button></div>
      <div class="float br"><button class="pill" id="hold">Hold for original</button></div>
      <div class="err" id="err" hidden></div>
    </div>
    <section class="dock" id="dock">
      <div class="grab" id="grab" aria-label="Resize panel"></div>
      <div class="strip" id="strip"></div>
      <div class="insp" id="insp"></div>
      <div id="legacy" hidden><nav class="tabs" id="tabs" role="tablist"></nav><div class="pane" id="pane"></div></div>
    </section>
  </main>
</div>
<input type="file" id="file" accept="image/*,video/*" hidden>
<script>
/* =====================================================================
   n0ise — shaders.  Pipeline: tone → quantize → glitch → signal A/B →
   CRT beam & phosphor → persistence → bloom → glass.
   ===================================================================== */
const VS=`#version 300 es
out vec2 vUv;
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;

const HEAD=`#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
const float PI=3.14159265;
float h11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec2 h22(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
vec3 rgb2yiq(vec3 c){return vec3(dot(c,vec3(.299,.587,.114)),dot(c,vec3(.5959,-.2746,-.3213)),dot(c,vec3(.2115,-.5227,.3112)));}
vec3 yiq2rgb(vec3 y){return vec3(y.x+.956*y.y+.621*y.z,y.x-.272*y.y-.647*y.z,y.x-1.106*y.y+1.703*y.z);}
vec3 hueRot(vec3 c,float a){vec3 y=rgb2yiq(c);float cs=cos(a),sn=sin(a);y.yz=vec2(y.y*cs-y.z*sn,y.y*sn+y.z*cs);return yiq2rgb(y);}

/* ---------- 2. quantize (ordered / noise / halftone) ---------- */

/* ---------- 3. glitch / waves / feedback / text ---------- */

uniform sampler2D uQ,uPrev,uText;

/* ---------- 4a. composite signal encode → decode ---------- */
const F_SIGA=HEAD+`

/* ---------- 8. glass, bezel, final composite ---------- */
const F_FINAL=HEAD+`
uniform sampler2D uP,uBA,uBB,uBC;
uniform vec2 uRes,uPointer;
uniform float uSeed,uTime;
uniform float uBloom,uBrad,uHal,uDiff,uRefl,uAR,uGlare,uTint,uDust,uScr,uSmud,uMicro,uVig,uBez,uBsh,uRoom,uPara,uBurnAmt,uLayL,uLayG;
void main(){
  vec2 s=(vUv-.5)*(1.+2.*uBez)+.5;
  vec3 col;
  if(s.x>=0.&&s.x<=1.&&s.y>=0.&&s.y<=1.){
    vec4 pr=texture(uP,s);
    vec3 c=pr.rgb;
    if(uLayL>.5){
      vec3 A=texture(uBA,s).rgb,B=texture(uBB,s).rgb,C=texture(uBC,s).rgb;
      c=mix(c,B*1.1+c*.4,uDiff*.6);
      c+=(A*(1.2-uBrad)+B*.8+C*(.4+uBrad))*uBloom*.9;
      c+=C*vec3(1.,.45,.3)*uHal*1.3;
    }
    c+=vec3(.85,.95,1.)*pr.a*uBurnAmt*.35;
    vec3 hi=max(c-.8,0.);
    c=min(c,vec3(.8))+.2*tanh(hi/.2);
    vec2 g=s*2.-1.;
    if(uLayG>.5){
      vec2 rp=g+uPointer*uPara*.35+vec2(sin(uTime*.2),cos(uTime*.17))*uPara*.04;
      float sb=smoothstep(.55,0.,length((rp-vec2(-.55,.6))*vec2(.9,1.6)));
      float sb2=smoothstep(.5,0.,length((rp-vec2(.7,-.5))*vec2(1.2,1.)))*.4;
      float refl=(sb+sb2)*uRefl*(1.-uAR*.85);
      float sm=vnoise(g*3.+7.)*.6+vnoise(g*9.)*.4;
      refl*=1.+uSmud*(sm-.5)*4.;
      float gl=exp(-dot(rp-vec2(-.35,.5),rp-vec2(-.35,.5))*6.)*uGlare;
      float amb=.35+uRoom*.9;
      c+=vec3(.9,.95,1.)*(refl*.32+gl*.45)*amb;
      vec2 dg=g*vec2(90.,70.)+uSeed;
      vec2 cell=floor(dg);
      float spk=step(1.-.02*uDust,h21(cell))*smoothstep(.45,0.,length(fract(dg)-.5));
      c+=vec3(.95,.95,1.)*spk*(.12+refl*.9+uRoom*.18);
      float sc=0.;
      for(int i=0;i<7;i++){
        float fi=float(i);
        if(fi>=uScr*7.)break;
        vec2 a=vec2(h21(vec2(fi,1.+uSeed)),h21(vec2(fi,2.+uSeed)))*2.-1.;
        float an=h21(vec2(fi,3.+uSeed))*6.28;
        vec2 dir=vec2(cos(an),sin(an));
        vec2 pa=g-a;float h=clamp(dot(pa,dir)/.7,0.,1.);
        sc+=smoothstep(.004,0.,length(pa-dir*h*.7));
      }
      c+=vec3(.9,.95,1.)*sc*(.1+refl*1.1+uRoom*.25);
      c*=1.+(h21(gl_FragCoord.xy+uSeed)-.5)*uMicro*.08;
      c=mix(c,c*vec3(.9,1.,.94),uTint);
      c*=1.-uVig*pow(length(g*.9),2.5)*.7;
    }
    col=c;
  }else{
    vec2 q=abs(s-.5)-.5;
    float d=max(q.x,q.y);
    vec3 bz=vec3(.05,.052,.06)*(1.-.45*uBsh*smoothstep(0.,.1,d));
    bz+=.02*smoothstep(.004,0.,d)+.015*(h21(gl_FragCoord.xy)-.5);
    bz*=.9+.2*(1.-vUv.y);
    col=bz;
  }
  o=vec4(clamp(col,0.,1.),1.);
}`;

function bayer(n){
  if(n===1)return[0];
  const m=bayer(n/2),h=n/2,o=[];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)o[y*n+x]=4*m[(y%h)*h+(x%h)]+[[0,2],[3,1]][y>=h?1:0][x>=h?1:0];

}
function r8tex(w,h,data,wrap){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.R8,w,h,0,gl.RED,gl.UNSIGNED_BYTE,data);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT,4);
  for(const p of[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,p,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,wrap);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,wrap);

}
function blueNoise(n){
  const r=mulberry(4242),a=new Float32Array(n*n);
  for(let i=0;i<a.length;i++)a[i]=r();
  const bl=new Float32Array(n*n);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    let s=0,w=0;
    for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++){
      const g=Math.exp(-(i*i+j*j)/3.2);
      s+=g*a[((y+j+n)%n)*n+((x+i+n)%n)];w+=g;
    }
    bl[y*n+x]=a[y*n+x]-s/w;
  }
  const idx=Array.from(bl.keys()).sort((p,q)=>bl[p]-bl[q]);
  const out=new Uint8Array(n*n);
  idx.forEach((p,rank)=>{out[p]=Math.round(rank/(n*n-1)*255);});
  return out;
}

  if(!SZ.w){SZ.w=stage.clientWidth;SZ.h=stage.clientHeight;}
  const sw=Math.max(40,SZ.w-16),sh=Math.max(40,SZ.h-16);
  let cw=sw,ch=sw/asp;if(ch>sh){ch=sh;cw=sh*asp;}
  const dpr=Math.min(2,window.devicePixelRatio||1),q=parseFloat(E.quality)*ST.autoQ;
  let DW=Math.round(cw*dpr*q),DH=Math.round(ch*dpr*q);

  vec3 b=texture(uBase,vUv).rgb;

  vec3 l=texture(uLay,clamp(uv,0.,1.)).rgb;

  else if(uBlend==4)r=abs(b-l);

function stackRT(name,w,h){

function renderStack(t,dt){
  const vis=STACK.layers.filter(l=>l.visible&&MODULES[l.module]);
  if(!vis.length)return;

  computeE(t,dt);ST.eT=t;syncSrc();
  const lo=layout(),W=lo.DW,H=lo.DH;ST.DW=W;ST.DH=H;
  let acc=stackRT('a',W,H),tmp=stackRT('b',W,H),lay=stackRT('l',W,H);
  const sp=PR.srcp||(PR.srcp=mkProg(VS,F_SRCP));
  bindRT(acc);sp.use();samp(sp,'uSrc',0,TEX.src);sp.f('uSrcAsp',SRC.w/SRC.h);sp.f('uScrAsp',W/H);draw();
  const cp=PR.comp||(PR.comp=mkProg(VS,F_COMP));
  for(const l of vis){
    const m=MODULES[l.module];
    if(l.module==='crtlab'){ST.ovr={tex:acc.tex,w:W,h:H};try{m.render(acc.tex,{t,dt,out:lay,layer:l});}finally{ST.ovr=null;}}
    else m.render(acc.tex,{t,dt,out:lay,layer:l,params:l.params,W,H});
    bindRT(tmp);cp.use();samp(cp,'uBase',0,acc.tex);samp(cp,'uLay',1,lay.tex);
    cp.v2('uTexel',1/W,1/H);cp.v2('uPos',l.pos[0]/100,l.pos[1]/100);
    cp.f('uOpa',l.opacity/100);cp.f('uSize',l.size/100);cp.f('uThr',l.thr/100);cp.f('uShow',l.showSource?1:0);
    const bi=BLENDS.indexOf(l.blend),si=['all','edges','luma'].indexOf(l.select);
    cp.i('uBlend',Math.max(0,bi));cp.i('uSel',Math.max(0,si));

  }

}
function loop(now){
  requestAnimationFrame(loop);
  if(window.__benching)return;
  if(document.hidden||!GLOK||CTX.lost||DEAD)return;
  const cap=+P.fcap;
  if(cap&&now-lastRenderMs<1000/cap-4)return;
  lastRenderMs=now;
  const t=now/1000,dt=clamp(t-lastT,.001,.1);lastT=t;
  fpsAcc+=1/dt;fpsN++;if(fpsN>=20){fps=fpsAcc/fpsN;fpsAcc=0;fpsN=0;adaptQ();$('#info').textContent=infoStr;}
  try{
    if(audio.on)audioTick();
    renderStack(t,dt);frameNo++;
    if(errN){errN=0;const e=$('#err');if(e&&!e.hidden&&!DEAD)e.hidden=true;}
  }catch(e){
    console.error(e);errN++;
    if(errN===1){sizeKey='';lastBKey='';readDrop();toast('Recovering the display…');}
    else if(errN===3){HDR=false;sizeKey='';lastBKey='';ST.autoQ=.5;}
    else if(errN>=8){DEAD=true;noGL('Rendering stopped: '+String(e.message||e).slice(0,200)+' Reload to try again.');}
  }
}

/* ---------- history ---------- */
const HIST=[];let lastSnap='';
function snap(){
  const s=JSON.stringify(P);
  if(s!==lastSnap){if(lastSnap)HIST.push(lastSnap);if(HIST.length>60)HIST.shift();lastSnap=s;}
}
function undo(){
  const s=HIST.pop();if(!s){toast('Nothing to undo');return;}
  Object.assign(P,JSON.parse(s));lastSnap=s;refreshUI();
}

/* ---------- saved looks ---------- */
const loadLooks=()=>{try{return JSON.parse(localStorage.getItem('n0ise.looks')||'[]');}catch(e){return[];}};
function saveLook(){
  const looks=loadLooks();
  looks.push({id:'look'+Date.now(),name:'Look '+(looks.length+1),p:JSON.parse(JSON.stringify(P))});
  try{localStorage.setItem('n0ise.looks',JSON.stringify(looks.slice(-12)));}catch(e){toast('This browser won’t store looks');return;}
  buildProfiles();toast('Look saved');
}

function extractPalette(k){
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d',{willReadFrequently:true});
  try{g.drawImage(SRC.el,0,0,64,64);}catch(e){return P.custom;}
  const d=g.getImageData(0,0,64,64).data,pts=[];
  for(let i=0;i<d.length;i+=4)pts.push([d[i],d[i+1],d[i+2]]);
  const sorted=pts.slice().sort((a,b)=>lum255(a)-lum255(b));
  let cs=Array.from({length:k},(_,i)=>sorted[Math.floor((i+.5)/k*sorted.length)].slice());
  for(let it=0;it<8;it++){
    const sum=cs.map(()=>[0,0,0,0]);
    for(const p of pts){
      let b=0,bd=1e9;
      for(let j=0;j<k;j++){const dd=(p[0]-cs[j][0])**2+(p[1]-cs[j][1])**2+(p[2]-cs[j][2])**2;if(dd<bd){bd=dd;b=j;}}
      sum[b][0]+=p[0];sum[b][1]+=p[1];sum[b][2]+=p[2];sum[b][3]++;
    }
    cs=cs.map((c0,j)=>sum[j][3]?[sum[j][0]/sum[j][3],sum[j][1]/sum[j][3],sum[j][2]/sum[j][3]]:c0);
  }
  P.pal='custom';
  return cs.sort((a,b)=>lum255(a)-lum255(b)).map(rgbHex);
}

/* ---------- GIF decode (animated playback) ---------- */
function lzwDec(min,data,n){
  const out=new Uint8Array(n),clear=1<<min,eoi=clear+1,prefix=new Uint16Array(4096),suffix=new Uint8Array(4096),stack=new Uint8Array(4097);
  let size=min+1,next=eoi+1,mask=(1<<size)-1,bits=0,acc=0,ip=0,prev=-1,first=0,op=0;
  for(let i=0;i<clear;i++)suffix[i]=i;
  while(op<n){
    while(bits<size){if(ip>=data.length)return out;acc|=data[ip++]<<bits;bits+=8;}
    const code=acc&mask;acc>>=size;bits-=size;
    if(code===clear){size=min+1;next=eoi+1;mask=(1<<size)-1;prev=-1;continue;}
    if(code===eoi)break;
    if(prev===-1){out[op++]=suffix[code];prev=code;first=code;continue;}
    let c=code,sp=0;
    if(code>=next){stack[sp++]=first;c=prev;}
    while(c>=clear){stack[sp++]=suffix[c];c=prefix[c];}
    first=suffix[c];stack[sp++]=first;
    if(next<4096){prefix[next]=prev;suffix[next]=first;next++;if(next===(1<<size)&&size<12){size++;mask=(1<<size)-1;}}
    prev=code;
    while(sp>0&&op<n)out[op++]=stack[--sp];
  }
  return out;
}
function parseGIF(b){

  let gct=null;if(fl&128){const n=3<<((fl&7)+1);gct=b.subarray(p,p+n);p+=n;}
  const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
  const comp=mk(W,H),cg=comp.getContext('2d',{willReadFrequently:true});
  const gs=Math.min(1,640/Math.max(W,H)),SW=Math.max(1,Math.round(W*gs)),SH=Math.max(1,Math.round(H*gs));
  const maxF=Math.max(8,Math.min(400,Math.floor(48e6/(SW*SH*4))));
  const frames=[];let gce=null;
  while(p<b.length){
    const t=b[p++];
    if(t===0x3B)break;
    if(t===0x21){
      const l=b[p++];
      if(l===0xF9)gce={disp:(b[p+1]>>2)&7,tr:(b[p+1]&1)?b[p+4]:-1,delay:((b[p+2]|b[p+3]<<8)*10)||100};
      while(p<b.length&&b[p])p+=b[p]+1;p++;
    }else if(t===0x2C){
      const x=b[p]|b[p+1]<<8,y=b[p+2]|b[p+3]<<8,w=b[p+4]|b[p+5]<<8,h=b[p+6]|b[p+7]<<8,f=b[p+8];p+=9;
      let ct=gct;if(f&128){const n=3<<((f&7)+1);ct=b.subarray(p,p+n);p+=n;}
      const min=b[p++],parts=[];let len=0;
      while(p<b.length&&b[p]){parts.push(b.subarray(p+1,p+1+b[p]));len+=b[p];p+=b[p]+1;}p++;
      const data=new Uint8Array(len);let o=0;for(const q of parts){data.set(q,o);o+=q.length;}
      const px=lzwDec(min,data,w*h),img=new ImageData(w,h),d=img.data,tr=gce?gce.tr:-1;
      const rows=[];
      if(f&64){for(const [s,st] of [[0,8],[4,8],[2,4],[1,2]])for(let r=s;r<h;r+=st)rows.push(r);}else for(let r=0;r<h;r++)rows.push(r);
      for(let i=0;i<h;i++){const row=rows[i];for(let c=0;c<w;c++){
        const v=px[i*w+c],q=(row*w+c)*4;
        if(v===tr||!ct){d[q+3]=0;continue;}
        d[q]=ct[v*3];d[q+1]=ct[v*3+1];d[q+2]=ct[v*3+2];d[q+3]=255;}}
      const patch=mk(w,h);patch.getContext('2d').putImageData(img,0,0);
      const disp=gce?gce.disp:0,saved=disp===3?cg.getImageData(0,0,W,H):null;
      cg.drawImage(patch,x,y);
      const snap=mk(SW,SH);snap.getContext('2d').drawImage(comp,0,0,SW,SH);
      frames.push({c:snap,d:Math.max(20,gce?gce.delay:100)});
      if(disp===2)cg.clearRect(x,y,w,h);else if(saved)cg.putImageData(saved,0,0);
      gce=null;
      if(frames.length>=maxF)break;
    }else break;
  }
  return frames.length?{w:SW,h:SH,frames,total:frames.reduce((a,f)=>a+f.d,0),last:-1,t0:performance.now()}:null;
}
function stepGif(){
  const g=SRC.gif;if(!g||!(SRC.el instanceof HTMLCanvasElement))return;
  let t=(performance.now()-g.t0)%g.total,i=0;
  while(i<g.frames.length-1&&t>=g.frames[i].d){t-=g.frames[i].d;i++;}
  if(i===g.last)return;g.last=i;
  const cx=SRC.el.getContext('2d');cx.clearRect(0,0,g.w,g.h);cx.drawImage(g.frames[i].c,0,0);uploadSrc();
}

/* ---------- GIF encode (export) ---------- */
function lzwEnc(idx){
  const CLEAR=256,EOI=257,HS=8209,hk=new Int32Array(HS).fill(-1),hv=new Uint16Array(HS),bytes=[];
  let size=9,next=258,acc=0,nb=0;
  const put=c=>{acc|=c<<nb;nb+=size;while(nb>=8){bytes.push(acc&255);acc>>=8;nb-=8;}};
  put(CLEAR);let cur=idx[0];
  for(let i=1;i<idx.length;i++){
    const c=idx[i],key=(cur<<8)|c;let h=((c<<4)^cur)%HS;
    while(hk[h]!==-1&&hk[h]!==key)h=(h+1)%HS;
    if(hk[h]===key){cur=hv[h];continue;}
    put(cur);
    if(next<4096){hk[h]=key;hv[h]=next++;if(next>(1<<size)&&size<12)size++;}
    else{put(CLEAR);hk.fill(-1);next=258;size=9;}
    cur=c;
  }
  put(cur);put(EOI);if(nb>0)bytes.push(acc&255);
  return bytes;
}
function encodeGIF(frames,w,h,delayMs){
  const out=[71,73,70,56,57,97,w&255,w>>8,h&255,h>>8,0xF7,0,0];
  for(let i=0;i<256;i++)out.push(Math.round((i>>5)*255/7),Math.round(((i>>2)&7)*255/7),Math.round((i&3)*255/3));
  out.push(0x21,0xFF,11,...'NETSCAPE2.0'.split('').map(c=>c.charCodeAt(0)),3,1,0,0,0);
  const cs=Math.max(2,Math.round(delayMs/10)),B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  for(const fr of frames){
    const idx=new Uint8Array(w*h);
    for(let y=0,i=0;y<h;y++)for(let x=0;x<w;x++,i++){
      const j=i*4,t=(B[(y&3)*4+(x&3)]-7.5)*3;
      const r=Math.min(255,Math.max(0,fr[j]+t)),g=Math.min(255,Math.max(0,fr[j+1]+t)),b=Math.min(255,Math.max(0,fr[j+2]+t*1.5));
      idx[i]=(r>>5)<<5|(g>>5)<<2|(b>>6);

    out.push(0x21,0xF9,4,0,cs&255,cs>>8,0,0,0x2C,0,0,0,0,w&255,w>>8,h&255,h>>8,0,8);
    const d=lzwEnc(idx);
    for(let i=0;i<d.length;i+=255){const n=Math.min(255,d.length-i);out.push(n);for(let k=0;k<n;k++)out.push(d[i+k]);}
    out.push(0);
  }
  out.push(0x3B);return new Blob([new Uint8Array(out)],{type:'image/gif'});
}
async function exportGIF(sec,width,setMsg){
  const fps=12,n=sec*fps,w=width,h=Math.round(width*canvas.height/canvas.width);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d',{willReadFrequently:true});
  const frames=[];ST.clean=true;
  for(let i=0;i<n;i++){
    const t0=performance.now();
    await new Promise(r=>requestAnimationFrame(r));
    cx.drawImage(canvas,0,0,w,h);frames.push(cx.getImageData(0,0,w,h).data);
    setMsg(`Capturing ${i+1}/${n}`);
    const wait=1000/fps-(performance.now()-t0);if(wait>0)await new Promise(r=>setTimeout(r,wait));
  }
  ST.clean=false;setMsg('Encoding GIF…');await new Promise(r=>setTimeout(r,30));
  return encodeGIF(frames,w,h,1000/fps);
}

function openSheet(blob,name,isVideo){

  sh.innerHTML=`<div>${media}<p>${(blob.size/1048576).toFixed(1)} MB · ${name.split('.').pop().toUpperCase()}</p><div class="xrow"><a class="btn primary" download="${name}" href="${url}">Download</a>${canShare?'<button class="btn" id="shr">Share</button>':''}<button class="btn" id="cls">Close</button></div></div>`;
  document.body.appendChild(sh);

}

function bFeat(cv){
  const t=document.createElement('canvas');t.width=t.height=64;const g=t.getContext('2d',{willReadFrequently:true});g.drawImage(cv,0,0,64,64);
  const d=g.getImageData(0,0,64,64).data,L=new Float32Array(4096),hist=new Float32Array(64);
  for(let i=0;i<4096;i++){const r=d[i*4],gg=d[i*4+1],b=d[i*4+2];L[i]=(.299*r+.587*gg+.114*b)/255;hist[(r>>6)<<4|(gg>>6)<<2|(b>>6)]++;}
  for(let i=0;i<64;i++)hist[i]/=4096;
  let e=0;for(let y=0;y<63;y++)for(let x=0;x<63;x++){const i=y*64+x;if(Math.abs(L[i+1]-L[i])+Math.abs(L[i+64]-L[i])>.1)e++;}
  /* radial spectrum via naive separable DFT on 32x32 */
  const N=32,re=new Float32Array(N*N),im=new Float32Array(N*N),cs=[],sn=[];
  for(let k=0;k<N;k++){cs.push([]);sn.push([]);for(let n=0;n<N;n++){const a=2*Math.PI*k*n/N;cs[k].push(Math.cos(a));sn[k].push(-Math.sin(a));}}
  const m=new Float32Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++)m[y*N+x]=L[(y*2)*64+x*2];
  const tr=new Float32Array(N*N),ti=new Float32Array(N*N);
  for(let y=0;y<N;y++)for(let k=0;k<N;k++){let a=0,b=0;for(let n=0;n<N;n++){a+=m[y*N+n]*cs[k][n];b+=m[y*N+n]*sn[k][n];}tr[y*N+k]=a;ti[y*N+k]=b;}
  for(let x=0;x<N;x++)for(let k=0;k<N;k++){let a=0,b=0;for(let n=0;n<N;n++){const c=cs[k][n],s=sn[k][n],xr=tr[n*N+x],xi=ti[n*N+x];a+=xr*c-xi*s;b+=xr*s+xi*c;}re[k*N+x]=a;im[k*N+x]=b;}
  const rb=new Float32Array(6),rc=new Float32Array(6);
  for(let ky=0;ky<N;ky++)for(let kx=0;kx<N;kx++){const fy=ky>N/2?N-ky:ky,fx=kx>N/2?N-kx:kx,r=Math.hypot(fx,fy);if(r<1)continue;const b=Math.min(5,Math.floor(Math.log2(r)*1.2));rb[b]+=re[ky*N+kx]**2+im[ky*N+kx]**2;rc[b]++;}

  return {hist,spec,edge:e/3969};
}
function bDist(a,b){
  let h=0;for(let i=0;i<64;i++)h+=Math.abs(a.hist[i]-b.hist[i]);h/=2;
  let s=0;for(let i=0;i<6;i++)s+=Math.abs(a.spec[i]-b.spec[i]);s/=6;
  return .5*h+.3*s*2+.2*Math.abs(a.edge-b.edge)*3;
}

function cyanFrac(cv){
  const t=document.createElement('canvas');t.width=96;t.height=72;const g=t.getContext('2d',{willReadFrequently:true});g.drawImage(cv,0,0,96,72);const d=g.getImageData(0,0,96,72).data;let n=0;

    let h;if(mx===r)h=((gg-b)/dl+6)%6;else if(mx===gg)h=(b-r)/dl+2;else h=(r-gg)/dl+4;h*=60;if(h>=165&&h<=255)n++;}

function runModuleGate(thr=.08){

  ids.forEach((id,r)=>{feats[r]=[];let cs=0;srcs.forEach((s,c)=>{
    setSource(s[1],'B');STACK.layers=[mkLayer(id)];
    try{for(let i=0;i<4;i++){renderStack(BT+=1/60,1/60);frameNo++;}sg.drawImage(canvas,c*TW,r*TH,TW,TH);feats[r].push(bFeat(canvas));cs+=cyanFrac(canvas);}catch(e){errs.push(id+': '+String(e.message).slice(0,160));}
  });cyan[id]=+(cs/srcs.length).toFixed(3);all+=cs;allN+=srcs.length;});
  STACK.layers=saved;

  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    let d=0;for(let c=0;c<srcs.length;c++)d+=bDist(feats[i][c],feats[j][c]);pairs.push([+(d/srcs.length).toFixed(3),ids[i],ids[j]]);
    const diff=TRAITS[ids[i]].filter((v,k)=>v!==TRAITS[ids[j]][k]).length;if(diff<2)traitFail.push([ids[i],ids[j],diff]);

const INS={gallery:false,cat:'All'};
const $i=id=>document.getElementById(id);
const layer=()=>STACK.layers[STACK.sel]||STACK.layers[0];
const fmtv=(p,v)=>p.step&&p.step<1?(+v).toFixed(p.step<.2?2:1):String(Math.round(v*100)/100);

function rowRange(host,label,get,set,min,max,step){
  const r=el('div','ir'),l=el('span','l',label),inp=document.createElement('input'),v=document.createElement('input');
  inp.type='range';inp.min=min;inp.max=max;inp.step=step||1;v.className='v';v.type='text';v.inputMode='decimal';
  const paint=()=>{const x=get();inp.value=x;v.value=fmtv({step},x);inp.style.setProperty('--p',((x-min)/(max-min)*100)+'%');};
  inp.addEventListener('input',()=>{set(+inp.value);paint();});
  v.addEventListener('focus',()=>v.select());v.addEventListener('change',()=>{const n=parseFloat(v.value);if(!isNaN(n))set(Math.min(max,Math.max(min,n)));paint();});
  v.addEventListener('keydown',e=>{if(e.key==='Enter')v.blur();});
  /* drag a label to scrub */
  let sx=0,s0=0;
  l.addEventListener('pointerdown',e=>{sx=e.clientX;s0=get();l.setPointerCapture(e.pointerId);});
  l.addEventListener('pointermove',e=>{if(!l.hasPointerCapture(e.pointerId))return;const d=(e.clientX-sx)/(e.shiftKey?900:300)*(max-min);let n=s0+d;if(step)n=Math.round(n/step)*step;set(Math.min(max,Math.max(min,n)));paint();});
  r.append(l,inp,v);host.appendChild(r);paint();return paint;
}
function rowParam(host,p,V,onchange){
  const set=x=>{V[p.k]=x;onchange&&onchange(p);};
  if(p.t==='r')return rowRange(host,p.label||p.k,()=>V[p.k],set,p.min,p.max,p.step);
  const r=el('div','ir'),l=el('span','l',p.label||p.k);l.style.cursor='default';r.appendChild(l);
  if(p.t==='c'){const s=document.createElement('select');p.opts.forEach((o,i)=>{const op=document.createElement('option');op.value=i;op.textContent=o;s.appendChild(op);});s.value=V[p.k];s.addEventListener('change',()=>set(+s.value));r.appendChild(s);}
  else if(p.t==='b'){const c=document.createElement('input');c.type='checkbox';c.className='cb';c.checked=!!V[p.k];c.addEventListener('change',()=>set(c.checked));r.appendChild(c);}
  else if(p.t==='color'){const c=document.createElement('input');c.type='color';c.value=V[p.k];const h=document.createElement('input');h.className='hx';h.value=V[p.k];
    c.addEventListener('input',()=>{h.value=c.value;set(c.value);});h.addEventListener('change',()=>{if(/^#[0-9a-f]{6}$/i.test(h.value)){c.value=h.value;set(h.value);}});r.append(c,h);}
  host.appendChild(r);
}
function palEditor(host,p,V,onchange){
  const box=el('div','pe');
  const draw=()=>{
    box.innerHTML='';
    (V[p.k]||[]).forEach((hex,i)=>{
      const sl=el('div','sl'),c=document.createElement('input');c.type='color';c.value=hex;const h=document.createElement('input');h.className='hx';h.value=hex;
      const ch=x=>{V[p.k][i]=x;onchange&&onchange(p);};
      c.addEventListener('input',()=>{h.value=c.value;ch(c.value);});h.addEventListener('change',()=>{if(/^#[0-9a-f]{6}$/i.test(h.value)){c.value=h.value;ch(h.value);}});
      sl.append(c,h);
      if(V[p.k].length>2){const x=el('button','','×');x.setAttribute('aria-label','Remove color');x.style.minWidth='28px';x.addEventListener('click',()=>{V[p.k].splice(i,1);onchange&&onchange(p);draw();});sl.appendChild(x);}
      box.appendChild(sl);});
    const add=el('button','','+ Color');add.addEventListener('click',()=>{if(V[p.k].length<16){V[p.k].push('#ffffff');onchange&&onchange(p);draw();}});
    const cyc=el('button','','Cycle');cyc.addEventListener('click',()=>{V[p.k]=palCycle(V[p.k],1);onchange&&onchange(p);draw();});
    const sel=document.createElement('select');sel.className='hx';sel.style.cssText='min-height:34px;width:auto;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:600 11px var(--lab)';
    sel.innerHTML='<option>Presets</option>'+Object.entries(PALETTES).map(([c,o])=>`<optgroup label="${c}">`+Object.keys(o).map(n=>`<option value="${c}|${n}">${n}</option>`).join('')+'</optgroup>').join('');
    sel.addEventListener('change',()=>{const [c,n]=sel.value.split('|');if(PALETTES[c]&&PALETTES[c][n]){V[p.k]=PALETTES[c][n].slice();onchange&&onchange(p);draw();}});
    const imp=el('button','','Import');const fi=document.createElement('input');fi.type='file';fi.accept='.hex,.gpl,.txt';fi.hidden=true;
    imp.addEventListener('click',()=>fi.click());fi.addEventListener('change',async()=>{const a=palParse(await fi.files[0].text());if(a.length>=2){V[p.k]=a;onchange&&onchange(p);draw();}else toast('No colors found in that file');});
    const exp=el('button','','Export');exp.addEventListener('click',()=>{const b=new Blob([palGpl(V[p.k])],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='n0ise-palette.gpl';a.click();});
    box.append(add,cyc,sel,imp,exp,fi);
  };
  draw();host.appendChild(box);
}
function accordion(title,open){const d=document.createElement('details');d.className='acc';d.open=!!open;const s=document.createElement('summary');s.textContent=title;const b=el('div','bd');d.append(s,b);return{d,b};}

/* thumbnails: render a module over the current source into a small offscreen RT */
const TH={rt:null,src:null,buf:null};
function moduleThumb(id,w=160,h=120){
  const m=MODULES[id];if(!m)return null;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  if(id==='crtlab'){cv.getContext('2d').drawImage(canvas,0,0,w,h);return cv;}
  if(!TH.rt||TH.rt.w!==w){TH.rt=mkRT(w,h,{});TH.src=mkRT(w,h,{});TH.buf=new Uint8Array(w*h*4);}
  const sp=PR.srcp||(PR.srcp=mkProg(VS,F_SRCP));
  bindRT(TH.src);sp.use();samp(sp,'uSrc',0,TEX.src);sp.f('uSrcAsp',SRC.w/SRC.h);sp.f('uScrAsp',w/h);draw();
  const l=mkLayer(id);
  try{m.render(TH.src.tex,{t:1.3,dt:.016,out:TH.rt,layer:l,params:l.params,W:w,H:h});}catch(e){return cv;}
  bindRT(TH.rt);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,TH.buf);
  const im=new ImageData(w,h),row=w*4;for(let y=0;y<h;y++)im.data.set(TH.buf.subarray((h-1-y)*row,(h-y)*row),y*row);
  cv.getContext('2d').putImageData(im,0,0);bindRT(null);return cv;
}
function renderStrip(){
  const s=$i('strip');s.innerHTML='';
  STACK.layers.forEach((l,i)=>{
    const m=MODULES[l.module],b=el('button','ly'+(l.visible?'':' off'));b.setAttribute('aria-current',i===STACK.sel);b.title=m.name;
    const n=el('b','',String(i+1).padStart(2,'0'));const c=moduleThumb(l.module,112,60);c.style.height='30px';
    b.append(n,c,el('span','',m.name));
    b.addEventListener('click',()=>{STACK.sel=i;INS.gallery=false;renderInspector();});s.appendChild(b);});
  const a=el('button','add','+');a.setAttribute('aria-label','Add effect');a.addEventListener('click',()=>{INS.gallery=!INS.gallery;renderInspector();});s.appendChild(a);
  const sk=el('button','btn','Skin');sk.style.cssText='flex:none;margin-left:auto;align-self:center';sk.addEventListener('click',cycleSkin);s.appendChild(sk);
}
const SKINS=['lab','parchment','utility'];
function cycleSkin(){const cur=document.documentElement.dataset.skin||'lab',n=SKINS[(SKINS.indexOf(cur)+1)%SKINS.length];setSkin(n);toast('Skin: '+n);}
function setSkin(n){document.documentElement.dataset.skin=n;try{localStorage.setItem('n0ise.skin',n);}catch(e){}}

function renderGallery(host){
  const g=el('div','gal');const fams=['All',...new Set(Object.values(MODULES).filter(m=>!m.hidden).map(m=>m.family))];
  const cats=el('div','cats');fams.forEach(f=>{const b=el('button','',f);b.setAttribute('aria-pressed',INS.cat===f);b.addEventListener('click',()=>{INS.cat=f;renderInspector();});cats.appendChild(b);});
  const grid=el('div','grid');
  Object.values(MODULES).filter(m=>!m.hidden&&(INS.cat==='All'||m.family===INS.cat)).forEach(m=>{
    const t=el('button','tile'),c=moduleThumb(m.id),i=document.createElement('i');i.style.background=IDENT[m.id]||'#888';
    t.append(c,i,el('span','',m.name));
    t.addEventListener('click',()=>{if(m.id==='crtlab'&&STACK.layers.some(l=>l.module==='crtlab')){toast('CRT Lab is already in the stack');return;}
      STACK.layers.push(mkLayer(m.id));STACK.sel=STACK.layers.length-1;INS.gallery=false;renderInspector();});
    grid.appendChild(t);});
  g.append(cats,grid);host.appendChild(g);
}
function remix(l){
  const m=MODULES[l.module];l.seed=Math.random()*999|0;
  if(l.module==='crtlab'){shuffle();return;}
  for(const p of m.params){
    if(p.k==='seed')l.params.seed=Math.random()*999|0;
    else if(p.t==='r'){const span=p.max-p.min;l.params[p.k]=Math.min(p.max,Math.max(p.min,p.def+(Math.random()-.5)*span*.6));if(p.step>=1)l.params[p.k]=Math.round(l.params[p.k]);else l.params[p.k]=Math.round(l.params[p.k]/p.step)*p.step;}
    else if(p.t==='pal'){const cats=Object.values(PALETTES),c=cats[Math.random()*cats.length|0],ks=Object.keys(c);l.params[p.k]=c[ks[Math.random()*ks.length|0]].slice();}
    else if(p.t==='color'){let h,tries=0;do{h=Math.random()*360;tries++;}while(h>165&&h<255&&tries<20);l.params[p.k]=hslHex(h,.55+Math.random()*.4,.35+Math.random()*.35);}
  }
}
function hslHex(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));};return rgbHex([f(0),f(8),f(4)]);}
function shareStack(){
  const data=STACK.layers.map(l=>({m:l.module,p:l.module==='crtlab'?null:l.params,o:l.opacity,b:l.blend,s:l.showSource,sel:l.select,t:l.thr,pos:l.pos,z:l.size,seed:l.seed,v:l.visible}));
  const hash='#s='+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  history.replaceState(null,'',hash);
  (navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>toast('Link copied')).catch(()=>toast('Link is in the address bar'));
}
function loadStackHash(){
  const m=location.hash.match(/^#s=(.+)$/);if(!m)return;
  try{const a=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    STACK.layers=a.filter(x=>MODULES[x.m]).map(x=>{const l=mkLayer(x.m,x.p||undefined);Object.assign(l,{opacity:x.o,blend:x.b,showSource:x.s,select:x.sel,thr:x.t,pos:x.pos,size:x.z,seed:x.seed,visible:x.v});return l;});
    if(!STACK.layers.length)STACK.layers=[mkLayer('crtlab')];}catch(e){}
}
const presetsOf=id=>{try{return JSON.parse(localStorage.getItem('n0ise.p.'+id)||'[]');}catch(e){return[];}};
function renderInspector(){
  renderStrip();
  const host=$i('insp');host.innerHTML='';
  if(INS.gallery){renderGallery(host);return;}
  const l=layer(),m=MODULES[l.module],ix=STACK.sel;
  /* banner */
  const col=IDENT[l.module]||'#ccc',dark=parseInt(col.slice(1,3),16)*.3+parseInt(col.slice(3,5),16)*.59+parseInt(col.slice(5,7),16)*.11<140;
  const ban=el('div','ban');ban.style.background=col;ban.style.color=dark?'#fff':'#111';
  ban.append(el('div','no',String(ix+1).padStart(2,'0')),el('div','nm',m.name));host.appendChild(ban);
  const hd=el('div','hd');
  const mk=(t,f)=>{const b=el('button','btn',t);b.addEventListener('click',f);hd.appendChild(b);return b;};
  mk('Remix',()=>{remix(l);renderInspector();});
  mk('Share',shareStack);
  mk(l.visible?'Hide':'Show',()=>{l.visible=!l.visible;renderInspector();});
  if(ix>0)mk('Up',()=>{const a=STACK.layers;[a[ix-1],a[ix]]=[a[ix],a[ix-1]];STACK.sel=ix-1;renderInspector();});
  if(ix<STACK.layers.length-1)mk('Down',()=>{const a=STACK.layers;[a[ix+1],a[ix]]=[a[ix],a[ix+1]];STACK.sel=ix+1;renderInspector();});
  if(STACK.layers.length>1)mk('Delete',()=>{STACK.layers.splice(ix,1);STACK.sel=Math.max(0,ix-1);renderInspector();});
  host.appendChild(hd);
  /* presets */
  const pr=accordion('Presets',false);
  const pl=presetsOf(l.module),pw=el('div','pe');
  const sv=el('button','','Save preset');sv.addEventListener('click',()=>{const a=presetsOf(l.module);a.push({n:'Preset '+(a.length+1),p:JSON.parse(JSON.stringify(l.module==='crtlab'?P:l.params))});try{localStorage.setItem('n0ise.p.'+l.module,JSON.stringify(a.slice(-12)));}catch(e){}renderInspector();});
  pw.appendChild(sv);
  pl.forEach(x=>{const b=el('button','',x.n);b.addEventListener('click',()=>{if(l.module==='crtlab'){Object.assign(P,JSON.parse(JSON.stringify(x.p)));refreshUI();}else l.params=JSON.parse(JSON.stringify(x.p));renderInspector();});pw.appendChild(b);});
  pr.b.appendChild(pw);host.appendChild(pr.d);
  /* transform */
  const tf=accordion('Transform',false);
  rowRange(tf.b,'Opacity',()=>l.opacity,v=>l.opacity=v,0,100,1);
  const bs=el('div','ir');bs.appendChild(el('span','l','Blend'));const bsel=document.createElement('select');BLENDS.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b;bsel.appendChild(o);});bsel.value=l.blend;bsel.addEventListener('change',()=>l.blend=bsel.value);bs.appendChild(bsel);tf.b.appendChild(bs);
  rowParam(tf.b,{k:'showSource',t:'b',label:'Show source'},l,null);
  const ss=el('div','ir');ss.appendChild(el('span','l','Select'));const ssel=document.createElement('select');['all','edges','luma'].forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b==='all'?'All':b==='edges'?'Edges':'Luma range';ssel.appendChild(o);});ssel.value=l.select;ssel.addEventListener('change',()=>l.select=ssel.value);ss.appendChild(ssel);tf.b.appendChild(ss);
  rowRange(tf.b,'Threshold',()=>l.thr,v=>l.thr=v,0,100,1);
  rowRange(tf.b,'Position X',()=>l.pos[0],v=>l.pos[0]=v,-50,50,1);rowRange(tf.b,'Position Y',()=>l.pos[1],v=>l.pos[1]=v,-50,50,1);
  rowRange(tf.b,'Size',()=>l.size,v=>l.size=v,20,200,1);rowRange(tf.b,'Seed',()=>l.seed,v=>l.seed=v,0,999,1);
  host.appendChild(tf.d);
  /* module sections */
  if(l.module==='crtlab'){
    TABS.forEach(([tid,tn],i)=>{const a=accordion(tn,i===0);const pane=UI.panes[tid];pane.hidden=false;a.b.classList.add('legacy-body');a.b.appendChild(pane);host.appendChild(a.d);});
  }else{
    m.schema.sections.forEach((sec,i)=>{
      const a=accordion(sec.label,i<2);
      sec.keys.forEach(k=>{const p=m.params.find(x=>x.k===k);if(p.t==='pal')palEditor(a.b,p,l.params,null);else rowParam(a.b,p,l.params,null);});
      host.appendChild(a.d);});
  }
}
/* drag on canvas drives the selected module's hero params */
function wireHero(){
  let on=false;
  canvas.addEventListener('pointerdown',e=>{if(ST.paint)return;on=true;});
  addEventListener('pointerup',()=>on=false);
  canvas.addEventListener('pointermove',e=>{
    if(!on||ST.paint||!(e.buttons||e.pointerType==='touch'))return;
    const l=layer(),m=MODULES[l.module];const hero=m.schema.hero||[];if(!hero.length)return;
    const r=canvas.getBoundingClientRect(),ux=(e.clientX-r.left)/r.width,uy=1-(e.clientY-r.top)/r.height;
    const V=l.module==='crtlab'?P:l.params,defs=l.module==='crtlab'?CTL:Object.fromEntries(m.params.map(p=>[p.k,p]));
    [ux,uy].forEach((u,i)=>{const k=hero[i];if(!k||!defs[k])return;const p=defs[k];if(p.t&&p.t!=='r'&&p.t!==undefined&&p.t!=='r')return;V[k]=p.min+(p.max-p.min)*Math.min(1,Math.max(0,u));});
  });
}
/* bottom sheet snaps (mobile): peek / half / full */
function wireSheet(){
  const dock=$i('dock'),grab=$i('grab');let snap=1;
  const mq=matchMedia('(max-width:640px),(pointer:coarse) and (max-width:900px)');
  const H=()=>innerHeight,vis=[()=>56,()=>H()*.46,()=>H()*.86];
  const apply=(s,animate=true)=>{snap=s;const h=Math.round(H()*.86);dock.style.setProperty('--sheet',h+'px');
    dock.style.transition=animate?'transform .28s cubic-bezier(.2,.8,.2,1)':'none';
    dock.style.setProperty('--ty',(h-vis[s]())+'px');document.querySelector('.app').style.setProperty('--stagepad',Math.round(vis[s]())+'px');};
  let y0=0,t0=0,ty0=0,drag=false;
  grab.addEventListener('pointerdown',e=>{drag=true;y0=e.clientY;t0=performance.now();ty0=parseFloat(dock.style.getPropertyValue('--ty'))||0;grab.setPointerCapture(e.pointerId);dock.style.transition='none';});
  grab.addEventListener('pointermove',e=>{if(!drag)return;const h=Math.round(H()*.86);dock.style.setProperty('--ty',Math.max(0,Math.min(h-56,ty0+e.clientY-y0))+'px');});
  grab.addEventListener('pointerup',e=>{if(!drag)return;drag=false;const h=Math.round(H()*.86),ty=parseFloat(dock.style.getPropertyValue('--ty')),v=(e.clientY-y0)/Math.max(1,performance.now()-t0);
    const shown=h-ty+(-v*180);let best=0,bd=1e9;vis.forEach((f,i)=>{const d=Math.abs(f()-shown);if(d<bd){bd=d;best=i;}});apply(best);if(navigator.vibrate)navigator.vibrate(8);});
  grab.addEventListener('click',()=>{if(Math.abs(0)<1)return;});
  const upd=()=>{if(mq.matches)apply(snap,false);else{dock.style.removeProperty('--ty');dock.style.removeProperty('--sheet');document.querySelector('.app').style.removeProperty('--stagepad');}};
  mq.addEventListener('change',upd);addEventListener('resize',upd);upd();
}
(function boot(){
  applyProfile('studio');
  ST.pwrT0=now();
  buildUI();reorderBitmap();wire();
  if(GLOK){
    try{
      initGL();initLUT();
      setSource(demoCanvas(),'Demo');
    }catch(e){console.error(e);noGL('Setup failed: '+String(e.message||e).slice(0,500));}
  }
  lastSnap=JSON.stringify(P);
  refreshUI();
  setSkin((()=>{try{return localStorage.getItem('n0ise.skin');}catch(e){return null;}})()||'lab');
  loadStackHash();wireHero();wireSheet();renderInspector();
  requestAnimationFrame(loop);
  if(new URLSearchParams(location.search).get('bench'))setTimeout(runBench,600);
})();
